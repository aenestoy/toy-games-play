<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fog Lanes</title>
<style>
html,body{margin:0;height:100%;background:#0d0f1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Competitive prototype 1 — FOG LANES: a 2-minute live card duel (Clash Royale-like lanes) against a bot.
// Twist: the fog. Each side only sees its own half; enemy troops show up when they cross the river. You read
// your opponent from the elixir they spend and the lane they last used, they read you the same way.
'use strict';
const W = 1280, H = 720;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0;
function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = W * s * dpr; cv.height = H * s * dpr;
  scale = s * dpr; cv.style.marginTop = Math.max(0, (innerHeight - H * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

const FX0 = 60, FX1 = 1220, MID = (FX0 + FX1) / 2;
const LANES = [150, 300, 450];
const LANE_H = 120;
const CARDS = {
  knight:  { name: 'KNIGHT',  cost: 3, col: '#7fb2ff', make: { n: 1, hp: 650, dmg: 80, rate: 1.1, range: 34, speed: 55, r: 15 } },
  archers: { name: 'ARCHERS', cost: 3, col: '#ff9fd1', make: { n: 2, hp: 190, dmg: 48, rate: 1.0, range: 170, speed: 58, r: 11, shot: '#ff9fd1' } },
  giant:   { name: 'GIANT',   cost: 5, col: '#ffcf6a', make: { n: 1, hp: 2000, dmg: 140, rate: 1.5, range: 34, speed: 36, r: 22, towers: true } },
  goblins: { name: 'GOBLINS', cost: 2, col: '#8df07a', make: { n: 3, hp: 120, dmg: 45, rate: 0.8, range: 26, speed: 95, r: 10 } },
  wizard:  { name: 'WIZARD',  cost: 5, col: '#c79bff', make: { n: 1, hp: 420, dmg: 95, rate: 1.4, range: 150, speed: 52, r: 14, shot: '#d6b4ff', splash: 55 } },
  skeletons:{ name: 'SKELETONS', cost: 3, col: '#e8e8e8', make: { n: 6, hp: 50, dmg: 32, rate: 0.9, range: 22, speed: 80, r: 7 } },
  fireball:{ name: 'FIREBALL', cost: 4, col: '#ff6a3a', spell: { r: 75, dmg: 380, tower: 160 } },
};
const DECK = ['knight', 'archers', 'giant', 'goblins', 'wizard', 'skeletons', 'fireball', 'knight'];

let state, T;
function newSide(isPlayer) {
  const deck = DECK.slice().sort(() => Math.random() - 0.5);
  return { p: isPlayer, elixir: 5, hand: deck.slice(0, 4), queue: deck.slice(4), towers: LANES.map((y) => ({ y, hp: 1400, max: 1400, cd: 0 })), lastLane: -1, spent: 0 };
}
function reset() {
  state = { mode: 'play', time: 120, over: 0, units: [], shots: [], fx: [], texts: [], sel: -1, shake: 0, sudden: false, botT: 2 + Math.random() * 2, tells: [] };
  state.me = newSide(true); state.bot = newSide(false);
}
reset(); state.mode = 'title';

const towerX = (side) => (side.p ? FX0 + 40 : FX1 - 40);
const sideOf = (u) => (u.p ? state.me : state.bot);
const foeOf = (u) => (u.p ? state.bot : state.me);

function deploy(side, key, lane, x) {
  const c = CARDS[key];
  if (side.elixir < c.cost) return false;
  side.elixir -= c.cost; side.spent += c.cost; side.lastLane = lane;
  const y = LANES[lane];
  if (c.spell) {
    // fireball: flies from your tower to the point
    state.shots.push({ x: towerX(side), y, tx: x, ty: y, sp: 900, spell: c.spell, p: side.p, lane, col: c.col, big: true });
  } else {
    const m = c.make;
    for (let i = 0; i < m.n; i++) {
      state.units.push({ p: side.p, lane, x: x + (side.p ? -i * 12 : i * 12), y: y + (i - (m.n - 1) / 2) * 14, hp: m.hp, max: m.hp, cd: 0.6, key, col: c.col, ...m, hit: 0, born: 0 });
    }
  }
  // the opponent only sees a ripple at the river when a card is played on the far side (the tell)
  state.tells.push({ p: side.p, lane, t: 1.2, cost: c.cost });
  const hand = side.hand, i = hand.indexOf(key);
  hand.splice(i, 1); side.queue.push(key); hand.push(side.queue.shift());
  return true;
}

function visible(u) { return u.p || u.x <= MID + 10; } // enemy troops are seen only on our half

function step(dt) {
  const S = state;
  if (S.mode !== 'play') return;
  S.time -= dt;
  const rate = (S.time < 30 || S.sudden ? 2 : 1) / 1.4;
  for (const s of [S.me, S.bot]) s.elixir = Math.min(10, s.elixir + rate * dt);
  if (S.time <= 0) {
    const a = S.me.towers.filter((t) => t.hp > 0).length, b = S.bot.towers.filter((t) => t.hp > 0).length;
    if (a !== b || S.sudden) return end(a > b ? 1 : a < b ? -1 : 0);
    S.sudden = true; S.time = 30; text('SUDDEN DEATH', W / 2, 330, '#ff5a5a', 48, 1.6);
  }
  // units
  for (const u of S.units) {
    u.born += dt; u.hit = Math.max(0, u.hit - dt); u.cd -= dt;
    const dir = u.p ? 1 : -1, foe = foeOf(u);
    let target = null, td = 1e9;
    if (!u.towers) for (const v of S.units) {
      if (v.p === u.p || v.lane !== u.lane || v.hp <= 0) continue;
      const d = Math.abs(v.x - u.x);
      if ((v.x - u.x) * dir > -30 && d < Math.max(u.range, 120) && d < td) { td = d; target = v; }
    }
    const tw = foe.towers[u.lane];
    if (!target && tw.hp > 0) { target = tw; td = Math.abs(towerX(foe) - u.x); }
    if (!target) { // lane's tower down: walk to the nearest standing tower
      const alive = foe.towers.findIndex((t) => t.hp > 0);
      if (alive >= 0) { u.lane = alive; u.y += (LANES[alive] - u.y) * Math.min(1, dt * 2); }
    }
    const reach = u.range + (target && target.r ? target.r : 30);
    if (target && td <= reach) {
      if (u.cd <= 0) {
        u.cd = u.rate;
        const tx = target.x ?? towerX(foe), ty = target.y;
        if (u.shot) S.shots.push({ x: u.x, y: u.y, tx, ty, sp: 520, dmg: u.dmg, target, p: u.p, col: u.shot, splash: u.splash, lane: u.lane });
        else { hurt(target, u.dmg, u.p); S.fx.push({ x: tx, y: ty, t: 0.18, r: 14, col: '#fff' }); }
      }
    } else u.x += dir * u.speed * dt;
    u.y += (LANES[u.lane] - u.y) * Math.min(1, dt * 0.8) * 0.3;
  }
  S.units = S.units.filter((u) => u.hp > 0);
  // towers shoot
  for (const side of [S.me, S.bot]) for (const [i, t] of side.towers.entries()) {
    if (t.hp <= 0) continue;
    t.cd -= dt;
    const x = towerX(side);
    let best = null, bd = 230;
    for (const u of S.units) if (u.p !== side.p && Math.abs(u.x - x) < bd && Math.abs(u.y - t.y) < 70) { bd = Math.abs(u.x - x); best = u; }
    if (best && t.cd <= 0) { t.cd = 0.8; S.shots.push({ x, y: t.y - 20, tx: best.x, ty: best.y, sp: 700, dmg: 70, target: best, p: side.p, col: side.p ? '#9fd0ff' : '#ff9a9a' }); }
  }
  // shots
  for (const s of S.shots) {
    const tx = s.target && s.target.hp > 0 && s.target.x != null ? s.target.x : s.tx, ty = s.target && s.target.hp > 0 ? s.target.y : s.ty;
    const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy), m = s.sp * dt;
    if (d <= m) {
      s.done = true;
      if (s.spell) {
        S.fx.push({ x: tx, y: ty, t: 0.45, r: s.spell.r, col: '#ff7a3a', boom: true }); S.shake = 10;
        for (const u of S.units) if (u.p !== s.p && Math.hypot(u.x - tx, u.y - ty) < s.spell.r) hurt(u, s.spell.dmg, s.p);
        const foe = s.p ? S.bot : S.me, t = foe.towers[s.lane];
        if (t.hp > 0 && Math.abs(towerX(foe) - tx) < s.spell.r + 30) hurt(t, s.spell.tower, s.p, foe);
      } else if (s.splash) {
        S.fx.push({ x: tx, y: ty, t: 0.25, r: s.splash, col: s.col, boom: true });
        for (const u of S.units) if (u.p !== s.p && Math.hypot(u.x - tx, u.y - ty) < s.splash) hurt(u, s.dmg, s.p);
        if (s.target && s.target.max === 1400) hurt(s.target, s.dmg, s.p);
      } else if (s.target && s.target.hp > 0) hurt(s.target, s.dmg, s.p);
    } else { s.x += (dx / d) * m; s.y += (dy / d) * m; }
  }
  S.shots = S.shots.filter((s) => !s.done);
  for (const f of S.fx) f.t -= dt; S.fx = S.fx.filter((f) => f.t > 0);
  for (const t of S.texts) { t.t -= dt; t.y -= 30 * dt; } S.texts = S.texts.filter((t) => t.t > 0);
  for (const t of S.tells) t.t -= dt; S.tells = S.tells.filter((t) => t.t > 0);
  S.shake = Math.max(0, S.shake - dt * 30);
  bot(dt);
  if (S.me.towers.every((t) => t.hp <= 0)) end(-1);
  else if (S.bot.towers.every((t) => t.hp <= 0)) end(1);
}

function hurt(t, dmg, byP, towerSide) {
  if (t.hp <= 0) return;
  t.hp -= dmg; t.hit = 0.12;
  if (t.max === 1400) {
    const side = towerSide || (state.me.towers.includes(t) ? state.me : state.bot);
    text('-' + dmg, towerX(side), t.y - 50, '#ffd36a', 22, 0.6);
    if (t.hp <= 0) { state.shake = 16; text('TOWER DOWN!', towerX(side) + (side.p ? 120 : -120), t.y, side.p ? '#ff6a6a' : '#7dff9a', 34, 1.4); }
  }
}
function text(s, x, y, col, size, t) { state.texts.push({ s, x, y, col, size, t, max: t }); }
function end(r) { state.mode = 'over'; state.result = r; }

// the bot: reads only what it can see (its half) plus your tells, keeps an elixir reserve, defends then pushes
function bot(dt) {
  const S = state, B = S.bot;
  S.botT -= dt;
  if (S.botT > 0) return;
  S.botT = 0.6 + Math.random() * 1.2;
  const threats = LANES.map((_, i) => S.units.filter((u) => u.p && u.lane === i && u.x > MID - 40).reduce((a, u) => a + u.hp, 0));
  const worst = threats.indexOf(Math.max(...threats));
  const playable = B.hand.filter((k) => CARDS[k].cost <= B.elixir);
  if (!playable.length) return;
  if (threats[worst] > 250) {
    const pick = playable.find((k) => k === 'fireball' && threats[worst] > 500) || playable.find((k) => !CARDS[k].spell && k !== 'giant') || playable[0];
    const front = Math.min(...S.units.filter((u) => u.p && u.lane === worst).map((u) => u.x), FX1);
    deploy(B, pick, worst, CARDS[pick].spell ? front + 10 : Math.max(MID + 60, Math.min(FX1 - 90, front + 140)));
    return;
  }
  if (B.elixir < 7 + Math.random() * 2) return;
  const towersHp = S.me.towers.map((t) => (t.hp > 0 ? t.hp : 99999));
  const lane = Math.random() < 0.6 ? towersHp.indexOf(Math.min(...towersHp)) : Math.floor(Math.random() * 3);
  const pick = playable.filter((k) => !CARDS[k].spell)[0];
  if (pick) deploy(B, pick, lane, FX1 - 100);
}

// ---------------- input
let downAt = null;
function toLogical(e) { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H]; }
const CARD_Y = 600, CARD_W = 150, CARD_H = 104;
const cardX = (i) => 300 + i * (CARD_W + 16);
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const [x, y] = toLogical(e);
  const S = state;
  if (S.mode !== 'play') { reset(); return; }
  for (let i = 0; i < 4; i++) if (x > cardX(i) && x < cardX(i) + CARD_W && y > CARD_Y && y < CARD_Y + CARD_H) { S.sel = S.sel === i ? -1 : i; return; }
  if (S.sel >= 0 && y < 540) {
    const lane = LANES.reduce((b, ly, i) => (Math.abs(ly - y) < Math.abs(LANES[b] - y) ? i : b), 0);
    const key = S.me.hand[S.sel];
    const spell = CARDS[key].spell;
    const px = spell ? Math.min(FX1 - 30, Math.max(FX0 + 30, x)) : Math.min(MID - 20, Math.max(FX0 + 80, x));
    if (deploy(S.me, key, lane, px)) S.sel = -1;
    else text('NOT ENOUGH ELIXIR', x, y, '#ff8a8a', 22, 0.8);
  }
});
addEventListener('keydown', (e) => { const n = +e.key; if (n >= 1 && n <= 4 && state.mode === 'play') state.sel = n - 1; if (e.code === 'Space' && state.mode !== 'play') reset(); });

// ---------------- drawing
function draw() {
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const S = state;
  const sx = (Math.random() - 0.5) * S.shake, sy = (Math.random() - 0.5) * S.shake;
  g.translate(sx, sy);
  g.fillStyle = '#16301f'; g.fillRect(-20, -20, W + 40, H + 40);
  // lanes
  for (const y of LANES) { g.fillStyle = '#c8a874'; g.globalAlpha = 0.25; g.fillRect(FX0, y - 28, FX1 - FX0, 56); g.globalAlpha = 1; }
  // river
  g.fillStyle = '#2a6fa8'; g.fillRect(MID - 18, 60, 36, 470);
  for (const y of LANES) { g.fillStyle = '#7a5a34'; g.fillRect(MID - 26, y - 22, 52, 44); }
  // fog over the enemy half
  const fogA = 0.72 + Math.sin(performance.now() / 900) * 0.04;
  const grd = g.createLinearGradient(MID, 0, MID + 140, 0);
  grd.addColorStop(0, 'rgba(20,24,40,' + fogA * 0.4 + ')'); grd.addColorStop(1, 'rgba(20,24,40,' + fogA + ')');
  g.fillStyle = grd; g.fillRect(MID + 18, 60, FX1 - MID + 60, 470);
  // towers
  for (const side of [S.me, S.bot]) for (const t of side.towers) {
    const x = towerX(side);
    if (t.hp <= 0) { g.fillStyle = '#3a3a3a'; g.fillRect(x - 26, t.y - 10, 52, 30); continue; }
    g.fillStyle = side.p ? '#3d6fd8' : '#d83d4f'; g.fillRect(x - 28, t.y - 40, 56, 66);
    g.fillStyle = '#fff'; g.globalAlpha = t.hit > 0 ? 0.6 : 0; g.fillRect(x - 28, t.y - 40, 56, 66); g.globalAlpha = 1;
    bar(x - 32, t.y - 54, 64, t.hp / t.max, side.p ? '#7dc3ff' : '#ff7d7d');
  }
  // units
  for (const u of S.units) {
    if (!visible(u)) continue;
    const a = u.p ? 1 : Math.min(1, (MID + 10 - u.x) / 40 + 0.4);
    g.globalAlpha = a;
    g.fillStyle = u.hit > 0 ? '#fff' : u.col;
    g.beginPath(); g.arc(u.x, u.y, u.r, 0, 7); g.fill();
    g.lineWidth = 3; g.strokeStyle = u.p ? '#2b5bd8' : '#d82b3f'; g.stroke();
    if (u.hp < u.max) bar(u.x - u.r, u.y - u.r - 9, u.r * 2, u.hp / u.max, u.p ? '#7dc3ff' : '#ff7d7d');
    g.globalAlpha = 1;
  }
  // tells: a ripple on the river when the other side spends elixir (and how much)
  for (const t of S.tells) if (!t.p) {
    const y = LANES[t.lane], k = 1 - t.t / 1.2;
    g.strokeStyle = 'rgba(255,120,120,' + (1 - k) + ')'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(MID + 60, y, 20 + k * 60, 10 + k * 26, 0, 0, 7); g.stroke();
    g.fillStyle = 'rgba(255,170,170,' + (1 - k) + ')'; g.font = 'bold 20px system-ui'; g.textAlign = 'center'; g.fillText('?' + ' ' + t.cost, MID + 60, y - 30);
  }
  for (const s of S.shots) { if (!s.p && s.x > MID + 10 && !s.big) continue; g.fillStyle = s.col; g.beginPath(); g.arc(s.x, s.y, s.big ? 14 : 5, 0, 7); g.fill(); }
  for (const f of S.fx) { g.globalAlpha = Math.min(1, f.t * 3); g.fillStyle = f.col; g.beginPath(); g.arc(f.x, f.y, f.boom ? f.r * (1.2 - f.t) : f.r, 0, 7); g.fill(); g.globalAlpha = 1; }
  g.setTransform(scale, 0, 0, scale, 0, 0);
  // HUD
  g.textAlign = 'center';
  for (const t of S.texts) { g.globalAlpha = Math.min(1, t.t / t.max * 2); g.fillStyle = t.col; g.font = '900 ' + t.size + 'px system-ui'; g.fillText(t.s, t.x, t.y); g.globalAlpha = 1; }
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(W / 2 - 80, 8, 160, 44);
  g.fillStyle = S.sudden ? '#ff6a6a' : '#fff'; g.font = '900 30px system-ui';
  const tm = Math.max(0, Math.ceil(S.time)); g.fillText(Math.floor(tm / 60) + ':' + String(tm % 60).padStart(2, '0'), W / 2, 42);
  g.font = '700 18px system-ui'; g.fillStyle = '#9fd0ff'; g.textAlign = 'left'; g.fillText('YOU', 70, 36);
  g.textAlign = 'right'; g.fillStyle = '#ff9a9a'; g.fillText('BOT  ·  hidden in the fog', W - 70, 36);
  g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '600 15px system-ui'; g.fillText('Enemy cards played: ' + S.bot.spent + ' elixir', W - 330, 56);
  // card bar
  g.fillStyle = '#10131f'; g.fillRect(0, 560, W, 160);
  const el = S.me.elixir;
  g.fillStyle = '#2a1840'; g.fillRect(300, 572, 4 * CARD_W + 48, 18);
  g.fillStyle = '#c04bff'; g.fillRect(300, 572, (4 * CARD_W + 48) * el / 10, 18);
  g.fillStyle = '#fff'; g.font = '800 16px system-ui'; g.textAlign = 'left'; g.fillText(Math.floor(el) + ' / 10 ELIXIR', 300 + 4 * CARD_W + 60, 587);
  S.me.hand.forEach((k, i) => {
    const c = CARDS[k], x = cardX(i), ok = el >= c.cost;
    g.fillStyle = S.sel === i ? '#3a3f66' : '#232741'; g.fillRect(x, CARD_Y, CARD_W, CARD_H);
    g.lineWidth = 3; g.strokeStyle = S.sel === i ? '#ffd36a' : c.col; g.strokeRect(x, CARD_Y, CARD_W, CARD_H);
    g.globalAlpha = ok ? 1 : 0.4;
    g.fillStyle = c.col; g.beginPath(); g.arc(x + CARD_W / 2, CARD_Y + 40, 22, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '800 15px system-ui'; g.textAlign = 'center'; g.fillText(c.name, x + CARD_W / 2, CARD_Y + 86);
    g.fillStyle = '#d58bff'; g.font = '900 18px system-ui'; g.fillText(c.cost, x + 16, CARD_Y + 22);
    g.globalAlpha = 1;
  });
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '600 15px system-ui'; g.textAlign = 'left';
  g.fillText(S.sel >= 0 ? 'Now tap a lane on YOUR side' : 'Tap a card (or 1-4), then a lane', 30, 600);
  g.fillText('Next: ' + CARDS[S.me.queue[0]].name, 30, 626);
  if (S.mode === 'title' || S.mode === 'over') {
    g.fillStyle = 'rgba(5,6,12,.82)'; g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.fillStyle = '#ffd36a'; g.font = '900 64px system-ui';
    g.fillText(S.mode === 'title' ? 'FOG LANES' : S.result > 0 ? 'VICTORY!' : S.result < 0 ? 'DEFEAT' : 'DRAW', W / 2, 250);
    g.fillStyle = '#fff'; g.font = '600 24px system-ui';
    const lines = S.mode === 'title'
      ? ['A 2-minute card duel. Destroy the enemy towers.', 'The twist: you cannot see the enemy half.', 'Their troops appear only when they cross the river.', 'A ripple shows where they spent elixir - read them.']
      : ['Towers left - you: ' + S.me.towers.filter((t) => t.hp > 0).length + '   bot: ' + S.bot.towers.filter((t) => t.hp > 0).length];
    lines.forEach((l, i) => g.fillText(l, W / 2, 320 + i * 36));
    g.fillStyle = '#7dff9a'; g.font = '800 30px system-ui'; g.fillText('TAP TO ' + (S.mode === 'title' ? 'PLAY' : 'PLAY AGAIN'), W / 2, 520);
  }
}
function bar(x, y, w, k, col) { g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x, y, w, 6); g.fillStyle = col; g.fillRect(x, y, w * Math.max(0, k), 6); }

let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
