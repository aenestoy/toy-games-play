<!doctype html>
<html><head><meta charset="utf-8" /><meta name="robots" content="noindex, nofollow" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ninja Streets co-op</title>
<script>
// The co-op trial folder now opens the real game (ninja-streets-3d, 1.2.0 with PLAY WITH A FRIEND):
// coop/ = make a room, coop/?K7QM (a bare code) = join it; anything else is passed on as it is.
(function () {
  var q = location.search.replace(/^\?/, '');
  var code = /^[a-z2-9]{2,6}$/i.test(q) ? q.toUpperCase() : '';
  var to = '../ninja-streets-3d/' + (code ? '?coop=join&room=' + code : q ? '?' + q : '?coop=host');
  location.replace(to + location.hash);
})();
</script>
</head><body style="background:#120c18;color:#eee;font:16px system-ui,sans-serif;text-align:center;padding-top:40vh"><a style="color:#ffe08a" href="../ninja-streets-3d/">Ninja Streets</a></body></html>
