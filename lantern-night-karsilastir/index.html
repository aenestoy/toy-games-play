<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Lantern Night: eski ve yeni</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#12101c;color:#eee;font:15px system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:14px 12px 24px}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 10px;color:#aaa}
.t{display:flex;gap:8px;margin-bottom:10px}.t button{flex:1;padding:10px;border-radius:10px;border:2px solid #3a3350;background:#1f1b2b;color:#eee;font:inherit;cursor:pointer}
.t button[aria-pressed=true]{border-color:#ffcf3f;color:#ffcf3f}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g div{display:grid;gap:6px}.g b{text-align:center}
iframe{width:100%;aspect-ratio:9/16;border:2px solid #3a3350;border-radius:10px;background:#000}
@media(max-width:520px){.g{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>Lantern Night: eski ve yeni</h1>
<p>Solda kodla çizilen eski hâl, sağda resimli yeni hâl (fenerler, gece arka planı, haritadaki köy evi). İkisi de oynanır. Harita sekmesinde bütün parçalar yanmış gösterilir; yalnız sol alttaki köy evi resimle değişti.</p>
<div class="t"><button id="b1" aria-pressed="true">Oyun</button><button id="b2" aria-pressed="false">Harita (yanmış hâl)</button></div>
<div class="g"><div><b>Eski</b><iframe id="a"></iframe></div><div><b>Yeni (resimli)</b><iframe id="b"></iframe></div></div>
</div><script>
const A=document.getElementById('a'),B=document.getElementById('b'),b1=document.getElementById('b1'),b2=document.getElementById('b2');
function go(map){const q=map?'view=map&lit=1&':'';A.src='../lantern-night/?'+q+'mute=1&st=0';B.src='../lantern-night/?'+q+'art=1&mute=1&st=0';b1.setAttribute('aria-pressed',!map);b2.setAttribute('aria-pressed',map)}
b1.onclick=()=>go(false);b2.onclick=()=>go(true);go(false);
</script></body></html>
