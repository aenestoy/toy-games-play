<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#7cc4f5">
	<link rel="preload" as="fetch" crossorigin href="archive/archive_files.json">
	<link rel="preload" as="fetch" crossorigin href="Truckstead_wasm.js">
	<link rel="preload" as="fetch" crossorigin href="Truckstead.wasm">
	<title>Truckstead (Defold max)</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #9fd6f7; }
		body { position: fixed; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
		.canvas-app-container { width: 100%; height: 100%; position: absolute; overflow: hidden; }
		#canvas-container { position: relative; }
		#canvas { outline: none; border: 0; width: 100%; vertical-align: bottom; display: block; }
		#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
			background: linear-gradient(#7cc4f5, #cdeefa 60%, #8fd06a 60.2%, #6fb84f); color: #1d2a44; font: 900 22px system-ui, sans-serif; z-index: 50; transition: opacity .25s; }
		#loading .bar { width: 180px; height: 10px; border-radius: 6px; background: rgba(29, 42, 68, 0.2); overflow: hidden; }
		#loading .bar i { display: block; height: 100%; width: 0%; background: #ffc83d; border-radius: 6px; transition: width .2s; }
		#perf { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 60; background: rgba(0,0,0,.72); color: #fff; font: 11px/1.35 ui-monospace, monospace;
			padding: 5px 8px; border-radius: 8px; white-space: pre; pointer-events: auto; display: none; }
		#perf button { font: 700 11px system-ui; margin-top: 4px; border: 0; border-radius: 6px; padding: 4px 8px; background: #ffc83d; color: #1d2a44; }
	</style>
</head>
<body>
	<div id="app-container" class="canvas-app-container">
		<div id="canvas-container" class="canvas-app-canvas-container">
			<canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="880" height="400"></canvas>
		</div>
	</div>
	<div id="loading"><div>TRUCKSTEAD</div><div class="bar"><i id="loadbar"></i></div></div>
	<div id="perf"></div>
	<script>
		if (typeof globalThis === 'undefined') window.globalThis = window;
		// timings for the engine comparison (read by tools/bench.mjs and the ?perf=1 readout)
		window.__ts = { nav: 0 };
		(function () {
			var q = location.search;
			var perf = /[?&](perf|bench)=1/.test(q);
			window.__perfOn = perf;
			if (!perf) return;
			// frame gaps and the engine's own frame work (the rAF callback), last 20 000 frames
			var gaps = [], work = [], calls = [], tris = [], last = 0, curCalls = 0, curTris = 0;
			window.__perf = { gaps: gaps, work: work, calls: calls, tris: tris, reset: function () { gaps.length = work.length = calls.length = tris.length = 0; } };
			var raf = window.requestAnimationFrame.bind(window);
			window.requestAnimationFrame = function (cb) {
				return raf(function (t) {
					if (last && gaps.length < 20000) gaps.push(t - last);
					last = t;
					var w0 = performance.now();
					curCalls = 0; curTris = 0;
					cb(t);
					if (work.length < 20000) { work.push(performance.now() - w0); calls.push(curCalls); tris.push(curTris); }
				});
			};
			// count draw calls and triangles on the WebGL context
			var tri = function (mode, n) { return mode === 4 ? n / 3 : mode === 5 || mode === 6 ? Math.max(0, n - 2) : 0; };
			var wrap = function (gl) {
				if (!gl || gl.__wrapped) return gl;
				gl.__wrapped = true;
				var de = gl.drawElements, da = gl.drawArrays;
				gl.drawElements = function (m, c, t, o) { curCalls++; curTris += tri(m, c); return de.call(this, m, c, t, o); };
				gl.drawArrays = function (m, f, c) { curCalls++; curTris += tri(m, c); return da.call(this, m, f, c); };
				if (gl.drawElementsInstanced) { var dei = gl.drawElementsInstanced; gl.drawElementsInstanced = function (m, c, t, o, n) { curCalls++; curTris += tri(m, c) * n; return dei.call(this, m, c, t, o, n); }; }
				if (gl.drawArraysInstanced) { var dai = gl.drawArraysInstanced; gl.drawArraysInstanced = function (m, f, c, n) { curCalls++; curTris += tri(m, c) * n; return dai.call(this, m, f, c, n); }; }
				var ge = gl.getExtension;
				gl.getExtension = function (name) {
					var ext = ge.call(this, name);
					if (ext && name === 'ANGLE_instanced_arrays' && !ext.__wrapped) {
						ext.__wrapped = true;
						var a = ext.drawArraysInstancedANGLE, e = ext.drawElementsInstancedANGLE;
						ext.drawArraysInstancedANGLE = function (m, f, c, n) { curCalls++; curTris += tri(m, c) * n; return a.call(this, m, f, c, n); };
						ext.drawElementsInstancedANGLE = function (m, c, t, o, n) { curCalls++; curTris += tri(m, c) * n; return e.call(this, m, c, t, o, n); };
					}
					return ext;
				};
				return gl;
			};
			var gc = HTMLCanvasElement.prototype.getContext;
			HTMLCanvasElement.prototype.getContext = function (type, attrs) {
				var ctx = gc.call(this, type, attrs);
				return type && type.indexOf('webgl') === 0 ? wrap(ctx) : ctx;
			};
		})();
	</script>
	<script id="engine-loader" src="dmloader.js"></script>
	<script id="engine-setup">
		// Stretch to the window with a capped render scale (the baseline caps the pixel ratio at 1.5; ?pr= overrides)
		(function () {
			var m = /[?&]pr=([0-9.]+)/.exec(location.search);
			var cap = m ? parseFloat(m[1]) : 1.5;
			window.__dpr = Math.min(window.devicePixelRatio || 1, cap);
			if (m) window.__dpr = cap;
		})();
		CUSTOM_PARAMETERS.resize_window_callback = function () {
			var app = document.getElementById('app-container');
			var canvas = document.getElementById('canvas');
			var w = window.innerWidth, h = window.innerHeight;
			if (CUSTOM_PARAMETERS.resize_window_prev_inner_width == w && CUSTOM_PARAMETERS.resize_window_prev_inner_height == h) return;
			CUSTOM_PARAMETERS.resize_window_prev_inner_width = w;
			CUSTOM_PARAMETERS.resize_window_prev_inner_height = h;
			var m = /[?&]pr=([0-9.]+)/.exec(location.search);
			var cap = m ? parseFloat(m[1]) : 1.5;
			var dpi = m ? cap : Math.min(window.devicePixelRatio || 1, cap);
			window.__dpr = dpi;
			app.style.width = w + 'px';
			app.style.height = h + 'px';
			canvas.width = Math.floor(w * dpi);
			canvas.height = Math.floor(h * dpi);
		};
		CUSTOM_PARAMETERS.update_progress = function (p) {
			var b = document.getElementById('loadbar');
			if (b) b.style.width = Math.max(5, Math.min(100, p)) + '%';
		};
		CUSTOM_PARAMETERS.start_success = function () { window.__ts.engineStart = performance.now(); };
		// the loading screen stays until the game has drawn its first frame
		(function hide() {
			if (window.__ts.firstFrame) {
				var l = document.getElementById('loading');
				if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 260); }
				return;
			}
			setTimeout(hide, 30);
		})();
		// ?perf=1: fps / frame-time readout with a copy button (for measuring on a real phone)
		(function () {
			if (!window.__perfOn) return;
			var el = document.getElementById('perf');
			el.style.display = 'block';
			var pct = function (a, p) { if (!a.length) return 0; var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]; };
			var report = function () {
				var P = window.__perf, n = Math.min(P.gaps.length, 600);
				var g = P.gaps.slice(-n), w = P.work.slice(-n);
				var mean = g.reduce(function (a, b) { return a + b; }, 0) / (g.length || 1);
				var slow = g.filter(function (x) { return x > 20; }).length;
				var mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + ' MB JS' : '';
				var heap = (window.Module && Module.HEAPU8) ? (Module.HEAPU8.length / 1048576).toFixed(0) + ' MB wasm' : '';
				var st = window.__st || {};
				return 'Truckstead / Defold  ' + (window.__dpr || 1) + 'x  ' + innerWidth + 'x' + innerHeight + '\n' +
					'fps ' + (1000 / mean).toFixed(1) + '  frame p50 ' + pct(g, 50).toFixed(1) + '  p95 ' + pct(g, 95).toFixed(1) + ' ms  >20ms ' + (100 * slow / (g.length || 1)).toFixed(1) + '%\n' +
					'engine work p50 ' + pct(w, 50).toFixed(2) + ' p95 ' + pct(w, 95).toFixed(2) + ' ms  draws ' + (P.calls[P.calls.length - 1] || 0) + '  tris ' + Math.round(P.tris[P.tris.length - 1] || 0) + '\n' +
					'first frame ' + ((window.__ts.firstFrame || 0) / 1000).toFixed(2) + ' s  ' + mem + '  ' + heap + '  lua ' + (st.lua_kb || 0) + ' KB  mode ' + (st.mode || '') + '\n' +
					navigator.userAgent;
			};
			var txt = document.createElement('div');
			var btn = document.createElement('button');
			btn.textContent = 'COPY REPORT';
			btn.onclick = function () {
				var r = report();
				try { navigator.clipboard.writeText(r); btn.textContent = 'COPIED'; } catch (e) { window.prompt('Copy:', r); }
				setTimeout(function () { btn.textContent = 'COPY REPORT'; }, 1500);
			};
			el.appendChild(txt);
			el.appendChild(btn);
			setInterval(function () { txt.textContent = report(); }, 500);
		})();
	</script>
	<script id="engine-start">
		EngineLoader.load("canvas", "Truckstead");
	</script>
</body>
</html>
