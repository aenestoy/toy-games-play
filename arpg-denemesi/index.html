<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Riftborn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Riftborn trial: a Path of Exile-style map run. Canvas for the crypt and HUD, DOM for the character panel and buttons. */
html,body{margin:0;height:100%;overflow:hidden;background:#07050c;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Fredoka,system-ui,sans-serif;color:#e8e0d0}
#c{display:block;position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
.btn{font:inherit;font-weight:700;border:1px solid #8a6a3a;border-radius:10px;padding:10px 20px;font-size:18px;color:#f4e6c8;background:linear-gradient(#3a2a1a,#1e140c);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,220,160,.2);cursor:pointer;font-family:Cinzel,serif;letter-spacing:.04em}
.btn:active{transform:translateY(2px)}
.btn.small{font-size:13px;padding:6px 10px}
.btn[disabled]{opacity:.45;cursor:default}
.ov{position:fixed;inset:0;display:grid;place-items:safe center;background:radial-gradient(ellipse at center,rgba(40,20,10,.5),rgba(4,2,8,.92));padding:12px;overflow:auto;touch-action:pan-y}
.title{font-family:Cinzel,serif;font-weight:800;font-size:clamp(42px,11vw,76px);color:#e8b860;text-shadow:0 0 24px rgba(255,140,40,.45),0 4px 0 #2a1406;margin:0;letter-spacing:.06em}
.box{text-align:center;max-width:560px;width:100%}
.box p{color:#cbb894;line-height:1.5;margin:8px 0}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 18px;font-size:13px}
.keys span{border:1px solid #4a3a28;border-radius:8px;padding:4px 8px;background:rgba(0,0,0,.35)}
#panel{position:fixed;inset:0;display:grid;place-items:safe center;background:rgba(3,2,6,.78);padding:10px;overflow:auto;touch-action:pan-y}
.pc{width:min(760px,100%);background:linear-gradient(#1c140e,#120c08);border:1px solid #6a4e2a;border-radius:14px;box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,200,120,.08);padding:12px}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tab{font-family:Cinzel,serif;font-weight:800;border:1px solid #4a3a28;background:#160f0a;color:#b8a07a;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{color:#ffd890;border-color:#c89a50;background:#2a1c10}
.tab b{color:#7be05a}
.x{margin-left:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.slotrow{display:flex;align-items:center;gap:8px;border:1px solid #3a2c1e;border-radius:8px;padding:6px 8px;margin-bottom:6px;background:rgba(0,0,0,.25);cursor:pointer;min-height:24px}
.slotrow em{font-style:normal;color:#7a6a52;font-size:12px;width:58px;flex:0 0 58px;text-transform:uppercase}
.slotrow span{font-size:14px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px}
.it{border:1px solid #3a2c1e;border-radius:6px;padding:5px;font-size:12px;cursor:pointer;background:rgba(0,0,0,.35);line-height:1.2;min-height:30px}
.it.sel{outline:2px solid #ffd890}
.r0{color:#d8d8d8}.r1{color:#8888ff}.r2{color:#ffff77}.r3{color:#ff9a3a}.gem{color:#5fe0c0}.sup{color:#c8c8c8}
.detail{border:1px solid #4a3a28;border-radius:8px;padding:8px 10px;background:rgba(0,0,0,.45);font-size:14px;min-height:90px}
.detail h4{margin:0 0 4px;font-family:Cinzel,serif;font-size:16px}
.detail .imp{color:#a8a8ff}
.detail .mod{color:#8fb8ff}
.detail .uni{color:#ff9a3a;font-style:italic}
.detail .cmp{color:#7a6a52;font-size:12px;margin-top:6px}
.gemrow{display:flex;align-items:center;gap:6px;border:1px solid #3a2c1e;border-radius:8px;padding:6px;margin-bottom:6px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.gemrow em{font-style:normal;color:#ffd890;font-weight:700;width:34px;text-align:center;font-size:13px}
.sock{border:1px dashed #5a4a36;border-radius:16px;padding:5px 9px;font-size:13px;cursor:pointer;min-width:60px;text-align:center}
.sock.skill{border-style:solid;border-radius:6px;min-width:96px}
.sock.ok{border-color:#7be05a;box-shadow:0 0 8px rgba(123,224,90,.5)}
.sock.no{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid #3a2c1e;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer;background:rgba(0,0,0,.35)}
.chip.sel{outline:2px solid #ffd890}
.hint{color:#9a8a6a;font-size:13px;margin:6px 0}
#treeC{width:100%;max-width:440px;aspect-ratio:1;display:block;margin:0 auto;touch-action:manipulation}
.pad{position:fixed;border-radius:50%;border:2px solid rgba(255,220,160,.5);color:#fff;font:inherit;font-weight:700;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,rgba(90,60,30,.9),rgba(30,18,10,.9));text-shadow:0 1px 2px #000;font-size:12px;touch-action:none;padding:0}
#p0{right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;font-size:14px}
#p1{right:max(126px,calc(env(safe-area-inset-right) + 126px));bottom:max(18px,env(safe-area-inset-bottom));width:64px;height:64px}
#p2{right:max(112px,calc(env(safe-area-inset-right) + 112px));bottom:max(96px,calc(env(safe-area-inset-bottom) + 96px));width:64px;height:64px}
#p3{right:max(40px,env(safe-area-inset-right));bottom:max(128px,calc(env(safe-area-inset-bottom) + 128px));width:64px;height:64px}
#pDash{right:max(200px,calc(env(safe-area-inset-right) + 200px));bottom:max(18px,env(safe-area-inset-bottom));width:52px;height:52px}
#pFlask{left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:52px;height:52px;background:radial-gradient(circle at 40% 35%,#c83a3a,#4a0a0a)}
#charBtn{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;padding:7px 14px}
#charBtn.new{box-shadow:0 0 14px #ffd890;border-color:#ffd890}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" class="ov">
  <div class="box">
    <p class="title">RIFTBORN</p>
    <p>Descend into the Sunken Crypt. Shape your exile with skill gems, support gems, loot and a passive tree. Slay the Hollow King, open the rift, go deeper.</p>
    <div class="keys" id="keys"></div>
    <button class="btn" id="go">ENTER THE CRYPT</button>
  </div>
</div>
<div id="dead" class="ov hide"><div class="box"><p class="title" style="color:#c83a3a">YOU DIED</p><p>Your gear, gems and passives are kept.</p><button class="btn" id="rez">RESURRECT AT THE ENTRANCE</button></div></div>
<div id="done" class="ov hide"><div class="box"><p class="title">MAP CLEARED</p><p id="doneT"></p><button class="btn" id="next">ENTER THE RIFT</button></div></div>
<div id="panel" class="hide"><div class="pc">
  <div class="tabs"><button class="tab" data-t="gear">Gear</button><button class="tab" data-t="gems">Gems</button><button class="tab" data-t="tree">Passives</button><button class="btn small x" id="px">✕</button></div>
  <div id="pb"></div>
</div></div>
<button class="btn small" id="charBtn">CHARACTER</button>
<button class="pad hide" id="pFlask">FLASK</button>
<button class="pad hide" id="pDash">DASH</button>
<button class="pad hide" id="p3">E</button>
<button class="pad hide" id="p2">Q</button>
<button class="pad hide" id="p1">RMB</button>
<button class="pad hide" id="p0">SKILL</button>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#c'); let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, zoom = 1;
const dark = document.createElement('canvas'), dg = dark.getContext('2d');
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); zoom = Math.max(0.55, Math.min(1.2, Math.min(W, H) / 640)); dark.width = Math.ceil(W / 2); dark.height = Math.ceil(H / 2); }
addEventListener('resize', resize); resize();
const TOUCH = matchMedia('(pointer: coarse)').matches;
const rnd = Math.random, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = (a) => a[Math.floor(rnd() * a.length)];
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ell(x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, size, col, align = 'center', font = 'Fredoka', sw = 0) { g.font = `700 ${size}px ${font}, system-ui, sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = sw || Math.max(3, size * 0.22); g.strokeStyle = '#000'; g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y); }

// ---------- data: gems, items, passives ----------
const SKILLS = {
  fireball: { n: 'Fireball', tags: ['spell', 'projectile', 'area', 'fire'], el: 'fire', base: 22, cast: 0.42, mana: 6, col: '#ff7a2a', d: 'Hurls a ball of fire that explodes on impact.' },
  nova: { n: 'Ice Nova', tags: ['spell', 'area', 'cold'], el: 'cold', base: 30, cast: 0.55, mana: 14, col: '#7fd8ff', d: 'A ring of frost around you. Chills enemies.' },
  arc: { n: 'Arc', tags: ['spell', 'chain', 'lightning'], el: 'light', base: 22, cast: 0.38, mana: 9, col: '#c8e0ff', d: 'Lightning that leaps between 3 enemies.' },
  cleave: { n: 'Cleave', tags: ['attack', 'melee', 'area', 'phys'], el: 'phys', base: 26, cast: 0.48, mana: 4, col: '#e8d0a0', d: 'A wide swing that hits everything in front.' },
};
const SUPPORTS = {
  mp: { n: 'Multiple Projectiles', need: ['projectile'], d: '+2 projectiles, 25% less damage', mana: 1.4 },
  chain: { n: 'Chain', need: ['projectile', 'chain'], d: 'Projectiles chain to 2 more enemies; Arc +2 chains', mana: 1.3 },
  area: { n: 'Increased Area', need: ['area'], d: '40% more area of effect', mana: 1.3 },
  faster: { n: 'Faster Casting', need: ['spell'], d: '35% faster casting', mana: 1.2 },
  addfire: { n: 'Added Fire', need: [], d: 'Adds fire damage; hits can ignite (burn)', mana: 1.2 },
  echo: { n: 'Spell Echo', need: ['spell'], d: 'Casts the spell a second time, 20% less damage', mana: 1.4 },
};
const SLOTS = ['weapon', 'armor', 'ring', 'amulet', 'boots'];
const BASES = {
  weapon: [{ n: 'Ashwood Staff', imp: { inc_spell: 15 } }, { n: 'Rusted Greatsword', imp: { inc_phys: 30 } }, { n: 'Bone Wand', imp: { cast: 8 } }],
  armor: [{ n: 'Tattered Robe', imp: { mana: 15 } }, { n: 'Scale Vest', imp: { life: 30 } }],
  ring: [{ n: 'Ruby Ring', imp: { inc_fire: 12 } }, { n: 'Sapphire Ring', imp: { inc_cold: 12 } }, { n: 'Topaz Ring', imp: { inc_light: 12 } }, { n: 'Iron Ring', imp: { inc_phys: 10 } }],
  amulet: [{ n: 'Jade Amulet', imp: { life: 15 } }, { n: 'Lapis Amulet', imp: { mana: 20 } }],
  boots: [{ n: 'Wool Shoes', imp: { move: 6 } }, { n: 'Leather Boots', imp: { life: 12, move: 3 } }],
};
const AFFIX = [
  { k: 'life', t: '+# to maximum Life', r: [10, 28] }, { k: 'mana', t: '+# to maximum Mana', r: [8, 22] },
  { k: 'inc_spell', t: '#% increased Spell Damage', r: [8, 24], no: ['boots'] }, { k: 'inc_fire', t: '#% increased Fire Damage', r: [10, 26] },
  { k: 'inc_cold', t: '#% increased Cold Damage', r: [10, 26] }, { k: 'inc_light', t: '#% increased Lightning Damage', r: [10, 26] },
  { k: 'inc_phys', t: '#% increased Physical Damage', r: [10, 30] }, { k: 'cast', t: '#% increased Cast Speed', r: [5, 14], no: ['boots', 'armor'] },
  { k: 'move', t: '#% increased Movement Speed', r: [5, 14], only: ['boots'] }, { k: 'crit', t: '+#% Critical Strike Chance', r: [2, 6], no: ['boots'] },
  { k: 'lok', t: '+# Life gained on Kill', r: [2, 6] }, { k: 'mregen', t: '#% increased Mana Regeneration', r: [15, 40] },
  { k: 'area', t: '#% increased Area of Effect', r: [6, 16], no: ['boots'] }, { k: 'proj', t: '+# Projectile', r: [1, 1], only: ['weapon', 'amulet'], rare: 1 },
];
const UNIQUES = [
  { n: 'Emberheart', slot: 'amulet', base: 'Lapis Amulet', mods: { inc_fire: 30, life: 20 }, sp: 'twin', st: 'Fireball explodes twice' },
  { n: 'Stormweave', slot: 'boots', base: 'Wool Shoes', mods: { move: 22, inc_light: 20 }, sp: 'storm', st: 'Arc chains 3 more times' },
  { n: 'The Echoing Band', slot: 'ring', base: 'Iron Ring', mods: { mana: 25 }, sp: 'echo', st: 'All spells echo (cast twice), 20% less damage' },
  { n: 'Gravecleaver', slot: 'weapon', base: 'Rusted Greatsword', mods: { inc_phys: 60, lok: 8 }, sp: 'quake', st: 'Cleave sends a shockwave forward' },
];
const STAT_TEXT = Object.fromEntries(AFFIX.map((a) => [a.k, a.t]));
const RARE_A = ['Doom', 'Grim', 'Storm', 'Blood', 'Soul', 'Dusk', 'Hollow', 'Ember', 'Rift', 'Bone'], RARE_B = ['Whisper', 'Bane', 'Song', 'Grip', 'Gaze', 'Thirst', 'Veil', 'Mark', 'Coil', 'Spire'];
const RN = ['Normal', 'Magic', 'Rare', 'Unique'];
// passive tree: a small wheel; notables on the outer ring
const TREE = (() => {
  const n = [{ id: 0, x: 0.5, y: 0.5, st: {}, nm: 'Exile', start: 1 }];
  const r1 = [{ life: 12 }, { inc_spell: 10 }, { inc_fire: 12 }, { cast: 6 }, { inc_cold: 12 }, { inc_light: 12 }];
  r1.forEach((st, i) => { const a = -Math.PI / 2 + i * TAU / 6; n.push({ id: 1 + i, x: 0.5 + Math.cos(a) * 0.17, y: 0.5 + Math.sin(a) * 0.17, st }); });
  const r2 = [{ life: 15 }, { nm: 'Bloodbound', st: { life: 40, lok: 4 } }, { inc_spell: 12 }, { area: 10 }, { nm: 'Pyromancer', st: { inc_fire: 35, area: 8 } }, { inc_fire: 14 }, { cast: 8 }, { mana: 20 }, { nm: 'Frostborn', st: { inc_cold: 35, crit: 3 } }, { inc_cold: 14 }, { inc_light: 14 }, { nm: 'Stormcaller', st: { inc_light: 30, chain1: 1 } }];
  r2.forEach((o, i) => { const a = -Math.PI / 2 + (i - 0.5) * TAU / 12; n.push({ id: 7 + i, x: 0.5 + Math.cos(a) * 0.36, y: 0.5 + Math.sin(a) * 0.36, st: o.st || o, nm: o.nm, notable: !!o.nm }); });
  const e = []; for (let i = 0; i < 6; i++) { e.push([0, 1 + i], [1 + i, 7 + 2 * i], [1 + i, 7 + ((2 * i + 1) % 12)]); } for (let i = 0; i < 12; i++) e.push([7 + i, 7 + (i + 1) % 12]);
  return { n, e };
})();
const nodeText = (st) => Object.entries(st).map(([k, v]) => k === 'chain1' ? 'Arc and projectiles chain +1 time' : (STAT_TEXT[k] || k).replace('#', v)).join(' · ');

// ---------- player progress (saved) ----------
const SAVE = 'riftborn-trial-1';
let P = null;
function freshProgress() {
  return { lv: 1, xp: 0, tier: 1, eq: { weapon: mkItem('weapon', 0, 1, BASES.weapon[0]), armor: null, ring: null, amulet: null, boots: null }, bag: [],
    slots: [{ g: 'fireball', s: [null, null] }, { g: 'cleave', s: [null, null] }, { g: null, s: [null, null] }, { g: null, s: [null, null] }],
    gemBag: [{ sup: 'mp' }], tree: [0], tip: 0, kills: 0 };
}
function load() { try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.lv) return s; } catch (e) { /* storage blocked */ } return null; }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(P)); } catch (e) { /* storage blocked */ } }

// ---------- items ----------
function mkItem(slot, rar, tier, base) {
  base = base || pick(BASES[slot]);
  const it = { slot, rar, base: base.n, imp: { ...base.imp }, mods: {}, name: base.n };
  const n = rar === 1 ? ri(1, 2) : rar === 2 ? ri(3, 4) : 0, used = new Set();
  for (let i = 0; i < n; i++) {
    const pool = AFFIX.filter((a) => !used.has(a.k) && (!a.only || a.only.includes(slot)) && (!a.no || !a.no.includes(slot)) && (!a.rare || rar === 2));
    if (!pool.length) break; const a = pick(pool); used.add(a.k);
    const m = 1 + 0.25 * (tier - 1); it.mods[a.k] = a.r[0] === a.r[1] ? a.r[0] : Math.round((a.r[0] + rnd() * (a.r[1] - a.r[0])) * m);
  }
  if (rar === 1) { const k = Object.keys(it.mods)[0]; it.name = (k ? ({ life: 'Hale', mana: 'Azure', inc_spell: 'Mystic', inc_fire: 'Searing', inc_cold: 'Frigid', inc_light: 'Charged', inc_phys: 'Brutal', cast: 'Swift', move: 'Runner\'s', crit: 'Keen', lok: 'Vampiric', mregen: 'Calm', area: 'Wide', proj: 'Splitting' }[k] + ' ') : '') + base.n; }
  if (rar === 2) it.name = pick(RARE_A) + ' ' + pick(RARE_B);
  return it;
}
function mkUnique() { const u = pick(UNIQUES); return { slot: u.slot, rar: 3, base: u.base, imp: { ...BASES[u.slot].find((b) => b.n === u.base).imp }, mods: { ...u.mods }, name: u.n, sp: u.sp, st: u.st }; }
function itemLines(it) { const L = []; for (const [k, v] of Object.entries(it.imp)) L.push(['imp', STAT_TEXT[k].replace('#', v)]); for (const [k, v] of Object.entries(it.mods)) L.push(['mod', STAT_TEXT[k].replace('#', v)]); if (it.st) L.push(['uni', it.st]); return L; }

// ---------- stats ----------
let S = null;
function calcStats() {
  const s = { life: 130 + P.lv * 10, mana: 60 + P.lv * 4, inc_spell: 0, inc_fire: 0, inc_cold: 0, inc_light: 0, inc_phys: 0, cast: 0, move: 0, crit: 5, lok: 0, mregen: 0, area: 0, proj: 0, chain1: 0, sp: new Set() };
  const add = (o) => { for (const [k, v] of Object.entries(o)) s[k] = (s[k] || 0) + v; };
  for (const k of SLOTS) { const it = P.eq[k]; if (!it) continue; add(it.imp); add(it.mods); if (it.sp) s.sp.add(it.sp); }
  for (const id of P.tree) add(TREE.n[id].st);
  S = s;
  if (pl) { pl.maxLife = s.life; pl.maxMana = s.mana; pl.life = Math.min(pl.life, s.life); pl.mana = Math.min(pl.mana, s.mana); }
}
const xpNeed = (lv) => Math.round(40 * Math.pow(lv, 1.5));

// ---------- map ----------
const TS = 80, GW = 46, GH = 34, MW = GW * TS, MH = GH * TS;
let grid, explored, torches = [], chunks = new Map(), seedMap = 1;
const solidT = (tx, ty) => tx < 0 || ty < 0 || tx >= GW || ty >= GH || grid[ty * GW + tx] === 1;
const solidAt = (x, y) => solidT(Math.floor(x / TS), Math.floor(y / TS));
function genMap(seed) {
  const r = rng(seed); grid = new Uint8Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) grid[y * GW + x] = x < 1 || y < 1 || x >= GW - 1 || y >= GH - 1 || r() < 0.45 ? 1 : 0;
  for (let it = 0; it < 4; it++) { const n = grid.slice(); for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) { let c = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) c += grid[(y + dy) * GW + x + dx]; n[y * GW + x] = c >= 5 ? 1 : 0; } grid = n; }
  const carve = (cx, cy, rad) => { for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) { if (dx * dx + dy * dy > rad * rad + 1) continue; const x = cx + dx, y = cy + dy; if (x > 0 && y > 0 && x < GW - 1 && y < GH - 1) grid[y * GW + x] = 0; } };
  let x = 3, y = GH >> 1; while (x < GW - 8) { carve(x, y, r() < 0.3 ? 2 : 1); if (r() < 0.55) x++; else y = clamp(y + (r() < 0.5 ? -1 : 1), 3, GH - 4); }

  if (gem === 'arc') { g.strokeStyle = c; g.lineWidth = 3; g.beginPath(); g.moveTo(-r, -r * 0.6); g.lineTo(-r * 0.2, -r * 0.1); g.lineTo(-r * 0.5, r * 0.2); g.lineTo(r, r * 0.7); g.stroke(); }
  if (gem === 'cleave') { g.strokeStyle = c; g.lineWidth = 4; g.beginPath(); g.arc(0, r * 0.4, r, -2.6, -0.5); g.stroke(); }
  g.restore();
}

// ---------- character panel ----------
let tab = 'gear', selItem = null, selGem = null;
const availPoints = () => P.lv - P.tree.length;
function openPanel(t) { if (state !== 'play') return; state = 'panel'; tab = t; selItem = null; selGem = null; setPads(false); $('#charBtn').classList.remove('new'); $('#panel').classList.remove('hide'); held.fill(0); renderPanel(); }
function closePanel() { $('#panel').classList.add('hide'); state = 'play'; setPads(true); save(); }
$('#px').onclick = closePanel; $('#charBtn').onclick = () => state === 'panel' ? closePanel() : openPanel('gear');
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { tab = b.dataset.t; selItem = null; selGem = null; renderPanel(); });
$('#panel').addEventListener('pointerdown', (e) => { if (e.target.id === 'panel') closePanel(); });
function itemHTML(it, cmp) {
  if (!it) return '<div class="detail"><span class="hint">Tap an item to see it.</span></div>';
  const L = itemLines(it).map(([k, s]) => `<div class="${k}">${s}</div>`).join('');
  const other = cmp && P.eq[it.slot] && P.eq[it.slot] !== it ? `<div class="cmp">Now equipped: <span class="r${P.eq[it.slot].rar}">${P.eq[it.slot].name}</span> — ${itemLines(P.eq[it.slot]).map((l) => l[1]).join(' · ')}</div>` : '';
  return `<div class="detail"><h4 class="r${it.rar}">${it.name}</h4><div style="color:#7a6a52;font-size:12px">${RN[it.rar]} ${it.slot}${it.rar ? ' · ' + it.base : ''}</div>${L}${other}</div>`;
}
function renderPanel() {
  document.querySelectorAll('.tab').forEach((b) => { b.setAttribute('aria-selected', b.dataset.t === tab ? 'true' : 'false'); if (b.dataset.t === 'tree') b.innerHTML = 'Passives' + (availPoints() ? ` <b>+${availPoints()}</b>` : ''); });
  const pb = $('#pb');
  if (tab === 'gear') {
    const stats = `Life ${S.life} · Mana ${S.mana} · Spell dmg +${S.inc_spell}% · Fire +${S.inc_fire}% · Cold +${S.inc_cold}% · Lightning +${S.inc_light}% · Phys +${S.inc_phys}% · Cast speed +${S.cast}% · Move +${S.move}% · Crit ${S.crit}%`;
    pb.innerHTML = `<div class="cols"><div>${SLOTS.map((k) => `<div class="slotrow" data-eq="${k}"><em>${k}</em><span class="r${P.eq[k] ? P.eq[k].rar : 0}">${P.eq[k] ? P.eq[k].name : '<span style="color:#5a4a36">empty</span>'}</span></div>`).join('')}<div class="hint">${stats}</div></div>
      <div>${itemHTML(selItem, true)}<div style="display:flex;gap:6px;margin:8px 0">${selItem && P.bag.includes(selItem) ? '<button class="btn small" id="eqB">EQUIP</button><button class="btn small" id="drB">DISCARD</button>' : ''}</div>
      <div class="hint">Bag ${P.bag.length}/30</div><div class="bag">${P.bag.map((it, i) => `<div class="it r${it.rar}${it === selItem ? ' sel' : ''}" data-b="${i}">${it.name}<br><span style="color:#7a6a52">${it.slot}</span></div>`).join('')}</div></div></div>`;
    pb.querySelectorAll('[data-b]').forEach((d) => d.onclick = () => { selItem = P.bag[+d.dataset.b]; renderPanel(); });
    pb.querySelectorAll('[data-eq]').forEach((d) => d.onclick = () => { selItem = P.eq[d.dataset.eq]; renderPanel(); });
    const eb = $('#eqB'); if (eb) eb.onclick = () => { const it = selItem, old = P.eq[it.slot]; P.bag.splice(P.bag.indexOf(it), 1); if (old) P.bag.push(old); P.eq[it.slot] = it; calcStats(); tipDone.equip = 1; selItem = it; renderPanel(); };
    const db = $('#drB'); if (db) db.onclick = () => { P.bag.splice(P.bag.indexOf(selItem), 1); selItem = null; renderPanel(); };
  } else if (tab === 'gems') {
    const keys = TOUCH ? ['1', '2', '3', '4'] : ['LMB', 'RMB', 'Q', 'E'];
    pb.innerHTML = `<div class="hint">${selGem ? 'Now tap a glowing socket.' : 'Tap a gem below, then a socket. Tap a socketed gem to take it out. Support gems change the skill they sit next to.'}</div>` +
      P.slots.map((s, i) => `<div class="gemrow"><em>${keys[i]}</em><div class="sock skill ${slotCls(i, -1)}" data-s="${i}" data-k="-1">${s.g ? `<span style="color:${SKILLS[s.g].col}">${SKILLS[s.g].n}</span>` : '<span style="color:#5a4a36">empty</span>'}</div>${s.s.map((sp, j) => `<div class="sock ${slotCls(i, j)}" data-s="${i}" data-k="${j}">${sp ? `<span class="sup">${SUPPORTS[sp].n}</span>` : '<span style="color:#5a4a36">◇</span>'}</div>`).join('')}${s.g ? `<span class="hint" style="margin:0 0 0 auto">mana ${manaCost(s)}</span>` : ''}</div>`).join('') +
      `<div class="hint">Gem bag</div><div class="chips">${P.gemBag.map((b, i) => `<div class="chip${b === selGem ? ' sel' : ''}" data-g="${i}">${b.g ? `<span style="color:${SKILLS[b.g].col}">◆ ${SKILLS[b.g].n}</span>` : `<span class="sup">◇ ${SUPPORTS[b.sup].n}</span>`}</div>`).join('') || '<span class="hint">Empty: monsters drop gems.</span>'}</div>` +
      `<div class="detail" style="margin-top:8px">${selGem ? (selGem.g ? `<h4 style="color:${SKILLS[selGem.g].col}">${SKILLS[selGem.g].n}</h4>${SKILLS[selGem.g].d}<div class="cmp">${SKILLS[selGem.g].tags.join(', ')}</div>` : `<h4 class="sup">${SUPPORTS[selGem.sup].n} Support</h4>${SUPPORTS[selGem.sup].d}<div class="cmp">Works with: ${SUPPORTS[selGem.sup].need.join(' or ') || 'any skill'}</div>`) : '<span class="hint">Skill gems go in the big socket, supports in the small ones.</span>'}</div>`;
    pb.querySelectorAll('[data-g]').forEach((d) => d.onclick = () => { const b = P.gemBag[+d.dataset.g]; selGem = selGem === b ? null : b; renderPanel(); });
    pb.querySelectorAll('[data-s]').forEach((d) => d.onclick = () => gemClick(+d.dataset.s, +d.dataset.k));
  } else {
    pb.innerHTML = `<div class="hint">${availPoints()} point${availPoints() === 1 ? '' : 's'} to spend · tap a glowing node next to your path. Big nodes are notables.</div><canvas id="treeC" width="880" height="880"></canvas><div class="detail" id="treeD" style="margin-top:8px"><span class="hint">Tap a node to read it.</span></div>`;
    const c = $('#treeC'); drawTree(c, null);
    c.onclick = (e) => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; let hit = null; for (const n of TREE.n) if (Math.hypot(n.x - x, n.y - y) < (n.notable ? 0.05 : 0.035)) hit = n; if (!hit) return; const ok = canAlloc(hit); $('#treeD').innerHTML = `<h4 style="color:${hit.notable ? '#ffd890' : '#e8e0d0'}">${hit.nm || 'Passive'}</h4>${nodeText(hit.st) || 'Your starting point'}${ok && availPoints() ? '<div style="margin-top:6px"><button class="btn small" id="alB">ALLOCATE</button></div>' : P.tree.includes(hit.id) ? '<div class="cmp">Allocated</div>' : '<div class="cmp">Not connected yet, or no points</div>'}`; drawTree(c, hit); const ab = $('#alB'); if (ab) ab.onclick = () => { P.tree.push(hit.id); calcStats(); sfx('lvl'); renderPanel(); }; };
  }
  $('#px').onclick = closePanel;
}
function canAlloc(n) { if (P.tree.includes(n.id)) return false; return TREE.e.some(([a, b]) => (a === n.id && P.tree.includes(b)) || (b === n.id && P.tree.includes(a))); }
function drawTree(c, sel) {
  const prev = g; g = c.getContext('2d'); const w = c.width; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, w);
  const gr = g.createRadialGradient(w / 2, w / 2, 10, w / 2, w / 2, w / 2); gr.addColorStop(0, '#2a1c12'); gr.addColorStop(1, '#0c0806'); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  for (const [a, b] of TREE.e) { const A = TREE.n[a], B = TREE.n[b], on = P.tree.includes(a) && P.tree.includes(b); g.strokeStyle = on ? '#e8b860' : '#3a2c1e'; g.lineWidth = on ? 8 : 5; g.beginPath(); g.moveTo(A.x * w, A.y * w); g.lineTo(B.x * w, B.y * w); g.stroke(); }
  for (const n of TREE.n) { const on = P.tree.includes(n.id), can = canAlloc(n) && availPoints() > 0, r = (n.notable ? 0.045 : n.start ? 0.04 : 0.028) * w; g.fillStyle = on ? '#e8b860' : can ? '#3a5a2a' : '#1a120c'; g.beginPath(); g.arc(n.x * w, n.y * w, r, 0, TAU); g.fill(); g.strokeStyle = n === sel ? '#fff' : can ? '#7be05a' : on ? '#ffd890' : '#5a4a36'; g.lineWidth = n === sel ? 6 : 4; g.stroke(); if (n.notable) { g.font = '700 26px Cinzel'; g.textAlign = 'center'; g.fillStyle = on ? '#ffd890' : '#8a7a5a'; g.fillText(n.nm, n.x * w, n.y * w + r + 30); } }
  g = prev;
}
function slotCls(i, k) {
  if (!selGem) return ''; const s = P.slots[i];
  if (k === -1) return selGem.g ? 'ok' : 'no';
  if (selGem.g || !s.g) return 'no'; return supportFits(selGem.sup, s.g) && !s.s.includes(selGem.sup) ? 'ok' : 'no';
}
function gemClick(i, k) {
  const s = P.slots[i];
  if (selGem) {
    if (k === -1 && selGem.g) { P.gemBag.splice(P.gemBag.indexOf(selGem), 1); if (s.g) P.gemBag.push({ g: s.g }); s.g = selGem.g; s.s.forEach((sp, j) => { if (sp && !supportFits(sp, s.g)) { P.gemBag.push({ sup: sp }); s.s[j] = null; } }); }
    else if (k >= 0 && selGem.sup && s.g && supportFits(selGem.sup, s.g) && !s.s.includes(selGem.sup)) { P.gemBag.splice(P.gemBag.indexOf(selGem), 1); if (s.s[k]) P.gemBag.push({ sup: s.s[k] }); s.s[k] = selGem.sup; }
    else return;
    selGem = null; sfx('drop'); renderPanel(); return;
  }
  if (k === -1 && s.g && i > 0) { P.gemBag.push({ g: s.g }); s.s.forEach((sp) => sp && P.gemBag.push({ sup: sp })); s.g = null; s.s = [null, null]; }
  else if (k >= 0 && s.s[k]) { P.gemBag.push({ sup: s.s[k] }); s.s[k] = null; }
  renderPanel();
}

// ---------- flow ----------
function setPads(on) { for (const id of ['#p0', '#p1', '#p2', '#p3', '#pDash', '#pFlask']) $(id).classList.toggle('hide', !(on && TOUCH)); $('#charBtn').classList.toggle('hide', !on && state !== 'panel'); }
$('#keys').innerHTML = TOUCH ? '<span>Left thumb: move</span><span>Skill buttons auto-aim</span><span>CHARACTER: gear, gems, passives</span>' : '<span>WASD: move</span><span>Mouse: aim</span><span>LMB / RMB / Q / E: skills</span><span>Space: dash</span><span>1: flask</span><span>C · G · P: gear, gems, passives</span>';
$('#go').onclick = () => { $('#start').classList.add('hide'); state = 'play'; setPads(true); sfx('lvl'); };
$('#rez').onclick = () => { $('#dead').classList.add('hide'); const s = START(); pl.x = s.x; pl.y = s.y; pl.life = pl.maxLife; pl.mana = pl.maxMana; pl.flask = 3; projs = []; state = 'play'; setPads(true); };
$('#next').onclick = () => { $('#done').classList.add('hide'); newMap(); state = 'play'; setPads(true); };
P = load() || freshProgress(); pl = mkPlayer(); calcStats(); pl.life = pl.maxLife; pl.mana = pl.maxMana; newMap(); setPads(false); $('#charBtn').classList.add('hide');
if (P.kills > 0) { $('#go').textContent = 'CONTINUE · TIER ' + P.tier; }
window.__rb = { get P() { return P; }, get pl() { return pl; }, get mons() { return mons; }, get loot() { return loot; }, get state() { return state; }, get boss() { return boss; }, get S() { return S; }, calcStats, dropItem, dropGem, openPanel, closePanel };
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
