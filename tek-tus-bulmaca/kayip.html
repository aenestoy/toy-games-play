<script>
(()=>{

function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t=ac.currentTime+(dl||0),o=ac.createOscillator(),k=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);k.gain.setValueAtTime(.0001,t);k.gain.exponentialRampToValueAtTime(v||.06,t+.008);k.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}

// ---- draw helpers ----

const KN=Object.keys(D);

function drawItem(k,r,c){D[k](r,c)}
// ================= levels =================
// [targets, total objects, same-shape decoys (the "so close" moment, levels 6-8 only)]
const LV=[[3,8,0],[3,10,0],[4,12,0],[4,14,0],[5,15,0],[5,17,1],[6,18,1],[6,20,2]];
