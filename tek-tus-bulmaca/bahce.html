<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Garden Brook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#78c26a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
// @logic-start
// Pure puzzle logic (no DOM) - extracted and tested in node.
const DX=[0,1,0,-1],DY=[-1,0,1,0]; // N E S W -> bits 1 2 4 8
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rot(m,r){r&=3;return((m<<r)|(m>>(4-r)))&15}
// cols, rows, flowers, decoy tiles, minimum taps needed, minimum path tiles
const LV=[[3,3,1,0,2,2],[4,3,1,0,3,3],[4,4,1,1,4,4],[4,4,2,0,5,5],[5,4,2,1,6,6],[5,5,2,2,7,8],[5,5,3,2,8,9],[6,5,3,3,9,11]];
function dirOf(p,c,w){const dx=c%w-p%w,dy=(c/w|0)-(p/w|0);return dx===1?1:dx===-1?3:dy===1?2:0}
function tapsTo(b,r){for(let k=0;k<4;k++)if(rot(b,r+k)===b)return k;return 0}
function cur(L,c){return L.kind[c]===1?rot(L.base[c],L.r[c]):L.base[c]}
function flowDist(L){const d=new Array(L.N).fill(-1),q=[L.s];d[L.s]=0;
 while(q.length){const c=q.shift();if(L.kind[c]===3)continue;const m=cur(L,c),x=c%L.w,y=c/L.w|0;
  for(let k=0;k<4;k++){if(!(m>>k&1))continue;const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=L.w||ny>=L.h)continue;const n=ny*L.w+nx;if(d[n]>=0||!L.kind[n])continue;if(cur(L,n)>>((k+2)&3)&1){d[n]=d[c]+1;q.push(n)}}}
 return d}
function isWin(L){const d=flowDist(L);return L.fl.every(f=>d[f]>=0)}
function genLevel(li){const[w,h,nf,nd,mt,mp]=LV[li],N=w*h;
 for(let at=0;at<800;at++){const rnd=rng(7331+li*1013+at*7919),kind=new Array(N).fill(0),base=new Array(N).fill(0);
  const sy=Math.floor(rnd()*h),s=sy*w;kind[s]=2;const fl=[];
  for(let k=0;k<300&&fl.length<nf;k++){const x=w-1-Math.floor(rnd()*Math.ceil(w/2)),y=Math.floor(rnd()*h),c=y*w+x;
   if(kind[c]||x<1||x+Math.abs(y-sy)<2||fl.some(f=>Math.abs(f%w-x)+Math.abs((f/w|0)-y)<2))continue;kind[c]=3;fl.push(c)}
  if(fl.length<nf)continue;let ok=true;
  for(const f of fl){const wt=[],dist=[],prev=[],done=[];
   for(let c=0;c<N;c++){wt.push(1+rnd()*5);dist.push(1e9);prev.push(-1);done.push(false)}
   if(!base[s])dist[s]=0;for(let c=0;c<N;c++)if(kind[c]===1)dist[c]=0;
   for(;;){let u=-1;for(let c=0;c<N;c++)if(!done[c]&&dist[c]<1e9&&(u<0||dist[c]<dist[u]))u=c;if(u<0||u===f)break;done[u]=true;
    const ux=u%w,uy=u/w|0;for(let d=0;d<4;d++){const nx=ux+DX[d],ny=uy+DY[d];if(nx<0||ny<0||nx>=w||ny>=h)continue;const n=ny*w+nx;
     if(done[n]||kind[n]===2||(kind[n]===3&&n!==f))continue;const v=dist[u]+wt[n];if(v<dist[n]){dist[n]=v;prev[n]=u}}}
   if(dist[f]>=1e9){ok=false;break}
   let c=f;while(prev[c]>=0){const p=prev[c],dd=dirOf(p,c,w);base[p]|=1<<dd;base[c]|=1<<((dd+2)&3);if(kind[p]===0)kind[p]=1;c=p}}
  if(!ok)continue;
  const r=new Array(N).fill(0),dec=new Array(N).fill(0);
  for(let k=0,t=0;k<nd&&t<100;t++){const c=Math.floor(rnd()*N);if(kind[c])continue;kind[c]=1;dec[c]=1;base[c]=rnd()<.5?3:5;k++}
  for(let c=0;c<N;c++)if(kind[c]===1)r[c]=Math.floor(rnd()*4);
  const L={w,h,N,kind,base,r,dec,s,fl};let need=0;
  for(let c=0;c<N;c++)if(kind[c]===1&&!dec[c])need+=tapsTo(base[c],r[c]);
  if(need<mt||need>mt+6||kind.filter((k,c)=>k===1&&!dec[c]).length<mp||isWin(L))continue;
  L.need=need;L.par=need+Math.max(4,Math.ceil(need*.6));return L}
 return null}
// @logic-end

// ================= core =================
const cv=document.getElementById('c'),g=cv.getContext('2d');
const FONT='Fredoka,"Trebuchet MS",system-ui,sans-serif';
let VW=1,VH=1,DPR=1,now=0;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const eob=t=>{t=cl(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);VW=Math.max(1,innerWidth);VH=Math.max(1,innerHeight);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';layout()}
addEventListener('resize',resize);
let ac=null,muted=/[?&]mute=1/.test(location.search),nbuf=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t=ac.currentTime+(dl||0),o=ac.createOscillator(),k=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);k.gain.setValueAtTime(0.0001,t);k.gain.linearRampToValueAtTime(v||.06,t+.008);k.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,v,fc,type){if(muted||!ac)return;try{if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),k=ac.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fc||1200;k.gain.setValueAtTime(v||.1,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(k);k.connect(ac.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fill()}
function txt(s,x,y,sz,col,al,stroke,wt){g.font=(wt||700)+' '+Math.round(sz)+'px '+FONT;g.textAlign=al||'center';g.textBaseline='middle';if(stroke){g.lineWidth=Math.max(2,sz*.2);g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
const inR=(x,y,r,p)=>{p=p||0;return x>=r.x-p&&x<=r.x+r.w+p&&y>=r.y-p&&y<=r.y+r.h+p};
function muteRect(){return{x:VW-48,y:8,w:40,h:40}}
function drawMute(){const m=muteRect(),u=m.w/10,cx=m.x+m.w*.4,cy=m.y+m.h/2;g.save();g.fillStyle='rgba(30,60,30,.35)';rr(m.x,m.y,m.w,m.h,12);g.fill();g.strokeStyle=g.fillStyle='#fff';g.lineWidth=2.6;g.lineCap='round';g.beginPath();g.moveTo(cx-3*u,cy-1.5*u);g.lineTo(cx-1.3*u,cy-1.5*u);g.lineTo(cx+.6*u,cy-3.2*u);g.lineTo(cx+.6*u,cy+3.2*u);g.lineTo(cx-1.3*u,cy+1.5*u);g.lineTo(cx-3*u,cy+1.5*u);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(cx+2.2*u,cy-2*u);g.lineTo(cx+4.6*u,cy+2*u);g.moveTo(cx+4.6*u,cy-2*u);g.lineTo(cx+2.2*u,cy+2*u)}else{g.arc(cx+1*u,cy,2.3*u,-.9,.9);g.moveTo(cx+1*u+3.9*u*Math.cos(-.9),cy+3.9*u*Math.sin(-.9));g.arc(cx+1*u,cy,3.9*u,-.9,.9)}g.stroke();g.restore()}
function star(x,y,r,fill,stroke){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.47:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.lineWidth=Math.max(1.5,r*.16);g.strokeStyle=stroke;g.lineJoin='round';g.stroke()}}
function dropIco(x,y,r,col){g.fillStyle=col||'#3fa9f5';g.beginPath();g.moveTo(x,y-r*1.3);g.bezierCurveTo(x+r*.9,y-r*.2,x+r,y+r,x,y+r);g.bezierCurveTo(x-r,y+r,x-r*.9,y-r*.2,x,y-r*1.3);g.fill();circ(x-r*.3,y+r*.2,r*.22,'rgba(255,255,255,.7)')}
let parts=[],pops=[],flies=[];
function burst(x,y,n,cols,sp,life,sz,grav,shape){for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.25,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(grav?sp*.3:0),l:life*R(.6,1),m:life,s:sz*R(.6,1.3),c:cols[i%cols.length],gr:grav||0,sh:shape===undefined?(i%2):shape})}}
function pop(t,x,y,col,sz){pops.push({t,x,y,c:col,s:sz||22,l:1})}
function fly(x,y,kind,delay,cb){flies.push({x,y,kind,t:-(delay||0),d:.6+R(0,.15),cb,sx:R(-60,60)})}
function updFx(dt){for(const p of parts){p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of pops){p.l-=dt*.9;p.y-=dt*34}pops=pops.filter(p=>p.l>0);
 for(const f of flies){f.t+=dt;if(f.t>=f.d&&!f.done){f.done=1;f.cb&&f.cb()}}flies=flies.filter(f=>!f.done)}
function drawFx(){for(const p of parts){g.globalAlpha=cl(p.l/p.m*1.4,0,1);if(p.sh===1){const s=p.s;g.fillStyle=p.c;g.beginPath();g.moveTo(p.x,p.y-s);g.lineTo(p.x+s*.28,p.y-s*.28);g.lineTo(p.x+s,p.y);g.lineTo(p.x+s*.28,p.y+s*.28);g.lineTo(p.x,p.y+s);g.lineTo(p.x-s*.28,p.y+s*.28);g.lineTo(p.x-s,p.y);g.lineTo(p.x-s*.28,p.y-s*.28);g.fill()}else circ(p.x,p.y,p.s*.5,p.c)}g.globalAlpha=1;
 for(const p of pops){const k=1+.5*Math.max(0,(p.l-.8)/.2);g.globalAlpha=cl(p.l*1.6,0,1);txt(p.t,p.x,p.y,p.s*k,p.c,'center','rgba(20,50,20,.7)')}g.globalAlpha=1;
 for(const f of flies){if(f.t<0)continue;const tg=flyTarget(f.kind),e=cl(f.t/f.d,0,1),q=e*e*(3-2*e),mx=(f.x+tg.x)/2+f.sx,my=Math.min(f.y,tg.y)-80,x=lerp(lerp(f.x,mx,q),lerp(mx,tg.x,q),q),y=lerp(lerp(f.y,my,q),lerp(my,tg.y,q),q),s=lerp(1.3,.8,e);
  if(f.kind==='star')star(x,y,13*s,'#ffd43b','#c88a00');else dropIco(x,y,8*s)}}

// ================= save =================
const KEY='gardenBrook.v1',NL=8;
let save={st:[0,0,0,0,0,0,0,0],seen:0,drops:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.st)&&s.st.length===NL)save={st:s.st.map(v=>cl(v|0,0,3)),seen:cl(s.seen|0,0,NL),drops:Math.max(0,s.drops|0)}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
const wins=()=>save.st.filter(v=>v>0).length,totalStars=()=>save.st.reduce((a,b)=>a+b,0),nextLv=()=>{const i=save.st.findIndex(v=>v===0);return i<0?-1:i};
let shownStars=totalStars(),shownDrops=save.drops,bumpS=0,bumpD=0;

// ================= state =================
let mode='play',li=0,L=null,T=40,taps=0,wonAt=0,winStars=0,lvDrops=0,toastT=-9,toast='';
const HINT=['Tap a tile to turn it. Bring the water to the flower!','Every tap turns a tile a quarter turn.','Some tiles lead nowhere. That is okay!','Two flowers this time. One spring feeds them all.','Take your time. There is no clock here.','New: finish within par for a bonus star. No fail!','Three thirsty flowers. Follow the water.','The last flower bed. You have got this!'];
const FCOL=['#ff6fa8','#ffcf3f','#b07cff'];
const mapBtn={x:8,y:8,w:44,h:44};
function flyTarget(k){if(mode==='map')return{x:30,y:30};return k==='star'?{x:70,y:30}:{x:VW-112,y:30}}
function startLevel(i){li=i;L=genLevel(i);mode='play';taps=0;wonAt=0;lvDrops=0;const N=L.N;
 L.an=new Array(N).fill(0);L.bp=new Array(N).fill(0);L.ws=new Array(N).fill(-1);L.wa=new Array(N).fill(0);L.fired=new Array(N).fill(-2);L.bl=new Array(N).fill(0);L.gd=new Array(N).fill(0);L.wig=new Array(N).fill(0);
 layout();refresh(.5);tone(523,.12,'triangle',.05);tone(784,.16,'triangle',.05,0,.1)}
// recompute where water reaches; newly reached tiles fill in order of distance
function refresh(delay){const d=flowDist(L);let mn=1e9;for(let c=0;c<L.N;c++)if(d[c]>=0&&L.ws[c]<0)mn=Math.min(mn,d[c]);
 for(let c=0;c<L.N;c++){if(d[c]>=0){if(L.ws[c]<0)L.ws[c]=now+delay+(d[c]-mn)*.09}else L.ws[c]=-1}L.d=d}

// ================= layout =================
let M={};
function layout(){if(L){const top=62,bot=mode==='play'?(VH<500?40:60):0,aw=VW-24,ah=VH-top-bot-12;T=Math.floor(Math.min(aw/L.w,ah/L.h,120));L.bx=Math.round((VW-T*L.w)/2);L.by=Math.round(top+(ah-T*L.h)/2)}
 const port=VW<VH*1.05;M={port};
 if(port){const sw=Math.min(VW-24,600,(VH*.32)/.6),sh=sw*.6;M.sc={x:(VW-sw)/2,y:62,w:sw,h:sh};const sth=Math.min(60,VH*.075);M.st={x:M.sc.x,y:M.sc.y+sh+8,w:sw,h:sth};
  const py=M.st.y+sth+10,bh=54;M.btn={w:Math.min(300,VW-48),h:bh};M.btn.x=(VW-M.btn.w)/2;M.btn.y=VH-bh-14;M.pa={x:12,y:py,w:VW-24,h:M.btn.y-py-8}}
 else{const lw=VW*.54,sth=Math.min(56,VH*.12),sh=Math.min((lw-24)*.6,VH-62-sth-24),sw=sh/.6;M.sc={x:(lw-sw)/2+6,y:62,w:sw,h:sh};M.st={x:M.sc.x,y:62+sh+8,w:sw,h:sth};
  const bh=50;M.btn={w:Math.min(300,VW-lw-24),h:bh};M.btn.x=lw+(VW-lw-M.btn.w)/2;M.btn.y=VH-bh-12;M.pa={x:lw,y:58,w:VW-lw-12,h:M.btn.y-66}}
 const P=M.pa,c=P.w>P.h?4:2,rows=NL/c,cw=P.w/c,chh=P.h/rows;M.nr=cl(Math.min(cw,chh)*.3,22,38);M.nodes=[];
 for(let i=0;i<NL;i++){const row=Math.floor(i/c),k=i%c,col=row%2?c-1-k:k;M.nodes.push({x:P.x+(col+.5)*cw+(row%2?-1:1)*cw*.08,y:P.y+P.h-(row+.5)*chh})}}

// ================= input =================
function tap(x,y){audioOn();if(inR(x,y,muteRect(),4)){muted=!muted;if(!muted)tone(660,.08,'triangle',.06);return}
 if(mode==='play')tapPlay(x,y);else tapMap(x,y)}
addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY)},{passive:false});
['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(n=>addEventListener(n,e=>e.preventDefault(),{passive:false}));
function tapPlay(x,y){if(inR(x,y,mapBtn,2)){tone(440,.08,'triangle',.05);goMap();return}
 if(wonAt){if(now-wonAt>.9){tone(660,.1,'triangle',.06);goMap()}else burst(x,y,6,['#fff','#ffd43b'],120,.5,6,0,1);return}
 const cx=Math.floor((x-L.bx)/T),cy=Math.floor((y-L.by)/T);
 if(cx<0||cy<0||cx>=L.w||cy>=L.h){burst(x,y,5,['#fff','#c9f5b0'],90,.45,5,0,1);tone(900,.05,'sine',.025);return}
 const c=cy*L.w+cx,k=L.kind[c],px=L.bx+(cx+.5)*T,py=L.by+(cy+.5)*T;
 if(k===1){L.r[c]=(L.r[c]+1)&3;L.an[c]=1;L.bp[c]=0;taps++;noise(.05,.12,2600,'bandpass');tone(R(300,340),.07,'triangle',.05,220);burst(px,py,7,['#fff6d0','#e8d3a8','#9be37a'],T*2.4,.4,T*.09,0,1);refresh(.14);
  if(li>=5&&taps===L.par+1)pop('Past par - still fine!',VW/2,L.by-6,'#fff',16)}
 else if(k===2){L.bp[c]=0;tone(R(500,600),.12,'sine',.05,900);burst(px,py,10,['#3fa9f5','#bfe6ff','#fff'],T*2,.5,T*.08,300,0)}
 else if(k===3){L.wig[c]=1;L.bp[c]=0;tone(L.ws[c]>=0?880:420,.12,'sine',.05,L.ws[c]>=0?1320:380);burst(px,py,8,[FCOL[L.fl.indexOf(c)%3],'#fff'],T*1.8,.45,T*.08,0,1)}
 else{L.bp[c]=0;tone(R(700,800),.05,'sine',.025);burst(px,py,6,['#9be37a','#5fbf4a','#fff'],T*1.6,.4,T*.07,200,0)}}
function goMap(){mode='map';mapAt=now;layout()}
let mapAt=0,revAt=-1,revI=-1,nodeWig=new Array(NL).fill(0),btnBump=0;
function tapMap(x,y){const nx=nextLv();
 for(let i=0;i<NL;i++){const n=M.nodes[i];if(Math.hypot(x-n.x,y-n.y)<=Math.max(M.nr,24)+6){if(save.st[i]>0||i===nx){tone(660,.1,'triangle',.06);tone(990,.12,'triangle',.05,0,.07);burst(n.x,n.y,12,['#ffd43b','#fff'],150,.5,7,0,1);startLevel(i)}else{nodeWig[i]=1;tone(220,.12,'triangle',.05,180);pop('Finish level '+(nx+1)+' first',n.x,n.y-M.nr-10,'#fff',15)}return}}
 if(inR(x,y,M.btn,4)){btnBump=1;tone(660,.1,'triangle',.06);tone(990,.12,'triangle',.05,0,.07);startLevel(nx<0?0:nx);return}
 burst(x,y,8,['#fff','#ffd43b','#9be37a'],130,.5,6,0,1);tone(R(800,1000),.06,'sine',.03)}

// ================= update =================
function update(dt){now+=dt;updFx(dt);bumpS=Math.max(0,bumpS-dt*4);bumpD=Math.max(0,bumpD-dt*4);btnBump=Math.max(0,btnBump-dt*4);for(let i=0;i<NL;i++)nodeWig[i]=Math.max(0,nodeWig[i]-dt*2);
 if(mode==='map'){if(revI<0&&save.seen<wins()&&now-mapAt>.45){revI=save.seen;revAt=now;const p=pieceAt(revI);tone(523,.2,'triangle',.06);tone(659,.2,'triangle',.06,0,.12);tone(784,.3,'triangle',.06,0,.24);tone(1047,.4,'sine',.05,0,.38);burst(p.x,p.y,30,['#ffd43b','#fff','#9be37a','#ff6fa8'],220,.9,8,60,1);pop('+ '+PIECES[revI],p.x,p.y-30,'#fff',20)}
  if(revI>=0&&now-revAt>1.2){save.seen=revI+1;store();revI=-1;mapAt=now-.2}return}
 if(!L)return;
 for(let c=0;c<L.N;c++){L.an[c]=Math.max(0,L.an[c]-dt/.16);L.bp[c]=Math.min(1,L.bp[c]+dt*5);L.wig[c]=Math.max(0,L.wig[c]-dt*2.5);
  const on=L.ws[c]>=0&&now>=L.ws[c];L.wa[c]=on?Math.min(1,L.wa[c]+dt*7):Math.max(0,L.wa[c]-dt*6);
  if(on&&L.fired[c]!==L.ws[c]){L.fired[c]=L.ws[c];const px=L.bx+(c%L.w+.5)*T,py=L.by+((c/L.w|0)+.5)*T,k=L.kind[c];
   if(k===3){L.bl[c]=.01;tone(784,.18,'sine',.06);tone(1175,.25,'sine',.05,0,.08);tone(1568,.3,'sine',.04,0,.16);burst(px,py,26,[FCOL[L.fl.indexOf(c)%3],'#fff','#ffe66b'],T*3.5,.8,T*.12,0,1);pop('Bloom!',px,py-T*.5,'#fff',20)}
   else if(k===1){tone(380+L.d[c]*45,.09,'sine',.04,520+L.d[c]*45);burst(px,py,4,['#bfe6ff','#fff'],T*1.2,.35,T*.07,0,0);if(!L.gd[c]){L.gd[c]=1;lvDrops++;save.drops++;fly(px,py,'drop',0,()=>{shownDrops++;bumpD=1;tone(1300,.04,'sine',.025)})}}}
  if(L.kind[c]===3)L.bl[c]=L.wa[c]>0?Math.min(1,L.bl[c]+dt*2.2):Math.max(0,L.bl[c]-dt*2)}
 if(!wonAt&&L.fl.every(f=>L.ws[f]>=0&&now>=L.ws[f]+.45))win()}
function win(){wonAt=now;winStars=li<5?3:taps<=L.par?3:taps<=L.par+4?2:1;const before=save.st[li];save.st[li]=Math.max(before,winStars);store();
 const gain=save.st[li]-before;for(let i=0;i<3;i++){if(i<winStars)tone([659,784,1047][i],.25,'triangle',.06,0,.35+i*.22)}
 for(let i=0;i<gain;i++)fly(VW/2+(i-1)*44,VH/2-6,'star',.5+i*.22,()=>{shownStars++;bumpS=1;tone(1568,.06,'sine',.04)});
 for(let i=0;i<5;i++)burst(R(VW*.2,VW*.8),R(VH*.25,VH*.6),14,['#ffd43b','#ff6fa8','#3fa9f5','#fff','#9be37a'],260,1.1,8,140,i%2)}

 // little map icon: path with nodes
 g.strokeStyle='#fff';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(18,42);g.quadraticCurveTo(30,30,22,24);g.quadraticCurveTo(16,16,40,16);g.stroke();circ(18,42,4,'#ffd43b');circ(40,16,4,'#fff');
 const sb=1+.3*bumpS;star(70,30,12*sb,'#ffd43b','#c88a00');txt(''+shownStars,86,31,20,'#fff','left','rgba(20,50,20,.6)');
 dropIco(VW-112,30,9*(1+.3*bumpD));txt(''+shownDrops,VW-98,31,20,'#fff','left','rgba(20,50,20,.6)');

 if(li>=5)txt('Taps '+taps+' / par '+L.par,VW/2,44,14,taps>L.par?'#ffe3a0':'#eaffdf','center','rgba(20,50,20,.6)',500)}
function grooves(m,col,lw){g.strokeStyle=col;g.lineWidth=lw;g.lineCap='butt';g.beginPath();for(let k=0;k<4;k++)if(m>>k&1){g.moveTo(0,0);g.lineTo(DX[k]*T*.5,DY[k]*T*.5)}g.stroke();circ(0,0,lw/2,col)}
function drawTile(c){const x=L.bx+(c%L.w)*T,y=L.by+(c/L.w|0)*T,k=L.kind[c],b=1+.1*Math.sin(L.bp[c]*Math.PI);
 g.save();g.translate(x+T/2,y+T/2);g.scale(b,b);
 if(!k){const h=(c*2654435761>>>0)%997;g.fillStyle='rgba(255,255,255,.08)';rr(-T*.46,-T*.46,T*.92,T*.92,T*.16);g.fill();g.strokeStyle='#4f9e44';g.lineWidth=Math.max(1.5,T*.035);g.lineCap='round';
  for(let i=0;i<3;i++){const ox=((h*(i+3))%60-30)/100*T,oy=((h*(i+7))%60-30)/100*T;g.beginPath();g.moveTo(ox-T*.05,oy+T*.05);g.lineTo(ox-T*.07,oy-T*.04);g.moveTo(ox,oy+T*.05);g.lineTo(ox,oy-T*.07);g.moveTo(ox+T*.05,oy+T*.05);g.lineTo(ox+T*.07,oy-T*.04);g.stroke()}
  if(h%3===0){circ(T*.2,T*.18,T*.06,'#fff');circ(T*.2,T*.18,T*.025,'#ffd43b')}else if(h%3===1){g.fillStyle='#b8b2a2';g.beginPath();g.ellipse(-T*.18,T*.2,T*.1,T*.06,0,0,TAU);g.fill()}
  g.restore();return}
 g.fillStyle='rgba(40,60,20,.25)';rr(-T*.45,-T*.41,T*.9,T*.9,T*.17);g.fill();
 g.fillStyle=k===1?(L.dec[c]?'#d4bf98':'#e7cc9c'):k===2?'#c9d2d8':'#e7cc9c';rr(-T*.45,-T*.45,T*.9,T*.9,T*.17);g.fill();
 g.fillStyle='rgba(255,255,255,.3)';rr(-T*.4,-T*.42,T*.8,T*.14,T*.07);g.fill();
 let ang=0;const m=L.base[c];if(k===1){const p=1-L.an[c],e=1-Math.pow(1-p,3);ang=(L.r[c]-1+e)*Math.PI/2}
 g.rotate(ang);grooves(m,'#8a5c38',T*.3);grooves(m,'#6e4529',T*.22);
 const wa=k===2?1:L.wa[c];
 if(wa>.01){grooves(m,'#3fa9f5',T*.2*Math.min(1,wa*1.3));g.setLineDash([T*.1,T*.2]);g.lineDashOffset=-now*T*1.4;grooves(m,'rgba(255,255,255,.6)',T*.05);g.setLineDash([])}
 g.rotate(-ang);
 if(k===2){circ(0,0,T*.3,'#8e98a0');circ(0,0,T*.24,'#2f8fe0');for(let i=0;i<2;i++){const q=(now*.8+i*.5)%1;g.strokeStyle='rgba(255,255,255,'+(.7*(1-q))+')';g.lineWidth=2;g.beginPath();g.arc(0,0,T*.05+q*T*.18,0,TAU);g.stroke()}circ(-T*.07,-T*.07,T*.05,'rgba(255,255,255,.7)')}
 if(k===3){const fc=FCOL[L.fl.indexOf(c)%3],bl=L.bl[c],w=Math.sin(L.wig[c]*12)*L.wig[c]*.3;circ(0,0,T*.16,'#7b4f2c');
  g.rotate(w+(1-bl)*.35);g.strokeStyle='#3e9b3a';g.lineWidth=T*.05;g.lineCap='round';g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(T*.04,-T*.12,0,-T*.24);g.stroke();
  g.fillStyle='#55b84a';g.beginPath();g.ellipse(T*.08,-T*.1,T*.07,T*.035,-.5,0,TAU);g.fill();
  const e=eob(bl),hy=-T*.27;
  if(bl<.05){g.fillStyle='#d9c08a';g.beginPath();g.ellipse(0,hy,T*.06,T*.09,0,0,TAU);g.fill();const q=(now*1.4)%1;g.globalAlpha=.85*(1-q);dropIco(T*.2,-T*.35-q*T*.1,T*.06);g.globalAlpha=1}
  else{for(let i=0;i<6;i++){const a=i/6*TAU+now*.4;g.fillStyle=fc;g.beginPath();g.ellipse(Math.cos(a)*T*.1*e,hy+Math.sin(a)*T*.1*e,T*.075*e,T*.05*e,a,0,TAU);g.fill()}circ(0,hy,T*.055*e,'#ffe66b')}}
 g.restore()}
function drawPlay(){bgGarden();const pad=T*.14;g.fillStyle='rgba(40,90,35,.45)';rr(L.bx-pad,L.by-pad,T*L.w+pad*2,T*L.h+pad*2,T*.25);g.fill();
 for(let c=0;c<L.N;c++)drawTile(c);hud();
 if(!wonAt){const hy=Math.min(VH-26,L.by+T*L.h+pad+22);g.globalAlpha=.6+.4*Math.sin(now*2.5)**2;txt(HINT[li],VW/2,hy,VW<420?14:17,'#fff','center','rgba(20,50,20,.55)',500);g.globalAlpha=1}
 if(wonAt)drawWin()}
function drawWin(){const t=now-wonAt,a=cl(t*3,0,1),w=Math.min(VW-40,380),h=230,x=(VW-w)/2,y=VH/2-h/2-20;
 g.fillStyle='rgba(20,50,20,'+(.35*a)+')';g.fillRect(0,0,VW,VH);g.save();g.translate(VW/2,y+h/2);const s=eob(t*2.5);g.scale(s,s);g.translate(-VW/2,-(y+h/2));
 g.fillStyle='#fffaf0';rr(x,y,w,h,24);g.fill();g.strokeStyle='#8fd27a';g.lineWidth=5;g.stroke();
 txt(li===NL-1?'Whole garden blooms!':'Garden watered!',VW/2,y+38,26,'#3f8f38');
 for(let i=0;i<3;i++){const st=.35+i*.22,k=t>st?eob((t-st)*3):0;star(VW/2+(i-1)*58,y+100,26,'#e6e0d0');if(k>0)star(VW/2+(i-1)*58,y+100,26*k,i<winStars?'#ffd43b':'#e6e0d0',i<winStars?'#c88a00':null)}
 let sub='+'+lvDrops+' drops collected';if(li>=5)sub=taps<=L.par?'Taps '+taps+' - within par '+L.par+'!':taps<=L.par+3?'So close! Par was '+L.par+' (you: '+taps+')':'Taps '+taps+' - par '+L.par;
 txt(sub,VW/2,y+148,15,'#6b5a40','center',null,500);
 if(t>.9){g.globalAlpha=.6+.4*Math.sin(now*4)**2;txt('Tap to continue',VW/2,y+192,19,'#3f8f38');g.globalAlpha=1}g.restore()}
function bgGarden(){const gr=g.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#9edb7f');gr.addColorStop(1,'#62b257');g.fillStyle=gr;g.fillRect(0,0,VW,VH);g.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<9;i++)circ((i*173)%VW,(i*311)%VH,60+(i%3)*30,'rgba(255,255,255,.05)')}

// ================= meta scene: garden cottage yard =================
const PIECES=['Cozy cottage','Picket fence','Flower bed','Garden bench','Apple tree','Stone fountain','Birdhouse','Lantern path'];
const PPOS=[[28,44],[50,53],[53,47],[71,42],[85,40],[57,36],[7,48],[28,50]];
const LOCKED=['Lily pond','Greenhouse','Windmill'];
function pieceAt(i){const s=M.sc,u=s.w/100,p=PPOS[i];return{x:s.x+p[0]*u,y:s.y+(p[1]-8)*u}}
function drawPiece(i,u,k,ghost){const p=PPOS[i];g.save();g.translate(M.sc.x+p[0]*u,M.sc.y+p[1]*u);g.scale(u*k,u*k);if(ghost&&i)g.globalAlpha=.2;
 const R2=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
 if(i===0){const ok=!ghost;R2(-14,-18,28,18,ok?'#f6e7c8':'#8f877a');g.fillStyle=ok?'#d0583f':'#5f5852';g.beginPath();g.moveTo(-17,-17);g.lineTo(0,-31);g.lineTo(17,-17);g.fill();R2(7,-30,4,8,ok?'#a9483a':'#555');
  if(!ok){g.fillStyle='#3c3632';g.beginPath();g.moveTo(-6,-22);g.lineTo(-1,-27);g.lineTo(2,-21);g.fill()}
  R2(-3,-10,6,10,ok?'#8a5330':'#4d4640');for(const wx of[-11,5]){R2(wx,-14,6,5,ok?'#ffd96b':'#3e3934');if(!ok){g.strokeStyle='#a39785';g.lineWidth=.8;g.beginPath();g.moveTo(wx,-14);g.lineTo(wx+6,-9);g.moveTo(wx+6,-14);g.lineTo(wx,-9);g.stroke()}else{g.strokeStyle='#fff';g.lineWidth=.6;g.strokeRect(wx,-14,6,5)}}
  if(ok)for(let j=0;j<3;j++){const q=(now*.35+j/3)%1;g.globalAlpha=.6*(1-q);circ(9+q*4,-31-q*10,1.5+q*2.5,'#fff')}}
 else if(i===1){g.fillStyle='#fffaf0';for(let x=-46;x<=46;x+=5){if(x>-27&&x<-17)continue;g.beginPath();g.moveTo(x-1.4,0);g.lineTo(x-1.4,-5);g.lineTo(x,-6.5);g.lineTo(x+1.4,-5);g.lineTo(x+1.4,0);g.fill()}R2(-46,-4,19,1.2,'#fffaf0');R2(-17,-4,63,1.2,'#fffaf0');R2(-46,-1.8,19,1.2,'#fffaf0');R2(-17,-1.8,63,1.2,'#fffaf0')}
 else if(i===2){g.fillStyle='#7b4f2c';g.beginPath();g.ellipse(0,0,9,3,0,0,TAU);g.fill();const fc=['#ff6fa8','#ffcf3f','#b07cff','#fff','#ff8a5c'];for(let j=0;j<9;j++){const x=-7+j*1.75,y=-1.5-(j%2)*1.5;g.strokeStyle='#3e9b3a';g.lineWidth=.6;g.beginPath();g.moveTo(x,0);g.lineTo(x,y);g.stroke();circ(x,y,1.3,fc[j%5])}}
 else if(i===3){R2(-6,-5,12,1.6,'#a8683a');R2(-6,-8,12,1.4,'#a8683a');R2(-5.5,-5,1.2,5,'#7a4a2a');R2(4.3,-5,1.2,5,'#7a4a2a');R2(-5.5,-8,1,3,'#7a4a2a');R2(4.5,-8,1,3,'#7a4a2a')}
 else if(i===4){R2(-1.5,-12,3,12,'#7a4a2a');circ(0,-17,8,'#4f9e44');circ(-5,-13,5.5,'#5bb04e');circ(5,-13,5.5,'#5bb04e');circ(0,-20,6,'#66bd57');for(const[a,b]of[[-4,-15],[3,-19],[5,-12],[-2,-10],[1,-15]])circ(a,b,1.2,'#e8463a')}
 else if(i===5){g.fillStyle='#b9bec4';g.beginPath();g.ellipse(0,0,7,2.6,0,0,TAU);g.fill();g.fillStyle='#62b5f0';g.beginPath();g.ellipse(0,-.6,5.6,1.8,0,0,TAU);g.fill();R2(-1,-7,2,6.5,'#a2a8ae');g.fillStyle='#b9bec4';g.beginPath();g.ellipse(0,-7,3,1.1,0,0,TAU);g.fill();
  if(!ghost)for(let j=0;j<6;j++){const q=(now*1.2+j/6)%1,a=j/6*TAU;g.globalAlpha=1-q;circ(Math.cos(a)*q*4,-8-Math.sin(q*Math.PI)*3+q*6,.6,'#bfe6ff')}}
 else if(i===6){R2(-.6,-14,1.2,14,'#7a4a2a');R2(-3,-19,6,5,'#e2a35a');g.fillStyle='#c0583f';g.beginPath();g.moveTo(-4,-19);g.lineTo(0,-22.5);g.lineTo(4,-19);g.fill();circ(0,-16.5,1,'#3c2a1c')}
 else if(i===7){for(let j=0;j<3;j++){g.fillStyle='#cfc6b4';g.beginPath();g.ellipse((j%2?1:-1)*1.2,j*2.4+.5,2.4,1,0,0,TAU);g.fill()}for(const lx of[-7,7]){R2(lx-.4,-5,.8,6,'#4a4a4a');R2(lx-1.4,-7.4,2.8,2.6,'#3a3a3a');circ(lx,-6.1,1,ghost?'#666':'#ffd96b');if(!ghost){g.globalAlpha=.25+.1*Math.sin(now*3+lx);circ(lx,-6.1,3.5,'#ffe9a0')}g.globalAlpha=ghost?.2:1}}
 g.restore()}
function drawScene(){const s=M.sc,u=s.w/100;g.save();rr(s.x,s.y,s.w,s.h,16);g.clip();
 const sk=g.createLinearGradient(0,s.y,0,s.y+s.h);sk.addColorStop(0,'#bfe8ff');sk.addColorStop(.45,'#eaf8ff');sk.addColorStop(.46,'#8fd27a');sk.addColorStop(1,'#6dbb5d');g.fillStyle=sk;g.fillRect(s.x,s.y,s.w,s.h);
 circ(s.x+88*u,s.y+9*u,5*u,'#fff2a8');g.fillStyle='#a6dc8e';g.beginPath();g.ellipse(s.x+20*u,s.y+29*u,40*u,9*u,0,Math.PI,TAU);g.ellipse(s.x+80*u,s.y+29*u,36*u,7*u,0,Math.PI,TAU);g.fill();
 for(let j=0;j<2;j++){const cx=s.x+((now*1.5+j*55)%120-10)*u;circ(cx,s.y+(8+j*6)*u,3*u,'rgba(255,255,255,.9)');circ(cx+3*u,s.y+(7+j*6)*u,3.6*u,'rgba(255,255,255,.9)');circ(cx+6.5*u,s.y+(8+j*6)*u,2.8*u,'rgba(255,255,255,.9)')}
 const ws=wins(),seen=Math.min(save.seen,ws),order=[4,5,6,0,3,2,7,1];
 for(const i of order){const shown=i<seen,rev=i===revI;if(rev){const k=eob((now-revAt)/.7);drawPiece(i,u,1,true);if(k>0)drawPiece(i,u,k,false);
   g.save();g.globalAlpha=cl(1-(now-revAt)/1.1,0,1)*.7;const p=pieceAt(i);circ(p.x,p.y,(now-revAt)*60*u/4,'rgba(255,255,220,.5)');g.restore()}
  else drawPiece(i,u,1,!shown)}
 g.restore();g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;rr(s.x,s.y,s.w,s.h,16);g.stroke();
 txt(seen+' / '+(NL+3)+' garden pieces',s.x+s.w/2,s.y+s.h-12,Math.max(12,u*3.4),'#fff','center','rgba(20,50,20,.6)',500);
 const st=M.st,cw=(st.w-16)/3;for(let i=0;i<3;i++){const x=st.x+i*(cw+8);g.fillStyle='rgba(20,50,20,.35)';rr(x,st.y,cw,st.h,12);g.fill();lockIco(x+st.h*.42,st.y+st.h/2,st.h*.22);
  txt(LOCKED[i],x+st.h*.8,st.y+st.h*.38,Math.min(15,cw*.11),'#fff','left',null,700);txt('Coming soon',x+st.h*.8,st.y+st.h*.68,Math.min(12,cw*.09),'#d8f0cf','left',null,500)}}
function lockIco(x,y,r){g.strokeStyle='#fff';g.lineWidth=r*.3;g.beginPath();g.arc(x,y-r*.3,r*.55,Math.PI,TAU);g.stroke();g.fillStyle='#ffd43b';rr(x-r*.8,y-r*.3,r*1.6,r*1.3,r*.25);g.fill();circ(x,y+.3*r,r*.18,'#8a6a00')}
function drawMap(){bgGarden();drawScene();const nx=nextLv(),N=M.nodes,r=M.nr;
 g.lineCap='round';for(let i=0;i<NL-1;i++){const a=N[i],b=N[i+1];g.strokeStyle=save.st[i]>0?'#fff4c0':'rgba(255,255,255,.35)';g.lineWidth=r*.32;g.setLineDash([r*.3,r*.35]);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}g.setLineDash([]);
 for(let i=0;i<NL;i++){const n=N[i],done=save.st[i]>0,cur=i===nx,w=Math.sin(nodeWig[i]*20)*nodeWig[i]*6,pl=cur?1+.08*Math.sin(now*5):1,x=n.x+w;
  if(cur){g.globalAlpha=.35+.2*Math.sin(now*5);circ(x,n.y,r*1.45,'#fff6b0');g.globalAlpha=1}
  circ(x,n.y+3,r*pl,'rgba(20,50,20,.3)');circ(x,n.y,r*pl,done?'#4fb045':cur?'#ffc928':'#b5c6ad');circ(x,n.y,r*pl*.82,done?'#62c457':cur?'#ffd94f':'#c7d6c0');
  txt(''+(i+1),x,n.y+1,r*.9,done||cur?'#fff':'#8a9a84','center',done||cur?'rgba(20,50,20,.45)':null);
  if(done)for(let k=0;k<3;k++)star(x+(k-1)*r*.62,n.y+r*1.12,r*.28,k<save.st[i]?'#ffd43b':'#dde5d8','#a07000');
  if(cur)txt('PLAY',x,n.y-r*1.35,Math.max(12,r*.45),'#fff','center','rgba(20,50,20,.55)')}
 const b=M.btn,s=1+.08*Math.sin(btnBump*Math.PI);g.save();g.translate(b.x+b.w/2,b.y+b.h/2);g.scale(s,s);g.fillStyle='#c88a00';rr(-b.w/2,-b.h/2+4,b.w,b.h,b.h/2);g.fill();g.fillStyle='#ffd43b';rr(-b.w/2,-b.h/2,b.w,b.h,b.h/2);g.fill();
 txt(nx<0?'Play again':'Play level '+(nx+1),0,1,22,'#fff','center','rgba(120,80,0,.55)');g.restore();
 star(30,30,13*(1+.3*bumpS),'#ffd43b','#c88a00');txt(''+shownStars,48,31,20,'#fff','left','rgba(20,50,20,.6)');
 txt(nx<0?'Garden complete! More soon':'Garden Brook',VW/2,30,VW<420?18:22,'#fff','center','rgba(20,50,20,.6)')}

// ================= loop =================
function draw(){g.setTransform(DPR,0,0,DPR,0,0);if(mode==='play'&&L)drawPlay();else drawMap();drawFx();drawMute()}
let last=performance.now();
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;update(dt);draw();requestAnimationFrame(frame)}
resize();{const nx=nextLv();if(save.seen<wins()||nx<0)goMap();else startLevel(nx)}
requestAnimationFrame(frame);
})();
