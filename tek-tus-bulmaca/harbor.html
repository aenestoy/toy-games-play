<style>html,body{margin:0;height:100%;overflow:hidden;background:#1f78b0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
// ================= shared core =================
const cv=document.getElementById('c'),g=cv.getContext('2d');
const FB='system-ui,"Segoe UI",Roboto,Arial,sans-serif';
let VW=1,VH=1,DPR=1,TS=1,time=0,state='play',stT=0,lvl=0;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const ease=t=>{t=cl(t,0,1);return 1-(1-t)*(1-t)*(1-t)},backE=t=>{t=cl(t,0,1)-1;return 1+2.7*t*t*t+1.7*t*t};
const isPort=()=>VW<VH*1.05;
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function mixc(a,b,t){const A=hex(a),B=hex(b);t=cl(t,0,1);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);VW=Math.max(1,innerWidth);VH=Math.max(1,innerHeight);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';TS=cl(Math.min(VW,VH)/430,.8,1.45);layoutMap();layout()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,120));
// ---- sound (generated, soft) ----
let ac=null,muted=/[?&]mute=1/.test(location.search),nbuf=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended'&&!document.hidden)ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t=ac.currentTime+(dl||0),o=ac.createOscillator(),k=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);k.gain.setValueAtTime(.0001,t);k.gain.exponentialRampToValueAtTime(v||.05,t+.012);k.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,v,fc,type,dl){if(muted||!ac)return;try{if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=ac.currentTime+(dl||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),k=ac.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fc||1200;k.gain.setValueAtTime(v||.05,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(k);k.connect(ac.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}
function arp(fs,d,v,step,type){fs.forEach((f,i)=>tone(f,d,type||'triangle',v,0,i*(step||.07)))}
document.addEventListener('visibilitychange',()=>{if(ac){if(document.hidden)ac.suspend();else ac.resume()}});
if(/^(localhost|127\.|\[::1\])/.test(location.hostname)){addEventListener('blur',()=>{if(ac)ac.suspend()});addEventListener('focus',()=>{if(ac&&!document.hidden)ac.resume()})}
// ---- drawing helpers ----
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,sz,col,al,stroke,font){g.font=Math.round(sz)+'px '+(font||FONT);g.textAlign=al||'center';g.textBaseline='middle';if(stroke){g.lineWidth=sz*.2;g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function wrapT(s,x,y,maxW,sz,col){g.font='600 '+Math.round(sz)+'px '+FB;g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';const ws=s.split(' '),ls=[];let line='';for(const w of ws){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){ls.push(line);line=w}else line=t}ls.push(line);const lh=sz*1.28;ls.forEach((l,i)=>g.fillText(l,x,y+(i-(ls.length-1)/2)*lh))}
function circ(x,y,r){g.beginPath();g.arc(x,y,r,0,TAU)}
function starPath(x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.46:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.closePath()}
function sparkPath(x,y,r){g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.3:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.closePath()}
function drawStar(x,y,r,on){starPath(x,y,r);g.fillStyle=on?'#ffd447':'rgba(255,255,255,.16)';g.fill();if(on){g.lineWidth=Math.max(1.2,r*.15);g.strokeStyle='#b8760e';g.lineJoin='round';g.stroke()}}
function drawLock(x,y,s){g.fillStyle='#9aa0b8';g.strokeStyle='#9aa0b8';g.lineWidth=s*.16;g.beginPath();g.arc(x,y-s*.15,s*.3,Math.PI,0);g.stroke();rr(x-s*.45,y-s*.15,s*.9,s*.7,s*.12);g.fill();g.fillStyle='#2a2d40';circ(x,y+s*.16,s*.11);g.fill()}
// ---- corner buttons (hit area >= 44 css px) ----
function btnS(){return Math.round(cl(Math.min(VW,VH)*.075,36,52))}
function muteRect(){const s=btnS();return{x:VW-s-8,y:8,w:s,h:s}}
function mapRect(){const s=btnS();return{x:VW-2*s-16,y:8,w:s,h:s}}
function inR(r,x,y,p){p=p||0;return x>=r.x-p&&x<=r.x+r.w+p&&y>=r.y-p&&y<=r.y+r.h+p}
function btnBg(m){g.fillStyle='rgba(0,0,0,.32)';rr(m.x,m.y,m.w,m.h,m.w*.28);g.fill();g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1.5;g.stroke()}
function drawMute(){const m=muteRect(),u=m.w/10,cx=m.x+m.w*.4,cy=m.y+m.h/2;g.save();btnBg(m);g.strokeStyle=g.fillStyle='#fff';g.lineWidth=Math.max(2,m.w*.07);g.lineCap='round';g.beginPath();g.moveTo(cx-3*u,cy-1.5*u);g.lineTo(cx-1.3*u,cy-1.5*u);g.lineTo(cx+.6*u,cy-3.2*u);g.lineTo(cx+.6*u,cy+3.2*u);g.lineTo(cx-1.3*u,cy+1.5*u);g.lineTo(cx-3*u,cy+1.5*u);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(cx+2.2*u,cy-2*u);g.lineTo(cx+4.6*u,cy+2*u);g.moveTo(cx+4.6*u,cy-2*u);g.lineTo(cx+2.2*u,cy+2*u)}else{g.arc(cx+1*u,cy,2.3*u,-.9,.9);g.moveTo(cx+1*u+3.9*u*Math.cos(-.9),cy+3.9*u*Math.sin(-.9));g.arc(cx+1*u,cy,3.9*u,-.9,.9)}g.stroke();g.restore()}
function drawMapBtn(){const m=mapRect(),u=m.w/10;g.save();btnBg(m);g.strokeStyle='#fff';g.lineWidth=Math.max(1.5,m.w*.05);g.setLineDash([u*.8,u*.7]);g.beginPath();g.moveTo(m.x+2.6*u,m.y+7.4*u);g.quadraticCurveTo(m.x+7*u,m.y+6.5*u,m.x+4.6*u,m.y+4.6*u);g.quadraticCurveTo(m.x+2.6*u,m.y+3*u,m.x+7.2*u,m.y+2.8*u);g.stroke();g.setLineDash([]);g.fillStyle='#fff';circ(m.x+2.6*u,m.y+7.4*u,u*.9);g.fill();g.fillStyle='#ffd447';circ(m.x+7.2*u,m.y+2.8*u,u*1.1);g.fill();g.restore()}
// ---- input: single short taps only ----
addEventListener('pointerdown',e=>{e.preventDefault();audioOn();const x=e.clientX,y=e.clientY;
 if(inR(muteRect(),x,y,5)){muted=!muted;if(!muted)tone(660,.08,'triangle',.05);return}
 if(state==='play'&&inR(mapRect(),x,y,5)){tone(520,.07,'triangle',.04);toMap();return}
 if(state==='play')tapGame(x,y);else if(state==='won'){if(stT>.45)toMap()}else if(state==='lost'){if(stT>.45)startLevel(lvl)}else if(state==='map')tapMap(x,y)},{passive:false});

addEventListener('pointerup',audioOn);addEventListener('touchend',audioOn);
// ---- effects: particles, pop text, things flying to counters ----
let parts=[],pops=[],flys=[];
function burst(x,y,n,col,sp,life,sz,grav,kind){for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.25,1)*sp*TS;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*R(.6,1),m:life,s:sz*TS*R(.6,1.3),c:Array.isArray(col)?col[i%col.length]:col,gr:(grav||0)*TS,k:kind||0})}}

function fly(x,y,to,kind,col,dl,cb,dur){flys.push({x,y,px:x,py:y,to,k:kind,c:col,t:-(dl||0),d:dur||.62,cb,h:R(30,80)})}
function updFx(dt){for(const p of parts){p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*1.6;p.vy*=1-dt*.8;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of pops){p.l-=dt*.85;p.y-=dt*34*TS}pops=pops.filter(p=>p.l>0);
 for(let i=0;i<flys.length;i++){const f=flys[i];f.t+=dt;if(f.t<0)continue;const u=cl(f.t/f.d,0,1),e=u<.5?2*u*u:1-2*(1-u)*(1-u),T=typeof f.to==='function'?f.to():f.to;f.px=lerp(f.x,T[0],e);f.py=lerp(f.y,T[1],e)-Math.sin(u*Math.PI)*f.h*TS;if(Math.random()<dt*25)parts.push({x:f.px,y:f.py,vx:R(-20,20),vy:R(-20,20),l:.35,m:.35,s:4*TS,c:f.c,gr:0,k:1});if(u>=1){f.done=1;if(f.cb)f.cb()}}flys=flys.filter(f=>!f.done)}
function drawFx(){g.save();for(const p of parts){const a=cl(p.l/p.m,0,1);g.globalAlpha=a;g.fillStyle=p.c;if(p.k===1){sparkPath(p.x,p.y,p.s*(.5+.5*a));g.fill()}else if(p.k===2){g.strokeStyle=p.c;g.lineWidth=3*a*TS;circ(p.x,p.y,p.s*(1.7-a*.9));g.stroke()}else{circ(p.x,p.y,p.s/2);g.fill()}}
 g.globalAlpha=1;for(const p of pops){const k=1+.45*Math.max(0,(p.l-.8)/.2);g.globalAlpha=cl(p.l*1.7,0,1);txt(p.t,p.x,p.y,24*TS*p.s*k,p.c,'center','rgba(0,0,0,.65)')}g.globalAlpha=1;
 for(const f of flys){if(f.t<0)continue;const u=cl(f.t/f.d,0,1);if(f.k==='star')drawStar(f.px,f.py,(11-3*u)*TS,true);else if(f.k==='sock'){if(typeof drawFlyItem==='function')drawFlyItem(f,u)}else{g.fillStyle=f.c;circ(f.px,f.py,6*TS);g.fill();g.fillStyle='rgba(255,255,255,.85)';circ(f.px,f.py,2.6*TS);g.fill()}}g.restore()}
// ---- save (localStorage may be blocked) ----
let save={next:0,stars:[0,0,0,0,0,0,0,0]};
function loadSave(){try{if(/[?&]reset=1/.test(location.search))localStorage.removeItem(SKEY);const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&Array.isArray(s.stars)&&s.stars.length===8&&s.next>=0&&s.next<=8)save=s}catch(e){}}
function store(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}
// ---- win / lose ----
let wonStars=0,firstWin=false,reveal=null,wonSnd=0;
function winLevel(st){state='won';stT=0;wonSnd=0;wonStars=st;firstWin=lvl===save.next;save.stars[lvl]=Math.max(save.stars[lvl]||0,st);if(firstWin)save.next=lvl+1;store();arp([523,659,784,1047],.45,.05,.09)}
function loseLevel(){state='lost';stT=0;tone(392,.35,'sine',.05,262);tone(294,.4,'sine',.04,196,.18)}
function toMap(){const rv=state==='won'&&firstWin;state='map';stT=0;reveal=rv?{i:lvl,t:0,p:0}:null;firstWin=false;parts=[];flys=[];pops=[]}
function updOverlay(){if(state==='won'){for(let j=wonSnd;j<wonStars;j++)if(stT>.3+.28*j){wonSnd=j+1;tone(880*Math.pow(1.26,j),.25,'triangle',.05);burst(VW/2+(j-1)*52*TS,VH*.44,10,['#ffd447','#fff'],160,.6,6,0,1)}if(stT>2.8)toMap()}}
function panel(w,h,cy){g.fillStyle=PANEL;rr(VW/2-w/2,cy-h/2,w,h,22*TS);g.fill();g.strokeStyle=PANEL_EDGE;g.lineWidth=3;g.stroke()}
function drawWon(){g.fillStyle='rgba(4,6,20,.55)';g.fillRect(0,0,VW,VH);const cy=VH*.45,s=.7+.3*backE(stT/.4),w=Math.min(VW-32,360*TS),h=220*TS;g.save();g.translate(VW/2,cy);g.scale(s,s);g.translate(-VW/2,-cy);panel(w,h,cy);
 txt('Level '+(lvl+1)+' complete!',VW/2,cy-h*.32,27*TS,'#fff','center','rgba(0,0,0,.5)');for(let j=0;j<3;j++){const on=j<wonStars&&stT>.3+.28*j,k=on?backE((stT-.3-.28*j)/.3):1;drawStar(VW/2+(j-1)*52*TS,cy-2*TS-(j===1?8*TS:0),20*TS*k,on)}
 wrapT(firstWin||lvl<save.next?WIN_LINE:'',VW/2,cy+h*.27,w-30,15*TS,'#e9e6ff');g.restore();
 if(stT>.6){g.globalAlpha=.55+.45*Math.sin(time*5);txt('Tap to continue',VW/2,cy+h/2+30*TS,19*TS,'#fff','center','rgba(0,0,0,.6)');g.globalAlpha=1}}
function drawLost(){g.fillStyle='rgba(4,6,20,.6)';g.fillRect(0,0,VW,VH);const cy=VH*.45,s=.7+.3*backE(stT/.4),w=Math.min(VW-32,360*TS),h=200*TS;g.save();g.translate(VW/2,cy);g.scale(s,s);g.translate(-VW/2,-cy);panel(w,h,cy);
 txt('So close!',VW/2,cy-h*.3,30*TS,'#ffd447','center','rgba(0,0,0,.5)');wrapT(LOSE_LINE,VW/2,cy,w-30,16*TS,'#fff');wrapT('Your stars and progress are safe.',VW/2,cy+h*.27,w-30,14*TS,'#c8c4e8');g.restore();
 if(stT>.6){g.globalAlpha=.55+.45*Math.sin(time*5);txt('Tap to try again',VW/2,cy+h/2+30*TS,19*TS,'#fff','center','rgba(0,0,0,.6)');g.globalAlpha=1}}
// ---- level map + meta scene ----
let MS={x:0,y:0,w:1,h:1},MN=[],MR=24;
function layoutMap(){const top=btnS()+18,port=isPort();let px,py,pw,ph;
 if(port){const w=VW-24,h=Math.min(w*.6,VH*.38);MS={x:12,y:top,w,h};px=12;py=top+h+14;pw=VW-24;ph=VH-py-54*TS}
 else{const h0=VH-top-12,w=Math.min(VW*.56,h0/.6);MS={x:12,y:top,w,h:Math.min(h0,w*.6)};px=MS.x+w+14;py=top;pw=VW-px-12;ph=VH-py-48*TS}
 MR=Math.round(cl(22*TS,22,32));MN=[];for(let i=0;i<8;i++){const t=i/7,w=Math.sin(i*1.25);if(port)MN.push([px+pw/2+w*pw*.3,py+ph-MR-6-t*(ph-2*MR-12)]);else MN.push([px+MR+8+t*(pw-2*MR-16),py+ph/2+(i%2?.2:-.2)*ph+Math.sin(i*.9)*ph*.06])}}
function sceneK(){const k=Math.min(MS.w/200,MS.h/120);return[k,MS.x+(MS.w-200*k)/2,MS.y+(MS.h-120*k)/2]}
function anchorXY(i){const[k,ox,oy]=sceneK(),a=PIECE_AT[i];return[ox+a[0]*k,oy+a[1]*k]}

function nodeLocked(i){return i>save.next||(reveal&&reveal.t<1.85&&i===reveal.i+1)}
function updMap(dt){if(!reveal)return;const p=reveal.p,t=reveal.t+dt,X=th=>p<th&&t>=th,i=reveal.i;reveal.p=reveal.t=t;
 if(X(.15)){for(let j=0;j<Math.max(1,wonStars);j++)fly(MN[i][0],MN[i][1],()=>anchorXY(i),'star','#ffd447',j*.12,()=>tone(1050+j*160,.12,'triangle',.04),.75)}
 if(X(.9)){const[x,y]=anchorXY(i);burst(x,y,26,REVEAL_COL,220,1,7,40,1);burst(x,y,14,['#fff'],120,.7,4,0);ring(x,y,30*TS,'#fff');arp([523,784,1047,1319],.5,.045,.08);pop(PIECES[i]+'!',x,y-24*TS,'#fff',.85)}

 if(t>2.6)reveal=null}
function tapMap(x,y){if(reveal&&reveal.t<1.85){reveal.t=1.84;return}let bi=-1,bd=1e9;MN.forEach(([nx,ny],i)=>{const d=Math.hypot(nx-x,ny-y);if(d<bd){bd=d;bi=i}});if(bi>=0&&bd<MR+14&&!nodeLocked(bi)&&bi<8){tone(660,.08,'triangle',.05);tone(990,.12,'sine',.04,0,.06);startLevel(bi)}else if(bi>=0&&bd<MR+14){tone(180,.1,'sine',.03)}}
function drawMap(){drawBg();const bs=btnS(),tot=save.stars.reduce((a,b)=>a+b,0);
 txt(MAP_TITLE,14,8+bs/2,Math.min(22*TS,VW*.055),'#fff','left','rgba(0,0,0,.5)');g.font=Math.round(Math.min(22*TS,VW*.055))+'px '+FONT;const tw=g.measureText(MAP_TITLE).width;drawStar(14+tw+20*TS,8+bs/2,11*TS,true);txt(''+tot,14+tw+34*TS,8+bs/2+1,20*TS,'#ffd447','left','rgba(0,0,0,.5)');
 g.save();rr(MS.x,MS.y,MS.w,MS.h,14);g.clip();g.fillStyle='#000';g.fillRect(MS.x,MS.y,MS.w,MS.h);const[k,ox,oy]=sceneK();g.translate(ox,oy);g.scale(k,k);const lits=[];for(let i=0;i<8;i++)lits.push(i<save.next?1:0);if(reveal)lits[reveal.i]=revealK();drawScene(lits,k);g.restore();
 g.strokeStyle=PANEL_EDGE;g.lineWidth=3;rr(MS.x,MS.y,MS.w,MS.h,14);g.stroke();
 const done=Math.min(8,save.next-(reveal&&reveal.t<.9?1:0));g.fillStyle='rgba(0,0,0,.5)';rr(MS.x+8,MS.y+MS.h-30*TS,118*TS,22*TS,11*TS);g.fill();txt(done+' / 8 '+SCENE_WORD,MS.x+8+59*TS,MS.y+MS.h-19*TS,12.5*TS,'#fff','center',null,FB);
 // path
 for(let i=0;i<7;i++){const[a,b]=MN[i],[c,d]=MN[i+1],on=i+1<=save.next&&!nodeLocked(i+1);g.strokeStyle=on?'#ffd447':'rgba(255,255,255,.25)';g.lineWidth=(on?5:4)*TS;g.setLineDash([2*TS,9*TS]);g.lineCap='round';g.beginPath();g.moveTo(a,b);g.quadraticCurveTo((a+c)/2+(d-b)*.25,(b+d)/2-(c-a)*.25,c,d);g.stroke()}g.setLineDash([]);
 for(let i=0;i<8;i++){const[x,y]=MN[i],lock=nodeLocked(i),dn=i<save.next&&!(reveal&&reveal.i===i&&reveal.t<.15),cur=!lock&&i===save.next;let r=MR;

 {w:4,h:5,n:5,seed:5,bias:.3,max:2,lives:99,rd:2,fr:.6,hint:'A boat sails only if the water ahead is clear'},
 {w:5,h:5,n:7,seed:8,bias:.4,max:3,lives:99,rd:3,fr:.6,hint:'Blocked? Clear the boat in front first'},
 {w:5,h:6,n:8,seed:12,bias:.5,max:3,lives:99,rd:3,fr:.6},
 {w:6,h:6,n:10,seed:21,bias:.6,max:3,lives:99,rd:3,fr:.6},
 {w:6,h:6,n:12,seed:34,bias:.7,max:3,lives:5,rd:4,fr:.5,hint:'Lifebuoys: each bump uses one. Plenty for you!'},

// first clear boat ahead (blk) and number of free cells before it (gap)
function path(W,H,occ,b){let x=b.x+b.dx,y=b.y+b.dy,gap=0;while(x>=0&&y>=0&&x<W&&y<H){const o=occ[y*W+x];if(o>=0)return{blk:o,gap};gap++;x+=b.dx;y+=b.dy}return{blk:-1,gap}}
// boats are placed in reverse leaving order: each new boat's own way out is clear, but it may block older boats
function gen1(d,idx,sd){const r=rng(sd*131+idx),W=d.w,H=d.h,occ=new Array(W*H).fill(-1),boats=[];let tries=0;
 while(boats.length<d.n&&tries<9000){tries++;const q=r(),len=Math.min(q<.4?2:q<.7?1:3,d.max),[dx,dy]=DIRS[Math.floor(r()*4)],x=Math.floor(r()*W),y=Math.floor(r()*H),cells=[];let ok=true;
  for(let k=0;k<len;k++){const cx=x-dx*k,cy=y-dy*k;if(cx<0||cy<0||cx>=W||cy>=H||occ[cy*W+cx]>=0){ok=false;break}cells.push(cy*W+cx)}
  if(!ok)continue;const b={x,y,dx,dy,len,cells};if(path(W,H,occ,b).blk>=0)continue;
  let sc=0;for(const o of boats){let cx=o.x+o.dx,cy=o.y+o.dy;while(cx>=0&&cy>=0&&cx<W&&cy<H){if(cells.includes(cy*W+cx)){sc++;break}cx+=o.dx;cy+=o.dy}}
  if(sc===0&&boats.length>1&&r()<d.bias)continue;
  const id=boats.length;cells.forEach(c=>occ[c]=id);b.col=(id*3+idx)%8;boats.push(b)}
 return{w:W,h:H,boats,occ,lives:d.lives,hint:d.hint||''}}
// greedy solve: a boat that can leave stays able to leave, so removing free boats until none are left decides solvability
function solve(lv){const occ=lv.occ.slice(),alive=lv.boats.map(()=>1);let left=lv.boats.length,rounds=0,free0=-1;
 while(left){const fr=[];lv.boats.forEach((b,i)=>{if(alive[i]&&path(lv.w,lv.h,occ,b).blk<0)fr.push(i)});if(!fr.length)return{ok:false,rounds,free0};if(free0<0)free0=fr.length;fr.forEach(i=>{alive[i]=0;lv.boats[i].cells.forEach(c=>occ[c]=-1);left--});rounds++}

// search seeds until the layout has the wanted chain depth and not too many free boats at the start
function gen(d,idx){let best=null;for(let k=0;k<400;k++){const lv=gen1(d,idx,d.seed+k*7),r=solve(lv);if(lv.boats.length<d.n||!r.ok)continue;if(!best)best=lv;if(r.rounds>=d.rd&&r.free0<=Math.ceil(d.n*d.fr))return lv}return best}
