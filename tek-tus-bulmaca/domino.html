</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
// ================= core =================

const eo=t=>1-Math.pow(1-cl(t,0,1),3),bk=t=>{t=cl(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);VW=Math.max(1,innerWidth);VH=Math.max(1,innerHeight);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';layout()}
addEventListener('resize',resize);
// ---- sound (WebAudio, generated) ----
let ac=null,muted=/[?&]mute=1/.test(location.search),nb=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t=ac.currentTime+(dl||0),o=ac.createOscillator(),k=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);k.gain.setValueAtTime(.0001,t);k.gain.exponentialRampToValueAtTime(v||.06,t+.006);k.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,v,fc){if(muted||!ac)return;try{if(!nb){nb=ac.createBuffer(1,ac.sampleRate/4,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),k=ac.createGain();s.buffer=nb;f.type='bandpass';f.frequency.value=fc;f.Q.value=2.5;k.gain.setValueAtTime(v,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(k);k.connect(ac.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}
let clk=0;const click=()=>{const f=1500+Math.min(clk,24)*55+R(-80,80);clk++;noise(.05,.22,f);tone(f*.5,.03,'triangle',.02)};
const bell=i=>{const f=[1046,1175,1318,1568][i%4];tone(f,1.1,'sine',.09);tone(f*2.76,.5,'sine',.025);tone(f*5.4,.25,'sine',.012)};
const lampS=()=>tone(330,.4,'triangle',.04,660),tick=()=>tone(880,.05,'triangle',.03,640),boop=()=>tone(210,.14,'sine',.06,150),coinS=()=>tone(1400,.06,'square',.018,1900);
const fanfare=()=>[0,4,7,12].forEach((s,i)=>tone(523*Math.pow(2,s/12),.45,'triangle',.06,0,i*.11));
// ---- save ----
const KEY='domino-town-v1';let sv={done:0,stars:[],shown:0,coins:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.done==='number')sv=Object.assign(sv,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sv))}catch(e){}}
const totStars=()=>sv.stars.reduce((a,b)=>a+(b|0),0);
// ---- draw helpers ----
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,sz,col,al,st,w){g.font=(w||600)+' '+Math.round(sz)+'px '+F;g.textAlign=al||'center';g.textBaseline='middle';if(st){g.lineWidth=sz*.22;g.strokeStyle=st;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function star5(x,y,r,col){g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.closePath();g.fill()}
function star4(x,y,r){g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.35:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.closePath();g.fill()}
function coinIco(x,y,r){g.fillStyle='#d99a1e';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle='#ffd65a';g.beginPath();g.arc(x,y,r*.74,0,TAU);g.fill();g.fillStyle='#d99a1e';g.fillRect(x-r*.14,y-r*.42,r*.28,r*.84)}
function bellIco(x,y,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x-r*.85,y+r*.55);g.quadraticCurveTo(x-r*.7,y-r*.95,x,y-r*.95);g.quadraticCurveTo(x+r*.7,y-r*.95,x+r*.85,y+r*.55);g.closePath();g.fill();g.beginPath();g.arc(x,y+r*.7,r*.22,0,TAU);g.fill()}
// ---- corner buttons (>=44px) ----
const BS=44;const muteR=()=>({x:VW-BS-8,y:5,w:BS,h:BS}),resetR=()=>({x:VW-2*BS-14,y:5,w:BS,h:BS}),mapR=()=>({x:VW-3*BS-20,y:5,w:BS,h:BS});
const inR=(p,x,y)=>x>=p.x-3&&x<=p.x+p.w+3&&y>=p.y-3&&y<=p.y+p.h+3;
function btnBg(m){g.fillStyle='rgba(0,0,0,.3)';rr(m.x,m.y,m.w,m.h,12);g.fill();g.strokeStyle=g.fillStyle='#fff';g.lineWidth=2.5;g.lineCap='round';g.lineJoin='round'}
function drawMute(){const m=muteR(),u=m.w/10,cx=m.x+m.w*.42,cy=m.y+m.h/2;btnBg(m);g.beginPath();g.moveTo(cx-3*u,cy-1.4*u);g.lineTo(cx-1.3*u,cy-1.4*u);g.lineTo(cx+.6*u,cy-3*u);g.lineTo(cx+.6*u,cy+3*u);g.lineTo(cx-1.3*u,cy+1.4*u);g.lineTo(cx-3*u,cy+1.4*u);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(cx+2*u,cy-1.8*u);g.lineTo(cx+4.4*u,cy+1.8*u);g.moveTo(cx+4.4*u,cy-1.8*u);g.lineTo(cx+2*u,cy+1.8*u)}else{g.arc(cx+.8*u,cy,2.2*u,-.9,.9);g.moveTo(cx+.8*u+3.7*u*Math.cos(-.9),cy+3.7*u*Math.sin(-.9));g.arc(cx+.8*u,cy,3.7*u,-.9,.9)}g.stroke()}
function drawReset(){const m=resetR(),x=m.x+m.w/2,y=m.y+m.h/2;btnBg(m);g.beginPath();g.arc(x,y,9,-2.6,1.9);g.stroke();g.beginPath();g.moveTo(x-12,y-9);g.lineTo(x-7.5,y-4.5);g.lineTo(x-2,y-9);g.stroke()}
function drawMapBtn(){const m=mapR(),x=m.x+m.w/2,y=m.y+m.h/2;btnBg(m);g.beginPath();g.moveTo(x-10,y+1);g.lineTo(x,y-9);g.lineTo(x+10,y+1);g.moveTo(x-7,y-1);g.lineTo(x-7,y+9);g.lineTo(x+7,y+9);g.lineTo(x+7,y-1);g.stroke()}
// ---- particles + flyers ----
let parts=[],fl=[];
function burst(x,y,n,cols,sp,st){for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.35,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.25,l:0,m:R(.45,.85),c:cols[i%cols.length],s:R(2.5,5.5),st:st&&i%2===0})}}
function ring(x,y,c,r){parts.push({x,y,ring:1,l:0,m:.4,c,s:r})}
function fly(o){o.t=0;o.dl=o.dl||0;fl.push(o)}
function updFx(dt){for(const p of parts){p.l+=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.st?160:420)*dt;p.vx*=.985}}parts=parts.filter(p=>p.l<p.m);
 for(const f of fl){f.t+=dt;if(f.t-f.dl>=f.d&&!f.ok){f.ok=1;f.end&&f.end()}}fl=fl.filter(f=>!f.ok)}
function drawFx(){for(const p of parts){const k=p.l/p.m;g.globalAlpha=1-k;if(p.ring){g.strokeStyle=p.c;g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.s*(.6+k*.9),0,TAU);g.stroke()}else{g.fillStyle=p.c;if(p.st)star4(p.x,p.y,p.s*1.6);else{g.beginPath();g.arc(p.x,p.y,p.s*(1-k*.5),0,TAU);g.fill()}}}g.globalAlpha=1;
 for(const f of fl){if(f.t<f.dl)continue;const k=eo((f.t-f.dl)/f.d),q=f.to();f.draw(lerp(f.x,q.x,k),lerp(f.y,q.y,k)+(f.arc||0)*Math.sin(k*Math.PI),k)}}
// ================= levels =================
// 6x9 grid. > < ^ v domino (leans that way), S fork stone (sends the chain on in all 3 other directions),
// B bell (goal), L lamp (bonus), H house, t tree, . grass. p = push limit (0 = free pushes), par = best push count.
const LV=[
 {m:['t.H..t','......','H....t','>>>>>v','.....v','..H..v','B<<<<<','......','t...H.'],p:0,par:1,h:'Tap a domino to push it'},
 {m:['H..t.H','......','>>>>v.','t...v.','..H.v.','....v.','B<<<<.','......','t.H..t'],p:0,par:1,h:'Chains turn corners'},
 {m:['t.B..H','..^...','..^.t.','>>S...','..v.H.','..v...','..>>>B','t.....','H..t..'],p:0,par:1,h:'Fork stones split the chain'},
 {m:['B<<<<.','....^.','H...^t','....^.','t...^.','...L..','>>>S.t','...v..','H..B..'],p:0,par:2,h:'Some bells need their own push'},
 {m:['>>>>>v','H....v','t.B..v','..^..v','v.S<<<','v.v..H','v.v...','v.B.t.','B....t'],p:0,par:2,h:'Start at the start of a line'},
 {m:['B<<<<<','H....^','..L..^','>>S>>^','..v..v','t.v.Hv','..>>vv','H...vv','B<<<<B'],p:3,par:2,h:'3 pushes - pick the first domino'},
 {m:['>>>>>v','B..t.v','^.H..v','^<<<<<','t..v.H','...v..','B<<S>B','H..L.t','>>>L.t'],p:3,par:2,h:'Lamps are nice, bells are the goal'},
 {m:['B<<S>B','t..^.H','H..^..','>>>^.t','...^>L','t..^..','..L.H.','>>S>>B','t.B..H'],p:3,par:2,h:'Four bells, three pushes'}
];
const DIR={'>':[1,0],'<':[-1,0],'^':[0,-1],'v':[0,1]};
const COLS=6,ROWS=9,HOP=.12;
// ================= town square (meta scene, 320x220 logical) =================
let GM=0;const C=c=>GM===1?'#2b3658':GM===2?'#141a2e':c;
const win_=(x,y,w,h)=>{g.fillStyle=GM?C('#000'):'#ffd77a';g.fillRect(x,y,w,h)};
const PIECES=[
 ['Bakery',55,112,()=>{g.fillStyle=C('#d98b5f');g.fillRect(20,84,70,66);g.fillStyle=C('#8f3b2e');g.beginPath();g.moveTo(14,86);g.lineTo(55,58);g.lineTo(96,86);g.fill();for(let i=0;i<3;i++)win_(27+i*21,96,14,14);win_(48,124,14,26);if(!GM){g.fillStyle='#f6e7c1';rr(30,114,50,8,3);g.fill()}}],
 ['Fountain',160,178,()=>{if(!GM){const gr=g.createRadialGradient(160,165,3,160,170,45);gr.addColorStop(0,'rgba(120,220,255,.6)');gr.addColorStop(1,'rgba(120,220,255,0)');g.fillStyle=gr;g.fillRect(110,120,100,80);g.strokeStyle='#9fe6ff';g.lineWidth=2.5;for(const s of[-1,1]){g.beginPath();g.moveTo(160,160);g.quadraticCurveTo(160+s*14,140,160+s*24,176);g.stroke()}}g.fillStyle=C('#8a93a8');g.beginPath();g.ellipse(160,182,36,10,0,0,TAU);g.fill();g.fillStyle=C('#5fc4ef');g.beginPath();g.ellipse(160,180,30,6,0,0,TAU);g.fill();g.fillStyle=C('#8a93a8');g.fillRect(156,158,8,22)}],
 ['Clock tower',160,70,()=>{g.fillStyle=C('#b9a27a');g.fillRect(145,36,30,114);g.fillStyle=C('#6a4a8a');g.beginPath();g.moveTo(140,38);g.lineTo(160,10);g.lineTo(180,38);g.fill();g.fillStyle=GM?C('#000'):'#fff6d8';g.beginPath();g.arc(160,58,10,0,TAU);g.fill();if(!GM){g.strokeStyle='#333';g.lineWidth=1.6;g.lineCap='round';const a=performance.now()/3000;g.beginPath();g.moveTo(160,58);g.lineTo(160+Math.cos(a)*7,58+Math.sin(a)*7);g.moveTo(160,58);g.lineTo(160,53);g.stroke()}win_(154,80,12,16);win_(154,108,12,16)}],
 ['Street lamps',160,170,()=>{for(const x of[38,282]){if(!GM){const gr=g.createRadialGradient(x,152,2,x,152,30);gr.addColorStop(0,'rgba(255,220,120,.8)');gr.addColorStop(1,'rgba(255,220,120,0)');g.fillStyle=gr;g.fillRect(x-32,120,64,64)}g.fillStyle=C('#3d4560');g.fillRect(x-2,154,4,46);g.fillStyle=GM?C('#000'):'#ffe08a';g.beginPath();g.arc(x,152,6,0,TAU);g.fill()}}],
 ['Cafe',265,120,()=>{g.fillStyle=C('#5d8fb8');g.fillRect(232,92,66,58);for(let i=0;i<6;i++){g.fillStyle=C(i%2?'#fff':'#e5484d');g.fillRect(228+i*12.3,102,12.3,10)}win_(240,118,20,18);win_(270,118,20,18);if(!GM){g.fillStyle='#f6e7c1';g.font='700 8px '+F;g.textAlign='center';g.fillText('CAFE',265,97)}}],
 ['Bunting',160,78,()=>{g.strokeStyle=C('#cfd6e6');g.lineWidth=1;g.beginPath();g.moveTo(90,86);g.quadraticCurveTo(118,100,145,86);g.moveTo(175,86);g.quadraticCurveTo(204,100,232,92);g.stroke();const fc=['#e5484d','#f59e0b','#22c55e','#3b82f6','#ec4899'];for(let i=0;i<10;i++){const s=i<5,t=(i%5+.5)/5,x=s?lerp(90,145,t):lerp(175,232,t),y=(s?86:89)+Math.sin(t*Math.PI)*(s?7:6);g.fillStyle=C(fc[i%5]);g.beginPath();g.moveTo(x-4,y);g.lineTo(x+4,y);g.lineTo(x,y+8);g.fill()}}],
 ['Light tree',104,160,()=>{g.fillStyle=C('#5a3a26');g.fillRect(101,165,6,30);g.fillStyle=C('#2f7a4a');g.beginPath();g.arc(104,155,20,0,TAU);g.fill();if(!GM){const lc=['#ffd23f','#ff6b8a','#7fe0ff'];for(let i=0;i<12;i++){const a=i*2.1,r=6+(i%3)*5;g.fillStyle=lc[i%3];g.globalAlpha=.6+.4*Math.sin(performance.now()/300+i);g.beginPath();g.arc(104+Math.cos(a)*r,155+Math.sin(a)*r,1.8,0,TAU);g.fill()}g.globalAlpha=1}}],
 ['Carousel',232,182,()=>{g.fillStyle=C('#e5484d');g.beginPath();g.moveTo(208,168);g.lineTo(232,152);g.lineTo(256,168);g.fill();g.fillStyle=C('#cfd6e6');for(let i=0;i<4;i++)g.fillRect(212+i*13,168,2,22);g.fillStyle=C('#f59e0b');g.beginPath();g.ellipse(232,192,26,6,0,0,TAU);g.fill();if(!GM){g.fillStyle='#ffe08a';for(let i=0;i<5;i++){g.beginPath();g.arc(212+i*10,168,1.8,0,TAU);g.fill()}}}],
 ['Theater',118,122,()=>{g.fillStyle=C('#7a4a6a');g.fillRect(97,96,42,54);g.beginPath();g.arc(118,96,21,Math.PI,0);g.fill()}],
 ['Ferris wheel',268,62,()=>{g.strokeStyle=C('#cfd6e6');g.lineWidth=3;g.beginPath();g.arc(268,62,40,0,TAU);g.stroke();for(let i=0;i<8;i++){const a=i*TAU/8;g.beginPath();g.moveTo(268,62);g.lineTo(268+Math.cos(a)*40,62+Math.sin(a)*40);g.stroke()}}],
 ['Station',204,124,()=>{g.fillStyle=C('#6a7a5a');g.fillRect(182,104,46,46);g.fillRect(178,98,54,8)}]
];
function town(ox,oy,sc,revI,revT){g.save();g.translate(ox,oy);g.scale(sc,sc);rr(0,0,320,220,10);g.clip();
 const gr=g.createLinearGradient(0,0,0,150);gr.addColorStop(0,'#141a38');gr.addColorStop(1,'#3a3f72');g.fillStyle=gr;g.fillRect(0,0,320,150);g.fillStyle='#fff';for(let i=0;i<26;i++){g.globalAlpha=.3+.3*Math.sin(i*7.1+performance.now()/900);g.fillRect((i*73)%320,(i*37)%80,1.6,1.6)}g.globalAlpha=1;
 g.fillStyle='#4a4f6a';g.fillRect(0,150,320,70);g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;for(let y=158;y<220;y+=10)for(let x=(y%20)?0:10;x<320;x+=20)g.strokeRect(x,y,20,10);
 for(const i of[9,2,0,8,10,4,5,6,3,1,7]){const p=PIECES[i];GM=i>=8?2:i<sv.shown||i===revI?0:1;
  if(i===revI&&revT<1.2){if(revT<0)GM=1;else{const s=bk(revT/.6);g.save();g.translate(p[1],p[2]);g.scale(s,s);g.translate(-p[1],-p[2]);p[3]();g.restore();continue}}
  p[3]();if(GM===2){g.fillStyle='#e8c070';rr(p[1]-6,p[2]-2,12,10,2);g.fill();g.strokeStyle='#e8c070';g.lineWidth=2;g.beginPath();g.arc(p[1],p[2]-2,4,Math.PI,0);g.stroke();txt('Soon',p[1],p[2]+15,9,'#e8c070','center',null,700)}}
 GM=0;const k=Math.min(sv.shown,8)/8;g.fillStyle='rgba(5,8,20,'+(.4*(1-k))+')';g.fillRect(0,0,320,220);g.restore()}
// ================= state =================
let st='play',lvl=0,cells=[],pend=[],pushes=0,lt=0,winT=0,winS=0,endT=0,time=0,hintT=0;
let coins=sv.coins|0,coinB=0,starsShown=totStars(),starB=0,mapT=0,rev=null,belled=0,bellN=0;
let H=54,B={},M={},land=false,help=0,helpL=-1;
function startLevel(i){lvl=i;const m=LV[i].m;cells=[];bellN=0;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const ch=m[y][x];cells.push({x,y,ch,f:0,ft:0,fd:null,on:0,ot:0,wb:0});if(ch==='B')bellN++}
 pend=[];pushes=0;lt=0;belled=0;clk=0;st='play';fl=[];parts=[];starsShown=totStars();hintT=0;layout();tone(392,.18,'triangle',.05,523)}
const cell=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS?null:cells[y*COLS+x];
const isDom=c=>!!DIR[c.ch];
// a line start: nothing can knock it over, so it must be pushed (glows after a 'So close' retry)
function isSrc(c){for(const k in DIR){const d=DIR[k],n=cell(c.x-d[0],c.y-d[1]);if(n&&(n.ch===k||n.ch==='S'))return false}return true}
// screen mapping: on wide screens the 6x9 board is shown transposed (9x6) so cells stay big
function scr(x,y){return land?{x:B.x+(y+.5)*B.cs,y:B.y+(x+.5)*B.cs}:{x:B.x+(x+.5)*B.cs,y:B.y+(y+.5)*B.cs}}
const sdir=(dx,dy)=>land?[dy,dx]:[dx,dy];
function fromScr(sx,sy){let a=Math.floor((sx-B.x)/B.cs),b=Math.floor((sy-B.y)/B.cs);return land?cell(b,a):cell(a,b)}
function layout(){const wide=VW>VH;H=wide?50:54;const top=H+(wide?4:44),bot=wide?8:52,aw=VW-16,ah=VH-top-bot;
