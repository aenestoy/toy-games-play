<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Blade Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Blade Brawl trial: 3v3 melee hero match vs bots. Canvas for the arena and HUD, DOM for buttons and the two overlays. */
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a1f;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Fredoka,system-ui,sans-serif;color:#1c1530}
#c{display:block;position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 24px;font-size:20px;color:#fff;background:linear-gradient(#ffbf3a,#f07b12);box-shadow:0 5px 0 #b4520a,0 8px 18px rgba(0,0,0,.3);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b4520a}
.btn.blue{background:linear-gradient(#66ccff,#2a86e0);box-shadow:0 5px 0 #1a5aa0,0 8px 18px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;display:grid;place-items:safe center;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at center,rgba(40,20,70,.55),rgba(8,6,20,.85));padding:14px;overflow:auto}
.box{text-align:center;color:#fff;max-width:820px;width:100%}
.logo{font-size:clamp(40px,10vw,70px);font-weight:700;line-height:.95;color:#ffd23a;-webkit-text-stroke:3px #5a2a00;text-shadow:0 6px 0 #5a2a00;margin:0 0 6px}
.sub{opacity:.85;margin:0 0 14px;font-size:17px}
.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.hero{background:#2a2244;border:3px solid #4a3d73;border-radius:18px;padding:10px;cursor:pointer;color:#fff;font:inherit}
.hero[aria-pressed="true"]{border-color:#ffd23a;box-shadow:0 0 0 3px rgba(255,210,58,.3)}
.hero canvas{width:120px;height:120px;display:block;margin:0 auto}
.hero b{display:block;font-size:22px}
.hero small{display:block;opacity:.8;font-size:14px}
.hero i{display:block;font-style:normal;color:#ffd23a;font-size:13px;margin-top:4px}
.how{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 16px;font-size:14px}
.how span{background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px}
#fight{font-size:28px;padding:14px 56px}
.res{font-size:clamp(46px,12vw,80px);font-weight:700;margin:0;-webkit-text-stroke:3px #1c1530;text-shadow:0 6px 0 #1c1530}
.stats{display:flex;gap:10px;justify-content:center;margin:12px 0 18px;flex-wrap:wrap}
.stats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;font-size:15px}
.stats b{display:block;font-size:26px}
.pad{position:fixed;border:0;border-radius:50%;color:#fff;font:inherit;font-weight:700;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.3);touch-action:none}
#bAtk{right:max(22px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:104px;height:104px;font-size:18px;background:radial-gradient(circle at 40% 35%,#ff8a7a,#d8323a);box-shadow:0 5px 0 #8a1a20}
#bDash{right:max(140px,calc(env(safe-area-inset-right) + 140px));bottom:max(26px,env(safe-area-inset-bottom));width:74px;height:74px;font-size:15px;background:radial-gradient(circle at 40% 35%,#8fd8ff,#2a86e0);box-shadow:0 4px 0 #1a5aa0}
#bSup{right:max(40px,env(safe-area-inset-right));bottom:max(152px,calc(env(safe-area-inset-bottom) + 152px));width:78px;height:78px;font-size:14px;background:#555;box-shadow:0 4px 0 #333;opacity:.7}
#bSup.on{background:radial-gradient(circle at 40% 35%,#ffe680,#f0a010);box-shadow:0 4px 0 #a06000,0 0 22px #ffd23a;opacity:1;animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
@media (max-width:560px){.heroes{grid-template-columns:1fr;gap:6px;margin-bottom:10px}.hero{display:grid!important;grid-template-columns:64px 1fr;column-gap:8px;text-align:left;align-items:center;padding:6px 8px}.hero canvas{grid-row:span 3;width:64px;height:64px}.hero b{font-size:18px}.hero small{font-size:13px}.hero i{font-size:12px;margin-top:2px}.logo{font-size:40px}.sub{font-size:14px;margin-bottom:8px}.how{display:none}}
@media (max-height:500px){.heroes{margin-bottom:8px}.hero{padding:6px}.hero canvas{width:70px;height:70px}.hero b{font-size:18px}.hero i{display:none}.logo{font-size:38px}.sub{margin-bottom:8px}.how{display:none}}
#fight,#again{position:sticky;bottom:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="pick" class="ov">
  <div class="box">
    <div class="logo">BLADE BRAWL</div>
    <p class="sub">3 vs 3 · first team to 10 knockouts wins · 3 minutes</p>
    <div class="heroes" id="heroes"></div>
    <div class="how" id="how"></div>
    <button class="btn" id="fight">FIGHT!</button>
  </div>
</div>
<div id="end" class="ov hide">
  <div class="box">
    <p class="res" id="resT">VICTORY</p>
    <div class="stats" id="resS"></div>
    <button class="btn" id="again">PLAY AGAIN</button>
    <button class="btn blue" id="change">CHANGE HERO</button>
  </div>
</div>
<button class="pad hide" id="bDash">DASH</button>
<button class="pad hide" id="bSup">SUPER</button>
<button class="pad hide" id="bAtk">ATTACK</button>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#c'); let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, zoom = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); zoom = Math.max(0.5, Math.min(1.25, Math.min(W, H) / 680)); }
addEventListener('resize', resize); resize();
const TOUCH = matchMedia('(pointer: coarse)').matches;
const rnd = Math.random, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const pick = (a) => a[Math.floor(rnd() * a.length)];
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, size, col, align = 'center', stroke = '#1c1530', sw = 0) { g.font = `700 ${size}px Fredoka, system-ui, sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = sw || Math.max(3, size * 0.2); g.strokeStyle = stroke; g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y); }

// ---------- heroes ----------
// atk: the combo's swings (wind-up, active, recovery in seconds; range px, arc degrees, damage, knockback, hit stun)
const HEROES = {
  kenji: { n: 'Kenji', role: 'Blade · fast 3-hit combos', hp: 1000, spd: 255, r: 26, superCost: 900, superN: 'STORM CUT', superD: 'dashes through everyone in a line',
    atk: [{ wind: 0.1, act: 0.09, rec: 0.14, range: 92, arc: 110, dmg: 110, kb: 120 }, { wind: 0.08, act: 0.09, rec: 0.14, range: 92, arc: 110, dmg: 110, kb: 120 }, { wind: 0.14, act: 0.11, rec: 0.3, range: 106, arc: 150, dmg: 200, kb: 420, stun: 0.35 }] },
  brakka: { n: 'Brakka', role: 'Hammer · tanky, huge hits', hp: 1600, spd: 215, r: 31, superCost: 1100, superN: 'QUAKE', superD: 'leaps and stuns everyone around',
    atk: [{ wind: 0.34, act: 0.12, rec: 0.3, range: 124, arc: 140, dmg: 330, kb: 520, stun: 0.4 }] },
  vex: { n: 'Vex', role: 'Daggers · sneaky assassin', hp: 780, spd: 292, r: 24, superCost: 700, superN: 'SHADOW STEP', superD: 'teleports behind a foe for a huge stab',
    atk: [{ wind: 0.05, act: 0.06, rec: 0.1, range: 76, arc: 80, dmg: 72, kb: 60 }, { wind: 0.05, act: 0.06, rec: 0.1, range: 76, arc: 80, dmg: 72, kb: 60 }, { wind: 0.07, act: 0.07, rec: 0.22, range: 82, arc: 90, dmg: 130, kb: 220 }] },
};
const TEAM = [{ n: 'BLUE', c: '#3fa0ff', d: '#1a5aa0' }, { n: 'RED', c: '#ff4a5a', d: '#9a1a2a' }];
const NAMES = [['Aiko', 'Taro'], ['Mika', 'Bolt', 'Juno']];

// ---------- arena ----------
const AW = 2000, AH = 1200;
const HALF_WALLS = [{ x: 330, y: 200, w: 70, h: 250 }, { x: 330, y: 750, w: 70, h: 250 }, { x: 600, y: 560, w: 190, h: 80 }, { x: 770, y: 140, w: 64, h: 200 }, { x: 770, y: 860, w: 64, h: 200 }];
const walls = [...HALF_WALLS, ...HALF_WALLS.map((w) => ({ x: AW - w.x - w.w, y: w.y, w: w.w, h: w.h })), { x: 962, y: 410, w: 76, h: 76 }, { x: 962, y: 714, w: 76, h: 76 }];
const HALF_BUSH = [{ x: 560, y: 330, r: 78 }, { x: 560, y: 870, r: 78 }, { x: 250, y: 600, r: 0 }];
const bushes = [...HALF_BUSH, ...HALF_BUSH.map((b) => ({ x: AW - b.x, y: b.y, r: b.r })), { x: 1000, y: 170, r: 92 }, { x: 1000, y: 1030, r: 92 }].filter((b) => b.r > 0);
bushes.forEach((b) => { b.leaves = Array.from({ length: 14 }, (_, i) => ({ a: i / 14 * TAU + rnd() * 0.3, d: b.r * (0.35 + rnd() * 0.55), s: 18 + rnd() * 14 })); });
const BASES = [{ x: 150, y: 600 }, { x: 1850, y: 600 }];
const RUNE = { x: 1000, y: 600 };
const deco = Array.from({ length: 220 }, () => ({ x: rnd() * AW, y: rnd() * AH, k: rnd() }));
const floorPat = (() => { const c = document.createElement('canvas'); c.width = c.height = 120; const t = c.getContext('2d'); t.fillStyle = '#c9b48a'; t.fillRect(0, 0, 120, 120); t.strokeStyle = 'rgba(90,70,40,.25)'; t.lineWidth = 3; t.strokeRect(1.5, 1.5, 58, 58); t.strokeRect(61.5, 1.5, 57, 58); t.strokeRect(1.5, 61.5, 118, 57); t.fillStyle = 'rgba(255,255,255,.08)'; t.fillRect(4, 4, 52, 8); return g.createPattern(c, 'repeat'); })();
const grassPat = (() => { const c = document.createElement('canvas'); c.width = c.height = 160; const t = c.getContext('2d'); t.fillStyle = '#3f7a3a'; t.fillRect(0, 0, 160, 160); t.strokeStyle = '#4f8f45'; t.lineWidth = 2; for (let i = 0; i < 120; i++) { const x = rnd() * 160, y = rnd() * 160; t.beginPath(); t.moveTo(x, y); t.lineTo(x + 2, y - 6); t.stroke(); } return g.createPattern(c, 'repeat'); })();
function blocked(x, y, r) { if (x < r || y < r || x > AW - r || y > AH - r) return true; for (const w of walls) { const cx = clamp(x, w.x, w.x + w.w), cy = clamp(y, w.y, w.y + w.h); if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true; } return false; }
function pushOut(f) {
  for (const w of walls) {
    const cx = clamp(f.x, w.x, w.x + w.w), cy = clamp(f.y, w.y, w.y + w.h), dx = f.x - cx, dy = f.y - cy, d = Math.hypot(dx, dy);
    if (d < f.r) { if (d > 0.01) { f.x = cx + dx / d * f.r; f.y = cy + dy / d * f.r; } else { const l = f.x - w.x, rr = w.x + w.w - f.x, t = f.y - w.y, b = w.y + w.h - f.y, m = Math.min(l, rr, t, b); if (m === l) f.x = w.x - f.r; else if (m === rr) f.x = w.x + w.w + f.r; else if (m === t) f.y = w.y - f.r; else f.y = w.y + w.h + f.r; } }
  }
  f.x = clamp(f.x, f.r, AW - f.r); f.y = clamp(f.y, f.r, AH - f.r);
}
const inBush = (f) => bushes.some((b) => Math.hypot(f.x - b.x, f.y - b.y) < b.r - 6);

// ---------- state ----------
let state = 'pick', heroPick = 'kenji', T = 0, clock = 180, score = [0, 0], fighters = [], me = null, parts = [], floats = [], feed = [], slow = 0, shake = 0, rune = null, runeT = 20, overtime = false, banner = null, hintT = 0, flash = 0;
const cam = { x: AW / 2, y: AH / 2 };
function mkF(team, hero, name, bot) {
  const h = HEROES[hero], b = BASES[team];
  return { team, hero, h, name, bot, x: b.x + (rnd() - 0.5) * 60, y: b.y + (rnd() - 0.5) * 200, vx: 0, vy: 0, face: team ? Math.PI : 0, hp: h.hp, r: h.r, sw: null, combo: 0, comboT: 0, cdDash: 0, dashT: 0, ifr: 0, stun: 0, sup: 0, supT: 0, supK: null, dead: 0, lastCombat: -9, reveal: 0, buff: 0, perfect: 0, ko: 0, deaths: 0, dmg: 0, flash: 0, think: rnd() * 0.3, tgt: null, side: rnd() < 0.5 ? 1 : -1, stuckT: 0, lx: 0, ly: 0, jit: null, dodgeSeen: null, react: 0, walk: 0, buffer: 0 };
}
function newMatch() {
  const others = Object.keys(HEROES).filter((k) => k !== heroPick);
  me = mkF(0, heroPick, 'You', false);
  fighters = [me, mkF(0, others[0], NAMES[0][0], true), mkF(0, others[1], NAMES[0][1], true)];
  const reds = Object.keys(HEROES).sort(() => rnd() - 0.5);
  reds.forEach((k, i) => fighters.push(mkF(1, k, NAMES[1][i], true)));
  score = [0, 0]; clock = 180; overtime = false; rune = null; runeT = 20; parts = []; floats = []; feed = []; slow = 0; T = 0; hintT = 0;
  cam.x = me.x; cam.y = me.y; banner = { t: 0, a: 'FIGHT!', b: 'First team to 10 knockouts' };
}

// ---------- sound ----------
let AC = null;
function sfx(n) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const seq = { swing: [[300, 0.07, 'sawtooth', 0.025, 900]], hit: [[180, 0.08, 'square', 0.06, 90]], heavy: [[120, 0.16, 'square', 0.08, 50]], dash: [[500, 0.1, 'sine', 0.05, 1200]], perfect: [[880, 0.08], [1320, 0.08], [1760, 0.2]], ko: [[300, 0.1, 'square', 0.06], [200, 0.2, 'square', 0.06]], super: [[220, 0.1, 'sawtooth', 0.06], [440, 0.1, 'sawtooth', 0.06], [880, 0.2, 'sawtooth', 0.05]], rune: [[660, 0.08], [990, 0.16]], win: [[523, 0.12], [659, 0.12], [784, 0.12], [1046, 0.35]], lose: [[392, 0.2], [330, 0.2], [262, 0.4]] }[n];
  let t = AC.currentTime;
  for (const [f, d, type = 'triangle', v = 0.09, f2] of seq) { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.8; }
}

// ---------- input ----------
const K = { l: 0, r: 0, u: 0, d: 0 }; const mouse = { x: 0, y: 0, in: false };
const KEYS = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
addEventListener('keydown', (e) => {
  if (KEYS[e.code]) { K[KEYS[e.code]] = 1; e.preventDefault(); }
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'Space' || e.code === 'ShiftLeft') { e.preventDefault(); doDash(me, ...moveDir()); }
  if (e.code === 'KeyE' || e.code === 'KeyQ') doSuper(me, aimAngle());
  if (e.code === 'KeyJ') doAttack(me, aimAngle());
});
addEventListener('keyup', (e) => { if (KEYS[e.code]) K[KEYS[e.code]] = 0; });
addEventListener('blur', () => { K.l = K.r = K.u = K.d = 0; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true; if (e.button === 2) doDash(me, ...moveDir()); else doAttack(me, aimAngle()); return; }
  if (joy.id == null && e.clientX < W * 0.6) { joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; }
});
addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true; } if (e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const rel = (e) => { if (e.pointerId === joy.id) joy.id = null; };
addEventListener('pointerup', rel); addEventListener('pointercancel', rel);
function moveDir() {
  let x = K.r - K.l, y = K.d - K.u;
  if (joy.id != null) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy); if (l > 8) { const m = Math.min(1, l / 55); x = dx / l * m; y = dy / l * m; } }
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } return [x, y];
}
function aimAngle() {
  if (!TOUCH && mouse.in) { const sx = (me.x - cam.x) * zoom + W / 2, sy = (me.y - cam.y) * zoom + H / 2; return Math.atan2(mouse.y - sy, mouse.x - sx); }
  // touch: the nearest visible foe in reach, else where you are going
  let best = null, bd = 260; for (const f of fighters) if (f.team !== me.team && !f.dead && visible(f, 0) && dist(f, me) < bd) { bd = dist(f, me); best = f; }
  if (best) return Math.atan2(best.y - me.y, best.x - me.x);
  const [x, y] = moveDir(); return x || y ? Math.atan2(y, x) : me.face;
}
const padDown = (id, fn) => $(id).addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (state === 'play') fn(); });
padDown('#bAtk', () => { doAttack(me, aimAngle()); me.holdAtk = true; });
$('#bAtk').addEventListener('pointerup', () => { me.holdAtk = false; }); $('#bAtk').addEventListener('pointerleave', () => { me.holdAtk = false; });
padDown('#bDash', () => doDash(me, ...moveDir()));
padDown('#bSup', () => doSuper(me, aimAngle()));

// ---------- combat ----------
const busy = (f) => f.dead || f.stun > 0 || f.dashT > 0 || f.supT > 0;
function visible(f, team) { if (f.team === team) return true; if (!inBush(f) || f.reveal > 0) return true; return fighters.some((o) => o.team === team && !o.dead && dist(o, f) < 150); }
function doAttack(f, ang) {
  if (busy(f)) { f.buffer = 0.2; return; }
  if (f.sw) { if (f.sw.ph === 'rec' && f.sw.t > f.sw.s.rec * 0.4) { f.buffer = 0.2; } else { f.buffer = 0.2; return; } if (f.sw.ph !== 'done') return; }
  const combo = f.comboT > 0 ? (f.combo + 1) % f.h.atk.length : 0;
  f.combo = combo; f.face = ang; f.sw = { s: f.h.atk[combo], ph: 'wind', t: 0, hit: false, i: combo }; f.buffer = 0;
}
function doDash(f, dx, dy) {
  if (f.dead || f.stun > 0 || f.cdDash > 0 || f.supT > 0) return;
  if (!dx && !dy) { dx = Math.cos(f.face); dy = Math.sin(f.face); }
  const l = Math.hypot(dx, dy) || 1; f.vx = dx / l * 720; f.vy = dy / l * 720; f.dashT = 0.17; f.ifr = 0.22; f.cdDash = 1.3; f.sw = null;
  if (f === me) sfx('dash');
}
function doSuper(f, ang) {
  if (f.dead || f.stun > 0 || f.sup < 1 || f.supT > 0) return;
  f.sup = 0; f.sw = null; f.face = ang; f.supHit = new Set(); sfx('super'); if (f === me) shake = 6;
  if (f.hero === 'kenji') { f.supK = 'cut'; f.supT = 0.32; f.ifr = 0.4; f.vx = Math.cos(ang) * 1150; f.vy = Math.sin(ang) * 1150; }
  if (f.hero === 'brakka') { f.supK = 'quake'; f.supT = 0.42; f.ifr = 0.45; }
  if (f.hero === 'vex') {

function hud() {

// ---------- flow ----------
function heroThumb(k) { const c = document.createElement('canvas'); c.width = c.height = 240; const prev = g; g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); const f = mkF(0, k, '', true); f.face = 0.5; drawFighter(f, 1, 60, 100, 1.5, true); g = prev; return c; }
