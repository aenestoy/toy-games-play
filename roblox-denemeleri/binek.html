<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Egg Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Egg Riders prototype: one canvas for the world and the HUD, DOM only for buttons and panels. */
html,body{margin:0;height:100%;overflow:hidden;background:#3f9fd6;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Fredoka,system-ui,sans-serif;color:#2b1d0e}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 22px;font-size:20px;color:#fff;background:linear-gradient(#ffbf3a,#f07b12);box-shadow:0 5px 0 #b4520a,0 8px 18px rgba(0,0,0,.25);cursor:pointer;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b4520a,0 4px 10px rgba(0,0,0,.2)}
.btn.green{background:linear-gradient(#86e464,#39a83a);box-shadow:0 5px 0 #23702a,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#66ccff,#2a86e0);box-shadow:0 5px 0 #1a5aa0,0 8px 18px rgba(0,0,0,.25)}
.btn.ad{background:linear-gradient(#b48cff,#7a4ce0);box-shadow:0 5px 0 #4e2b9c,0 8px 18px rgba(0,0,0,.25)}
.btn.ad::before{content:"▶ ";font-size:.8em}
.btn.small{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{filter:grayscale(1) brightness(.85);cursor:default}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(255,240,200,.25),rgba(30,20,60,.55));padding:16px}
.card{background:#fff8e8;border-radius:26px;padding:22px 24px 24px;box-shadow:0 10px 0 #e2c58f,0 20px 50px rgba(0,0,0,.35);text-align:center;max-width:440px;width:100%;box-sizing:border-box}
.logo{font-size:clamp(44px,11vw,68px);font-weight:700;line-height:.95;color:#ffb52e;-webkit-text-stroke:3px #7a3d0a;text-shadow:0 6px 0 #7a3d0a;letter-spacing:.01em;margin:4px 0 12px}
.logo span{display:block;color:#7be05a;-webkit-text-stroke:3px #1f5a22;text-shadow:0 6px 0 #1f5a22}
.steps{display:grid;gap:8px;margin:6px 0 18px;text-align:left}
.steps div{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:600;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 0 #ecdcb8}
.steps b{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;background:#ffb52e;color:#fff;font-size:16px}
#menu .btn{font-size:26px;padding:14px 46px}
#dash{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;padding:0;font-size:19px;background:radial-gradient(circle at 40% 35%,#ffd36a,#f07b12);box-shadow:0 5px 0 #b4520a,0 8px 18px rgba(0,0,0,.3)}
#nestBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom))}
#nestBtn:active{transform:translate(-50%,3px)}
#saveBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
#hb{position:fixed;left:0;right:0;bottom:max(18px,4vh);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px}
#shop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,12,40,.6);padding:12px}
#shop .card{max-width:560px;max-height:88vh;overflow:auto;text-align:left;padding:18px}
#shop h2{margin:0 0 4px;font-size:28px;color:#7a3d0a}
.coins{font-weight:700;color:#b06d00}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 0 #ecdcb8}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px}
.row .t small{color:#7d6a50;font-size:14px}
.lv{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lv i{width:9px;height:9px;border-radius:50%;background:#e6d6b4}
.lv i.on{background:#ffb52e}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:8px}
.pet{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:0 2px 0 #ecdcb8;border:3px solid transparent}
.pet.on{border-color:#ffb52e}
.pet canvas{position:static;width:96px;height:72px;display:block;margin:0 auto}
.pet b{display:block;font-size:15px}
.pet small{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
#ad{position:fixed;inset:0;background:#111;color:#fff;display:grid;place-items:center;text-align:center;font-size:22px}
#ad small{display:block;opacity:.6;font-size:15px;margin-top:8px}
#mute{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card">
    <div class="logo">EGG<span>RIDERS</span></div>
    <div class="steps">
      <div><b>1</b>Ride far out: the farther, the rarer the egg</div>
      <div><b>2</b>Race it home before it cracks</div>
      <div><b>3</b>Hatch it, ride it, go farther. DASH into rivals to steal!</div>
    </div>
    <button class="btn green" id="play">PLAY</button>
  </div>
</div>

<button class="btn hide" id="dash">DASH</button>
<button class="btn blue hide" id="nestBtn">🏠 NEST &amp; PETS</button>
<button class="btn ad hide" id="saveBtn">SAVE EGG +8s</button>
<div id="hb" class="hide">
  <button class="btn green" id="hRide">RIDE IT</button>
  <button class="btn blue" id="hPen">TO MY PEN</button>
  <button class="btn ad" id="hRe">NEW PET</button>
</div>
<div id="shop" class="hide"><div class="card" id="shopCard"></div></div>
<div id="ad" class="hide"><div>Advertisement<small id="adT">Reward in 2…</small></div></div>
<button id="mute" aria-label="Sound on or off">🔊</button>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#c'); let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, zoom = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  zoom = Math.max(0.52, Math.min(1.2, Math.min(W, H) / 740));
}
addEventListener('resize', resize); resize();
const TOUCH = matchMedia('(pointer: coarse)').matches;

// ---------- helpers ----------
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261007), rnd = Math.random, TAU = Math.PI * 2;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = (a) => a[Math.floor(rnd() * a.length)];
function shade(h, a) {
  const n = parseInt(h.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  const f = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round((f - r) * p + r); gg = Math.round((f - gg) * p + gg); b = Math.round((f - b) * p + b);
  return `rgb(${r},${gg},${b})`;
}
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, size, col, align = 'center', stroke = '#3a2210', sw = 0) {
  g.font = `700 ${size}px Fredoka, system-ui, sans-serif`; g.textAlign = align; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = sw || Math.max(3, size * 0.2); g.strokeStyle = stroke; g.strokeText(s, x, y);
  g.fillStyle = col; g.fillText(s, x, y);
}

// ---------- data ----------
const RAR = [
  { n: 'Common', c: '#f2f4f6', g: '#ffffff', val: 1, time: 16, pay: 5, inc: 1 },
  { n: 'Rare', c: '#4fb0ff', g: '#8fd0ff', val: 3, time: 16, pay: 15, inc: 3 },
  { n: 'Epic', c: '#b06bff', g: '#d2a8ff', val: 7, time: 16, pay: 40, inc: 8 },
  { n: 'Legendary', c: '#ffc531', g: '#ffe48a', val: 15, time: 15, pay: 100, inc: 20 },
];
const PETS = {
  piglet: { n: 'Piglet', r: 0, spd: 200, c: '#f6a5b7', c2: '#ffd3dd', ear: 'pt', tail: 'curl', snout: 1 },
  bunny: { n: 'Bunny', r: 0, spd: 214, c: '#f4f1ea', c2: '#ffd9e2', ear: 'long', tail: 'puff' },
  chick: { n: 'Chick', r: 0, spd: 208, c: '#ffd84a', c2: '#fff0a6', ear: 'none', beak: 1, tail: 'none' },
  fox: { n: 'Fox', r: 1, spd: 255, c: '#f28a3a', c2: '#fff4e6', ear: 'pt', tail: 'bush' },
  frog: { n: 'Frog', r: 1, spd: 240, c: '#72d35c', c2: '#d4f5a6', ear: 'none', frog: 1, swim: 1, tail: 'none' },
  pup: { n: 'Pup', r: 1, spd: 250, c: '#c99a6b', c2: '#f3dcc0', ear: 'flop', tail: 'stub' },
  deer: { n: 'Deer', r: 2, spd: 292, c: '#c48a52', c2: '#fff1dc', ear: 'pt', antler: 1, tail: 'puff' },
  otter: { n: 'Otter', r: 2, spd: 280, c: '#8b5e3c', c2: '#ecd2b0', ear: 'round', swim: 1, tail: 'long' },
  wolf: { n: 'Wolf', r: 2, spd: 302, c: '#8f98ad', c2: '#eef1f7', ear: 'pt', tail: 'bush' },
  dragon: { n: 'Dragon', r: 3, spd: 340, c: '#46c48a', c2: '#e1f9b0', ear: 'none', horn: 1, wings: '#2f9a6a', fly: 1, tail: 'spike' },
  unicorn: { n: 'Unicorn', r: 3, spd: 352, c: '#fbf7ff', c2: '#ffd1f0', ear: 'pt', horn: 1, mane: 1, tail: 'rainbow' },
  phoenix: { n: 'Phoenix', r: 3, spd: 362, c: '#ff6a3a', c2: '#ffd23a', ear: 'none', beak: 1, wings: '#ffb02e', fly: 1, tail: 'flame' },
};
const BY_R = [0, 1, 2, 3].map((r) => Object.keys(PETS).filter((k) => PETS[k].r === r));
const trait = (k) => PETS[k].fly ? 'Flies over trees, rocks and water' : PETS[k].swim ? 'Swims through ponds at full speed' : '';

const ZONES = [
  { n: 'MEADOW', r: 900, base: '#97db66', sp: ['#7cc552', '#b5ec84', '#86cf5a'], egg: 'Common eggs', dust: '#eef8d8' },
  { n: 'WHISPER WOODS', r: 1650, base: '#5aa957', sp: ['#4a9447', '#6dbd62', '#3f8a42'], egg: 'Rare eggs · mind the trees', dust: '#dcebc6' },
  { n: 'SUNNY DUNES', r: 2350, base: '#efd48a', sp: ['#e2c072', '#f8e3a6', '#d9b465'], egg: 'Epic eggs · quicksand slows you', dust: '#fff1c4' },
  { n: 'CRYSTAL PEAKS', r: 2950, base: '#b7a2ee', sp: ['#a48ce3', '#cdbcf7', '#9a83dc'], egg: 'Legendary eggs · far from home!', dust: '#f1eaff' },
];
const EDGE = 3020;
const wob = ZONES.map(() => [R() * TAU, R() * TAU, R() * TAU]);
const zr = (i, a) => { const p = wob[i]; return ZONES[i].r + Math.sin(a * 3 + p[0]) * 40 + Math.sin(a * 7 + p[1]) * 22 + Math.sin(a * 13 + p[2]) * 9; };
function zoneAt(x, y) { const d = Math.hypot(x, y), a = Math.atan2(y, x); for (let i = 0; i < 4; i++) if (d < zr(i, a)) return i; return 3; }
const zonePath = ZONES.map((z, i) => { const p = new Path2D(); for (let k = 0; k <= 260; k++) { const a = k / 260 * TAU, r = zr(i, a); k ? p.lineTo(Math.cos(a) * r, Math.sin(a) * r) : p.moveTo(Math.cos(a) * r, Math.sin(a) * r); } p.closePath(); return p; });
function tile(base, sp, kind) {
  const c = document.createElement('canvas'); c.width = c.height = 200; const t = c.getContext('2d');
  t.fillStyle = base; t.fillRect(0, 0, 200, 200); const r = rng(kind * 97 + 3);
  t.lineCap = 'round';
  for (let i = 0; i < 280; i++) {
    t.globalAlpha = 0.25 + r() * 0.35; t.fillStyle = t.strokeStyle = sp[i % sp.length];
    const x = 8 + r() * 184, y = 8 + r() * 184;
    if (kind < 2) { t.lineWidth = 2; t.beginPath(); t.moveTo(x, y); t.lineTo(x + (r() - 0.5) * 4, y - 4 - r() * 5); t.stroke(); }
    else { t.beginPath(); t.arc(x, y, 1 + r() * 2.4, 0, TAU); t.fill(); }
  }
  return g.createPattern(c, 'repeat');
}
const pats = ZONES.map((z, i) => tile(z.base, z.sp, i));
const ocean = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 160; const t = c.getContext('2d');
  t.fillStyle = '#3f9fd6'; t.fillRect(0, 0, 160, 160); t.strokeStyle = 'rgba(255,255,255,.22)'; t.lineWidth = 3; t.lineCap = 'round';
  for (const [x, y] of [[30, 30], [110, 60], [60, 120], [140, 140]]) { t.beginPath(); t.arc(x, y, 12, Math.PI * 1.1, Math.PI * 1.9); t.stroke(); }
  return g.createPattern(c, 'repeat');
})();

// ---------- world ----------
const NEST = { x: 0, y: 0, r: 150, col: '#ffb52e', me: 1 };
const RIVALS = [{ n: 'Mika', col: '#ff5a6e', a: -0.5 }, { n: 'Bolt', col: '#3f9dff', a: 1.6 }, { n: 'Juno', col: '#a76bff', a: 3.7 }];
const rnests = RIVALS.map((r) => ({ x: Math.cos(r.a) * 560, y: Math.sin(r.a) * 560, r: 92, col: r.col }));
const allNests = [NEST, ...rnests];
const slows = [], obst = [], decor = [];
const blobR = (o, a) => o.r * (1 + 0.16 * Math.sin(3 * a + o.p1) + 0.08 * Math.sin(5 * a + o.p2));
function blobPath(o) { const p = new Path2D(); for (let k = 0; k <= 48; k++) { const a = k / 48 * TAU, r = blobR(o, a); const x = o.x + Math.cos(a) * r, y = o.y + Math.sin(a) * r; k ? p.lineTo(x, y) : p.moveTo(x, y); } p.closePath(); return p; }
function inSlow(x, y) { for (const o of slows) { const dx = x - o.x, dy = y - o.y; if (Math.abs(dx) > o.r * 1.3 || Math.abs(dy) > o.r * 1.3) continue; if (Math.hypot(dx, dy) < blobR(o, Math.atan2(dy, dx))) return o; } return null; }
function ringPoint(z, m, rf = R) { const a = rf() * TAU; const inner = z ? zr(z - 1, a) + m : 280; const outer = zr(z, a) - m; const d = inner + Math.sqrt(rf()) * (outer - inner); return { x: Math.cos(a) * d, y: Math.sin(a) * d }; }
const nearNest = (x, y, pad) => allNests.some((n) => Math.hypot(x - n.x, y - n.y) < n.r + pad);
function addSlow(z, n, type, r0, r1) {
  for (let i = 0; i < n; i++) for (let t = 0; t < 30; t++) {
    const p = ringPoint(z, r1 + 30); if (nearNest(p.x, p.y, r1 + 90)) continue;
    if (slows.some((s) => Math.hypot(s.x - p.x, s.y - p.y) < s.r + r1 + 70)) continue;
    const o = { x: p.x, y: p.y, r: r0 + R() * (r1 - r0), p1: R() * TAU, p2: R() * TAU, type, z }; o.path = blobPath(o); slows.push(o); break;
  }
}
function addObst(z, n, type, r0, r1) {
  for (let i = 0; i < n; i++) for (let t = 0; t < 25; t++) {
    const p = ringPoint(z, 40); const r = r0 + R() * (r1 - r0);
    if (nearNest(p.x, p.y, r + 70) || inSlow(p.x, p.y)) continue;
    if (obst.some((o) => Math.hypot(o.x - p.x, o.y - p.y) < o.r + r + 16)) continue;
    obst.push({ x: p.x, y: p.y, r, type, v: R() }); break;
  }
}
addSlow(0, 6, 'pond', 80, 140); addSlow(1, 7, 'pond', 90, 160); addSlow(2, 8, 'sand', 90, 170); addSlow(3, 6, 'pond', 70, 130);
addObst(0, 30, 'bush', 20, 28); addObst(0, 10, 'tree', 28, 34); addObst(0, 10, 'rock', 18, 26);
addObst(1, 115, 'tree', 28, 40); addObst(1, 85, 'pine', 22, 30); addObst(1, 14, 'rock', 20, 30);
addObst(2, 60, 'cactus', 16, 22); addObst(2, 40, 'rock', 24, 40);
addObst(3, 80, 'crystal', 20, 32); addObst(3, 26, 'rock', 26, 42);
for (let z = 0; z < 4; z++) for (let i = 0; i < [800, 520, 380, 380][z]; i++) { const p = ringPoint(z, 0); if (nearNest(p.x, p.y, 10)) continue; decor.push({ x: p.x, y: p.y, z, v: R(), t: R() < [0.75, 0.6, 0.8, 0.7][z] ? 0 : 1 }); }

// ---------- state ----------
let state = 'menu', T = 0, playT = 0, shake = 0, incAcc = 0, coins = 0, hatch = null, toast = null, banner = null, lastZone = 0, qi = 0, hintT = 0;
const up = { saddle: 0, pouch: 0, lucky: 0 };
const stats = { hatched: 0, stolen: 0, rareH: 0, epicH: 0, legH: 0, bought: 0 };
let eggs = [], respawn = [], parts = [], floats = [], conf = [], pen = [];
const cam = { x: 0, y: 0 };
function mkRider(name, col, nest, pet, bot) { return { name, col, nest, pet, bot, x: nest.x, y: nest.y + (bot ? 0 : 50), vx: 0, vy: 0, face: 1, egg: null, dashT: 0, dashCd: 0, stun: 0, immune: 0, mv: false, target: null, think: rnd(), stuckT: 0, lx: 0, ly: 0, jit: null, aggro: 0, dust: 0, ph: rnd() * 9, chase: false }; }
const me = mkRider('You', '#ffb52e', NEST, 'piglet', false);
me.pets = ['piglet'];
const bots = RIVALS.map((r, i) => mkRider(r.n, r.col, rnests[i], pick(BY_R[0]), true));
const riders = [me, ...bots];

const EGGN = [12, 7, 5, 3];
function spawnEgg(z) {
  for (let t = 0; t < 40; t++) {
    const p = ringPoint(z, 60, rnd); if (inSlow(p.x, p.y) || nearNest(p.x, p.y, 60)) continue;
    if (obst.some((o) => Math.abs(o.x - p.x) < 80 && Math.hypot(o.x - p.x, o.y - p.y) < o.r + 28)) continue;
    if (eggs.some((e) => Math.hypot(e.x - p.x, e.y - p.y) < 130)) continue;
    eggs.push({ x: p.x, y: p.y, rar: z, ph: rnd() * TAU, born: T }); return;
  }
  respawn.push({ z, t: 1 });
}
for (let z = 0; z < 4; z++) for (let i = 0; i < EGGN[z]; i++) spawnEgg(z);

const QUESTS = [
  { t: 'Grab an egg and race it home', k: 'hatched', n: 1, pay: 20 },
  { t: 'Hatch 3 eggs', k: 'hatched', n: 3, pay: 30 },
  { t: 'Buy an upgrade at your nest', k: 'bought', n: 1, pay: 30 },
  { t: 'Hatch a Rare egg from the Woods', k: 'rareH', n: 1, pay: 60 },
  { t: "Steal a rival's egg: DASH into them", k: 'stolen', n: 1, pay: 60 },
  { t: 'Hatch an Epic egg from the Dunes', k: 'epicH', n: 1, pay: 150 },
  { t: 'Hatch a LEGENDARY egg', k: 'legH', n: 1, pay: 400 },
];
const UPS = [
  { id: 'saddle', n: 'Speed Saddle', d: '+8% riding speed', cost: [40, 120, 300, 700, 1500] },
  { id: 'pouch', n: 'Warm Pouch', d: '+2 seconds before an egg cracks', cost: [60, 180, 450, 1000] },
  { id: 'lucky', n: 'Lucky Nest', d: '+4% chance to hatch one rarity higher', cost: [80, 250, 600, 1400] },
];
const income = () => me.pets.reduce((s, k) => s + RAR[PETS[k].r].inc, 0);

// ---------- sound ----------
let AC = null, muted = false;
function sfx(n) {
  if (muted) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const seq = { pick: [[660, 0.08], [880, 0.12]], dash: [[260, 0.12, 'sawtooth', 0.04, 620]], steal: [[520, 0.07], [780, 0.07], [1040, 0.14]], lost: [[420, 0.12], [260, 0.22]],
