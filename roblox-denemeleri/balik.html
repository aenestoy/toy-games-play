<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Deep Hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Deep Hook prototype: one canvas for sea, sky and HUD; DOM for buttons and panels. */
html,body{margin:0;height:100%;overflow:hidden;background:#0b2f55;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Fredoka,system-ui,sans-serif;color:#10283f}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 22px;font-size:20px;color:#fff;background:linear-gradient(#ffbf3a,#f07b12);box-shadow:0 5px 0 #b4520a,0 8px 18px rgba(0,0,0,.25);cursor:pointer;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b4520a,0 4px 10px rgba(0,0,0,.2)}
.btn.green{background:linear-gradient(#86e464,#39a83a);box-shadow:0 5px 0 #23702a,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#66ccff,#2a86e0);box-shadow:0 5px 0 #1a5aa0,0 8px 18px rgba(0,0,0,.25)}
.btn.ad{background:linear-gradient(#b48cff,#7a4ce0);box-shadow:0 5px 0 #4e2b9c,0 8px 18px rgba(0,0,0,.25)}
.btn.ad::before{content:"▶ ";font-size:.8em}
.btn.small{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{filter:grayscale(1) brightness(.85);cursor:default}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(200,240,255,.2),rgba(5,20,50,.6));padding:16px}
.card{background:#f2fbff;border-radius:26px;padding:22px 24px 24px;box-shadow:0 10px 0 #9fcde6,0 20px 50px rgba(0,0,0,.35);text-align:center;max-width:440px;width:100%;box-sizing:border-box}
.logo{font-size:clamp(46px,12vw,72px);font-weight:700;line-height:.95;color:#5fd0ff;-webkit-text-stroke:3px #0b3a66;text-shadow:0 6px 0 #0b3a66;margin:4px 0 12px}
.logo span{display:block;color:#ffc531;-webkit-text-stroke:3px #7a3d0a;text-shadow:0 6px 0 #7a3d0a}
.steps{display:grid;gap:8px;margin:6px 0 18px;text-align:left}
.steps div{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:600;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 0 #cfe6f2}
.steps b{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;background:#2a86e0;color:#fff;font-size:16px}
#menu .btn{font-size:26px;padding:14px 46px}
#bar{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 10px}
#bar .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#cast{font-size:28px;padding:16px 64px;border-radius:22px}
#upBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom))}
#upBtn:active{transform:translate(-50%,3px)}
#cb{position:fixed;left:0;right:0;bottom:max(18px,4vh);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,20,50,.6);padding:12px}
.panel .card{max-width:600px;max-height:88vh;overflow:auto;text-align:left;padding:18px}
.panel h2{margin:0 0 4px;font-size:28px;color:#0b3a66}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.coins{font-weight:700;color:#b06d00}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 0 #cfe6f2}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px}
.row .t small{color:#4d6a80;font-size:14px}
.lv{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lv i{width:9px;height:9px;border-radius:50%;background:#cfe0ea}
.lv i.on{background:#2a86e0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:8px}
.cell{background:#fff;border-radius:14px;padding:6px 6px 8px;text-align:center;box-shadow:0 2px 0 #cfe6f2;border:3px solid transparent}
.cell canvas{position:static;width:100px;height:56px;display:block;margin:0 auto}
.cell b{display:block;font-size:14px}
.cell small{display:block;font-size:12px;font-weight:700;color:#4d6a80}
.tank{position:static!important;width:100%;height:220px;border-radius:16px;display:block;margin-top:8px}
#ad{position:fixed;inset:0;background:#111;color:#fff;display:grid;place-items:center;text-align:center;font-size:22px}
#ad small{display:block;opacity:.6;font-size:15px;margin-top:8px}
#mute{position:fixed;left:max(12px,env(safe-area-inset-left));top:104px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card">
    <div class="logo">DEEP<span>HOOK</span></div>
    <div class="steps">
      <div><b>1</b>Drop your hook and steer it onto the fish you want</div>
      <div><b>2</b>Hold to keep the green bar on the fish to reel it in</div>
      <div><b>3</b>Sell it or keep it in your aquarium. Go deeper, fish at night, win the Derby!</div>
    </div>
    <button class="btn green" id="play">PLAY</button>
  </div>
</div>

<div id="bar" class="hide">
  <button class="btn green" id="cast">CAST</button>
  <div class="row2">
    <button class="btn small" id="bShop">🛒 Shop</button>
    <button class="btn small blue" id="bTank">🐠 Aquarium</button>
    <button class="btn small blue" id="bBook">📖 Fish Book</button>
    <button class="btn small" id="bDerby" style="background:linear-gradient(#ff8a6a,#e0453a);box-shadow:0 5px 0 #9a2a20">🏆 Derby</button>
  </div>
</div>
<button class="btn blue hide" id="upBtn">⤒ REEL UP</button>
<div id="cb" class="hide">
  <button class="btn" id="cSell">SELL</button>
  <button class="btn blue" id="cTank">AQUARIUM</button>
  <button class="btn ad" id="cAd">x2 VALUE</button>
</div>
<div id="panel" class="panel hide"><div class="card" id="pc"></div></div>
<div id="ad" class="hide"><div>Advertisement<small id="adT">Reward in 2…</small></div></div>
<button id="mute" aria-label="Sound on or off">🔊</button>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#c'); let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, zoom = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); zoom = Math.max(0.6, Math.min(1.6, Math.min(W, H) / 560)); }
addEventListener('resize', resize); resize();
const TOUCH = matchMedia('(pointer: coarse)').matches;
const rnd = Math.random, TAU = Math.PI * 2;
const pick = (a) => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(',')})`; }
function shade(h, a) { return a < 0 ? mix(h, '#000000', -a) : mix(h, '#ffffff', a); }
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, size, col, align = 'center', stroke = '#0b2440', sw = 0) {
  g.font = `700 ${size}px Fredoka, system-ui, sans-serif`; g.textAlign = align; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = sw || Math.max(3, size * 0.2); g.strokeStyle = stroke; g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y);
}

// ---------- data ----------
const RAR = [
  { n: 'Common', c: '#e9f1f6', inc: 1, spd: 0.75, drain: 0.12 },
  { n: 'Rare', c: '#4fb0ff', inc: 3, spd: 1.0, drain: 0.2 },
  { n: 'Epic', c: '#b06bff', inc: 8, spd: 1.3, drain: 0.24 },
  { n: 'Legendary', c: '#ffc531', inc: 20, spd: 1.65, drain: 0.28 },
];
const M = 10; // world units per metre
const SP = [
  { n: 'Sardine', r: 0, d: [2, 50], kg: [0.1, 0.3], p: 4, sh: 'fish', c: '#9fb8d0', c2: '#eef5fa', sz: 15 },
  { n: 'Clownfish', r: 0, d: [5, 45], kg: [0.2, 0.5], p: 6, sh: 'fish', c: '#ff8a2a', c2: '#ffffff', pat: 'bands', sz: 17 },
  { n: 'Sunny Snapper', r: 0, d: [10, 60], kg: [1, 3], p: 9, sh: 'fish', c: '#ff6b5a', c2: '#ffd8c8', sz: 24 },
  { n: 'Pufferfish', r: 1, d: [15, 70], kg: [0.5, 1.5], p: 22, sh: 'puffer', c: '#f2d264', c2: '#fff6d0', pat: 'spots', sz: 20 },
  { n: 'Golden Koi', r: 3, d: [8, 45], kg: [3, 6], p: 650, sh: 'fish', c: '#ffc531', c2: '#fff3c0', pat: 'spots', sz: 30, few: 1 },
  { n: 'Moonfish', r: 1, d: [5, 60], kg: [2, 4], p: 48, sh: 'fish', c: '#c9d6ff', c2: '#ffffff', glow: '#cfe0ff', sz: 24, tall: 1, cond: 'night' },
  { n: 'Blue Tang', r: 0, d: [60, 140], kg: [0.5, 1.5], p: 14, sh: 'fish', c: '#3f7dff', c2: '#ffd23a', sz: 20 },
  { n: 'Parrotfish', r: 0, d: [70, 150], kg: [2, 5], p: 18, sh: 'fish', c: '#4fd1a8', c2: '#ff8fc8', pat: 'scales', sz: 28 },
  { n: 'Lionfish', r: 1, d: [70, 150], kg: [0.6, 1.4], p: 38, sh: 'fish', c: '#ff7a5a', c2: '#fff0e8', pat: 'bands', fins: 1, sz: 24 },
  { n: 'Seahorse', r: 1, d: [60, 130], kg: [0.05, 0.2], p: 42, sh: 'horse', c: '#ffb03a', c2: '#ffe2a0', sz: 20 },
  { n: 'Octopus', r: 2, d: [90, 160], kg: [3, 9], p: 110, sh: 'octo', c: '#e0568a', c2: '#ffb6cf', sz: 28 },
  { n: 'Star Ray', r: 2, d: [80, 160], kg: [8, 20], p: 170, sh: 'ray', c: '#5a4fd0', c2: '#fff6a0', glow: '#a99bff', sz: 40, cond: 'night' },
  { n: 'Lanternfish', r: 0, d: [150, 280], kg: [0.1, 0.4], p: 26, sh: 'fish', c: '#4a6aa0', c2: '#9fe8ff', glow: '#7fe0ff', sz: 18 },
  { n: 'Hatchetfish', r: 1, d: [160, 280], kg: [0.2, 0.6], p: 55, sh: 'fish', c: '#c0c8d8', c2: '#8fe0ff', glow: '#9fe8ff', sz: 20, tall: 1 },
  { n: 'Swordfish', r: 2, d: [150, 270], kg: [40, 90], p: 170, sh: 'sword', c: '#3a5a9a', c2: '#c8d8f0', sz: 46 },
  { n: 'Thunder Eel', r: 2, d: [170, 280], kg: [6, 14], p: 240, sh: 'eel', c: '#ffe23a', c2: '#4a3a9a', glow: '#fff27a', sz: 44, cond: 'storm' },
  { n: 'Anglerfish', r: 1, d: [280, 450], kg: [2, 8], p: 95, sh: 'angler', c: '#4a3a5a', c2: '#ffe680', glow: '#ffe680', sz: 30 },
  { n: 'Gulper Eel', r: 2, d: [300, 450], kg: [1, 3], p: 210, sh: 'eel', c: '#2e2848', c2: '#ff5a8a', glow: '#ff7aa8', sz: 40 },
  { n: 'Ghost Shark', r: 2, d: [300, 450], kg: [20, 50], p: 280, sh: 'shark', c: '#b8c4d8', c2: '#eef4ff', sz: 52 },
  { n: 'Kraken Jr.', r: 3, d: [370, 450], kg: [60, 150], p: 1200, sh: 'octo', c: '#8a2a5a', c2: '#ff8ac0', glow: '#ff7ab8', sz: 54, few: 1 },
];
SP.forEach((s, i) => s.id = i);
const ZONES = [{ n: 'SUNLIT SHALLOWS', d: 0 }, { n: 'CORAL REEF', d: 60 }, { n: 'TWILIGHT DEEP', d: 150 }, { n: 'THE ABYSS', d: 280 }];
const LINE = [60, 150, 280, 450];
const UPS = [
  { id: 'line', n: 'Longer Line', d: (l) => `Reach ${LINE[Math.min(l + 1, 3)]} m: ${['the Coral Reef', 'the Twilight Deep', 'the Abyss'][Math.min(l, 2)]}`, cost: [60, 300, 1200] },
  { id: 'reel', n: 'Smooth Reel', d: () => 'Bigger green bar: easier to land fish', cost: [50, 160, 450, 1100] },
  { id: 'lure', n: 'Shiny Lure', d: () => '+5% chance a fish is Shiny (worth x3)', cost: [80, 260, 700] },
  { id: 'tank', n: 'Bigger Aquarium', d: () => '+3 aquarium spots', cost: [70, 220, 600, 1500] },
];
const QUESTS = [
  { t: 'Catch your first fish', k: 'caught', n: 1, pay: 15 },
  { t: 'Keep a fish in your Aquarium', k: 'kept', n: 1, pay: 20 },
  { t: 'Buy a Longer Line in the Shop', k: 'lineUp', n: 1, pay: 30 },
  { t: 'Catch a Rare fish', k: 'rareC', n: 1, pay: 40 },
  { t: 'Catch a fish at night', k: 'nightC', n: 1, pay: 50 },
  { t: 'Win a Derby', k: 'derbyWin', n: 1, pay: 120 },
  { t: 'Discover 10 kinds of fish', k: 'kinds', n: 10, pay: 150 },
  { t: 'Catch a LEGENDARY fish', k: 'legC', n: 1, pay: 500 },
];

// ---------- state ----------
const WW = 1200, FLOOR = 460 * M;
let state = 'menu', T = 0, coins = 0, qi = 0, banner = null, toast = null, shake = 0;
const up = { line: 0, reel: 0, lure: 0, tank: 0 };
const stats = { caught: 0, kept: 0, lineUp: 0, rareC: 0, nightC: 0, derbyWin: 0, kinds: 0, legC: 0 };
const book = {}; // id -> { n, best, shiny }
let tank = []; // { id, kg, shiny }
let fish = [], jellies = [], bubbles = [], parts = [], floats = [], conf = [];
const hook = { x: WW / 2 + 40, y: -60, tx: WW / 2, vy: 0, stun: 0, limitT: 0, fish: null };
let mg = null, caught = null, derby = null, derbyCd = 0, stormT = 0, nextStorm = 140, prevNight = false, prevZone = -1;
const cam = { x: WW / 2, y: 0 };
const tankCap = () => 4 + up.tank * 3;
const income = () => tank.reduce((s, f) => s + RAR[SP[f.id].r].inc * (f.shiny ? 3 : 1), 0);
const dayP = () => ((T + 8) / 150) % 1;
const isNight = () => { const p = dayP(); return p > 0.55 && p < 0.9; };
const isStorm = () => stormT > 0;
const active = (s) => !s.cond || (s.cond === 'night' ? isNight() : isStorm());

function spawnFish(s, anywhere) {
  const y = (s.d[0] + rnd() * (s.d[1] - s.d[0])) * M;
  const dir = rnd() < 0.5 ? -1 : 1;
  const x = anywhere ? 60 + rnd() * (WW - 120) : dir > 0 ? -80 : WW + 80;
  fish.push({ s, x, y, by: y, dir, spd: 30 + s.r * 22 + rnd() * 25, ph: rnd() * TAU, flee: 0, a: anywhere ? 1 : 0 });
}
for (const s of SP) { const n = s.few ? 1 : [5, 3, 2, 1][s.r]; for (let i = 0; i < n; i++) spawnFish(s, true); }
for (let i = 0; i < 14; i++) jellies.push({ x: rnd() * WW, y: (130 + rnd() * 300) * M, ph: rnd() * TAU, s: 0.8 + rnd() * 0.5 });
const deco = []; { let x = 0; while (x < WW) { deco.push({ x, k: rnd(), h: 60 + rnd() * 120 }); x += 30 + rnd() * 60; } }

// ---------- sound ----------
let AC = null, muted = false;
function sfx(n) {
  if (muted) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const seq = { cast: [[500, 0.12, 'sine', 0.08, 200]], bite: [[880, 0.06], [660, 0.06], [990, 0.1]], catch: [[523, 0.1], [659, 0.1], [784, 0.1], [1046, 0.3]], lost: [[400, 0.12], [240, 0.25]],
    sell: [[1200, 0.05], [1600, 0.12]], quest: [[784, 0.1], [988, 0.1], [1318, 0.25]], buy: [[880, 0.06], [1175, 0.12]], zap: [[160, 0.18, 'square', 0.05, 60]], tick: [[1500, 0.02, 'square', 0.02]], splash: [[300, 0.15, 'sine', 0.06, 120]] }[n];
  let t = AC.currentTime;
  for (const [f, d, type = 'triangle', v = 0.09, f2] of seq) { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.8; }
}
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; };

// ---------- input ----------
const K = { l: 0, r: 0, hold: 0 }; let pdown = false, px = null;
addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') K.l = 1;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') K.r = 1;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (e.repeat) return; K.hold = 1; if (state === 'menu') start(); else if (state === 'surface') cast(); else if (state === 'drop') reelUp(); }
});
addEventListener('keyup', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') K.l = 0; if (e.code === 'ArrowRight' || e.code === 'KeyD') K.r = 0; if (e.code === 'Space' || e.code === 'Enter') K.hold = 0; });
addEventListener('blur', () => { K.l = K.r = K.hold = 0; pdown = false; });
cv.addEventListener('pointerdown', (e) => { pdown = true; px = e.clientX; });
addEventListener('pointermove', (e) => { if (pdown || e.pointerType === 'mouse') px = e.clientX; });
addEventListener('pointerup', () => { pdown = false; }); addEventListener('pointercancel', () => { pdown = false; });

// ---------- flow ----------
function setUI() {
  $('#bar').classList.toggle('hide', state !== 'surface');
  $('#upBtn').classList.toggle('hide', state !== 'drop');
  $('#cb').classList.toggle('hide', state !== 'card' || !caught || caught.t < 1.1);
  $('#bDerby').disabled = !!derby || derbyCd > 0;
  $('#bDerby').textContent = derby ? `🏆 ${Math.ceil(derby.t)}s` : derbyCd > 0 ? `🏆 ${Math.ceil(derbyCd)}s` : '🏆 Derby';
}
function start() { if (state !== 'menu') return; $('#menu').classList.add('hide'); state = 'surface'; toast = { t: 0, a: 'SUNLIT SHALLOWS', b: 'Tap CAST to drop your hook' }; sfx('splash'); setUI(); }
function cast() { if (state !== 'surface') return; state = 'drop'; hook.x = WW / 2 + 40; hook.tx = hook.x; hook.y = 10; hook.vy = 260; hook.limitT = 0; hook.stun = 0; sfx('cast'); splash(hook.x, 0); setUI(); }
function reelUp() { if (state !== 'drop') return; state = 'up'; setUI(); }
function bite(f) {
  state = 'reel'; hook.fish = f; f.hooked = 1; sfx('bite'); shake = 6;
  const shiny = rnd() < 0.03 + up.lure * 0.05;
  mg = { f, shiny, fishY: 0.5, tgt: 0.5, ft: 0, barY: 0.4, barV: 0, prog: 0.4, size: 0.24 + up.reel * 0.04 + (stats.caught < 2 ? 0.1 : 0), r: f.s.r, t: 0 };
  setUI();
}
function landed() {
  const f = mg.f, s = f.s, kg = +(s.kg[0] + rnd() * (s.kg[1] - s.kg[0])).toFixed(s.kg[1] < 1 ? 2 : 1);
  const avg = (s.kg[0] + s.kg[1]) / 2, val = Math.max(1, Math.round(s.p * (0.7 + 0.6 * (kg / avg) / 2) * (mg.shiny ? 3 : 1)));
  const isNew = !book[s.id]; book[s.id] = book[s.id] || { n: 0, best: 0, shiny: false }; book[s.id].n++; book[s.id].best = Math.max(book[s.id].best, kg); if (mg.shiny) book[s.id].shiny = true;
  stats.caught++; stats.kinds = Object.keys(book).length; if (s.r >= 1) stats.rareC++; if (s.r >= 3) stats.legC++; if (isNight()) stats.nightC++;
  if (derby) { derby.me += kg; derby.feed.unshift({ who: 'You', s: s.n, kg }); }
  caught = { id: s.id, kg, val, shiny: mg.shiny, isNew, t: 0, ad: false };
  fish.splice(fish.indexOf(f), 1); setTimeout(() => spawnFish(s, false), 4000 + rnd() * 5000);
  mg = null; hook.fish = null; state = 'card'; sfx('catch');

// ---------- update ----------
function update(dt) {
  T += dt; shake *= Math.pow(0.02, dt); if (shake < 0.3) shake = 0;
  if (state !== 'menu' && state !== 'panel' && state !== 'ad') {
    if (derby) derbyTick(dt); else if (derbyCd > 0) derbyCd -= dt;
    coins += income() * dt; // shown floored
  }
  // world clock: day/night and storms
  if (stormT > 0) stormT -= dt; else if (state !== 'menu' && T > nextStorm) { stormT = 30; nextStorm = T + 200 + rnd() * 60; toast = { t: 0, a: 'STORM!', b: 'Thunder Eels come out in the deep' }; }
  const n = isNight(); if (n !== prevNight && state !== 'menu') toast = n ? { t: 0, a: 'NIGHT FALLS', b: 'Glowing night fish are rising' } : { t: 0, a: 'SUNRISE', b: 'Day fish are back' }; prevNight = n;
  for (const f of fish) {
    if (f.hooked) continue;
    f.a = Math.min(1, f.a + dt);
    let sp = f.spd; if (f.flee > 0) { f.flee -= dt; sp *= 3.2; }
    f.x += f.dir * sp * dt; f.y = f.by + Math.sin(T * 1.2 + f.ph) * 14;

    if (Math.hypot(f.x - hook.x, f.y - hook.y) > 260) f.dodged = 0;
  }
  for (const j of jellies) { j.y += Math.sin(T * 0.6 + j.ph) * 12 * dt; j.x += Math.cos(T * 0.3 + j.ph) * 8 * dt; }
  if (rnd() < dt * 6) bubbles.push({ x: rnd() * WW, y: cam.y + 400 + rnd() * 200, r: 2 + rnd() * 4, v: 40 + rnd() * 60 });
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.y -= b.v * dt; b.x += Math.sin(T * 3 + b.r) * 10 * dt; if (b.y < 0 || b.y < cam.y - 600) bubbles.splice(i, 1); }

  const lim = LINE[up.line] * M;
  if (state === 'drop') {
    if (px != null && (pdown || !TOUCH)) hook.tx = cam.x + (px - W / 2) / zoom;
    if (K.l || K.r) hook.tx = hook.x + (K.r - K.l) * 120;
    hook.tx = clamp(hook.tx, 30, WW - 30);
