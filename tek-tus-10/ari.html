<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meadow Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#5fae4a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const G_KEY='tt10_ari_best';
// ===== Meadow Run =====
const PCOL=['#ff6f91','#ffb347','#a78bfa','#ff8fd0','#ffffff','#6fc3ff'];
let k=1,gy=0,cy=0,camX=0,T=0,spd=150,flowers=[],wasps=[],bee,bud,pollen=0,jars=0,nextF=0,nextW=0,combo=0;
const vw=()=>W/k,sx=x=>(x-camX)*k,headY=f=>gy-f.st*k;
const G={hint:'Tap to dive onto open flowers',roundLen:75,upCoins:8,maxLives:3,lives:3,locked:["Queen's Room",'Royal Jelly','Orchard'],
 upgrades:[{id:'long',name:'Long Sip',desc:'Each dive skims on and sips two flowers in a row.'},{id:'buddy',name:'Swarm Buddy',desc:'A second bee follows you and copies your dive one beat later.'}],
 resize(){k=Math.min(W/420,H/560);gy=H*.82;cy=H*.36},
 reset(){flowers=[];wasps=[];pollen=0;jars=0;combo=0;spd=150;this.lives=3;camX=0;nextF=vw()*.45;nextW=0;bee=mkBee(false);bud=null;while(nextF<vw()+400)genFlower()},
 hintY:()=>H*.6,
 down(){dive(bee);if(bud&&!bud.out)bud.q=.42},
 safe:()=>bee.mode==='fly',
 onUpgrade(id){if(id==='buddy'){bud=mkBee(true);bud.x=bee.x-60}},
 score:()=>coins,
 endTitle:r=>r==='time'?'Sweet run!':'Too many stings!',
 endLines:()=>[`Pollen: ${pollen+jars*5}`,`Honey jars: ${jars}`,`Coins: ${coins}`],
 idle(dt){T+=dt;bee.x+=spd*.4*dt;camX=bee.x-vw()*.28;flyY(bee);while(nextF<camX+vw()+300)genFlower()},
 update(dt){T+=dt;spd=lerp(150,235,cl(runT/70,0,1));const old=camX;
  stepBee(bee,dt);if(bud){bud.x+=spd*dt;if(bud.q>0){bud.q-=dt;if(bud.q<=0)dive(bud)}stepBee(bud,dt,true);if(bud.mode==='fly')bud.x+=(bee.x-60-bud.x)*cl(dt*2,0,1)}
  camX=bee.x-vw()*(W>H?.24:.22);fxShift(-(camX-old)*k);
  while(nextF<camX+vw()+300)genFlower();
  if(runT>21&&runT>nextW){nextW=runT+R(3.5,6);wasps.push({x:camX+vw()+60,ph:R(0,6),base:0})}
  for(const w of wasps){w.x-=25*dt}
  for(const b of bud?[bee,bud]:[bee]){if(b.inv>0||b.out)continue;const by=b.y;for(const w of wasps){const wy=waspY(w);if(Math.abs(sx(w.x)-sx(b.x))<20*k&&Math.abs(wy-by)<22*k){sting(b,'Wasp!');break}}}
  flowers=flowers.filter(f=>f.x>camX-100);wasps=wasps.filter(w=>w.x>camX-100)},
 draw(){drawScene()},
 drawIcon(id,x,y,s){if(id==='long'){drawFlower({x:0,t:'open',c:'#ff6f91',st:0,used:0},x-s*.28,y+s*.2,s*.009);drawFlower({x:0,t:'open',c:'#a78bfa',st:0,used:0},x+s*.28,y+s*.2,s*.009);g.setLineDash([s*.04,s*.04]);g.strokeStyle='#c08a20';g.lineWidth=s*.03;g.beginPath();g.moveTo(x-s*.42,y-s*.35);g.quadraticCurveTo(x-s*.3,y+s*.15,x,y+s*.05);g.quadraticCurveTo(x+s*.3,y+s*.15,x+s*.42,y-s*.35);g.stroke();g.setLineDash([]);drawBee(x,y-s*.1,s*.012,0,0)}
  else{drawBee(x-s*.16,y-s*.05,s*.012,0,0);drawBee(x+s*.22,y+s*.12,s*.009,1,0)}}};
function mkBee(b){return{x:0,y:cy,mode:'fly',t:0,y0:0,ty:0,f:null,inv:0,buddy:b,out:0,skimT:0,q:0,first:null}}
function genFlower(){const late=runT>20,r=Math.random();let t='open';if(r<.27)t='bud';else if(late&&r<.27+.17)t='thistle';flowers.push({x:nextF,t,c:pick(PCOL),st:R(52,82),used:0,ph:R(0,6)});nextF+=R(62,118)}
function flyY(b){b.y=cy+Math.sin(T*2.2+(b.buddy?-.8:0))*18*k-(b.buddy?26*k:0)}
function waspY(w){const top=cy+44*k,bot=gy-96*k;return lerp(top,bot,.5+.5*Math.sin(T*2.4+w.ph))}
function under(x){let best=null,bd=26;for(const f of flowers){const d=Math.abs(f.x-x);if(d<bd){bd=d;best=f}}return best}
function dive(b){if(b.out||(b.mode!=='fly'&&b.mode!=='up'))return;b.mode='down';b.t=0;b.y0=b.y;b.first=null;
 let lx=b.x+spd*.22;if(b.buddy){let bst=null,bd=45;for(const f of flowers){if(f.t!=='open'||f.used)continue;const d=Math.abs(f.x-lx);if(d<bd){bd=d;bst=f}}if(bst)b.aim=bst.x-lx;else b.aim=0}else b.aim=0;
 const f=under(lx+b.aim);b.ty=(f?headY(f):gy-60*k)-12*k;if(!b.buddy)tone(520,.12,'sine',.05,260)}
function stepBee(b,dt,isB){b.inv=Math.max(0,b.inv-dt);if(!isB)b.x+=spd*dt;
 if(b.out){b.out-=dt;b.y+=(cy-40*k-b.y)*dt*2;if(b.out<=0){b.out=0;b.mode='fly'}return}
 if(b.mode==='fly')flyY(b);
 else if(b.mode==='down'){b.t+=dt;if(b.aim){const s=b.aim*dt/.22;b.x+=s}const e=cl(b.t/.22,0,1);b.y=lerp(b.y0,b.ty,e*e);if(e>=1){b.mode='sip';b.t=0;sip(b)}}
 else if(b.mode==='sip'){b.t+=dt;if(b.t>.12){if(upg==='long'&&!b.buddy&&!b.second){b.mode='skim';b.t=0;b.second=true}else{b.mode='up';b.t=0;b.y0=b.y;b.second=false}}}
 else if(b.mode==='skim'){b.t+=dt;let nf=null;for(const f of flowers)if(f.x>b.x+8&&(!nf||f.x<nf.x))nf=f;if(nf){b.y+=(headY(nf)-12*k-b.y)*cl(dt*10,0,1);if(nf.x-b.x<6){b.mode='sip';b.t=0;sip(b)}}if(b.t>1.2||!nf){b.mode='up';b.t=0;b.y0=b.y;b.second=false}}
 else if(b.mode==='up'){b.t+=dt;const e=cl(b.t/.32,0,1),tgt=cy+Math.sin(T*2.2+(b.buddy?-.8:0))*18*k-(b.buddy?26*k:0);b.y=lerp(b.y0,tgt,1-(1-e)*(1-e));if(e>=1)b.mode='fly'}}
function sip(b){const f=under(b.x),X=sx(b.x),Y=b.y;
 if(!f){pop(X,Y-24*k,'miss','#e8e8e8',UI(16));combo=0;hiss(.08,.04,2500);return}
 if(f.used){pop(X,Y-24*k,'empty','#e8e8e8',UI(16));return}
 if(f.t==='bud'){f.used=1;pop(X,Y-24*k,'bud...','#cfe8c0',UI(16));combo=0;tone(240,.08,'triangle',.04);return}
 if(f.t==='thistle'){if(grace()){pop(X,Y-24*k,'prickly!','#e0c0ff',UI(16));return}sting(b,'Thistle!');return}
 f.used=1;const dx=Math.abs(f.x-b.x),pf=dx<7&&!b.buddy,n=pf?2:1;pollen+=n;combo++;
 burst(X,Y+10*k,pf?24:12,['#ffe066','#fff3a0',f.c],(pf?240:140)*k,3*k,120*k,.6);tone(660+combo*40,.08,'triangle',.05);tone(990+combo*40,.1,'triangle',.04,0,.05);
 if(pf)perfect(X,Y-40*k);else pop(X,Y-26*k,'+'+n+' pollen','#fff3a0',UI(17));
 while(pollen>=5){pollen-=5;jars++;coins+=4;coinSfx();pop(W/2,H*.3,'Honey jar! +4','#ffc23a',UI(26),1);burst(UI(36),UI(80),20,['#ffc23a','#fff3a0'],200,4,0,.6)}}
function sting(b,why){b.inv=1.2;combo=0;burst(sx(b.x),b.y,20,['#ff6a6a','#ffd0d0'],220*k,3*k,0,.5);tone(140,.25,'sawtooth',.06,70);
 if(b.buddy){b.out=2.5;pop(sx(b.x),b.y-24*k,'Buddy dazed','#ffd0d0',UI(16));return}
 b.mode='up';b.t=0;b.y0=b.y;b.second=false;if(grace()){pop(sx(b.x),b.y-24*k,'Careful!','#ffd0d0',UI(18));return}
 G.lives--;shake=Math.max(shake,UI(9));pop(sx(b.x),b.y-30*k,'Ouch! '+why,'#ff8a8a',UI(22),1);if(G.lives<=0)endRun('out')}
function drawBee(x,y,s,buddy,t){g.save();g.translate(x,y);g.scale(s,s);const fl=Math.sin(T*50)*.5;g.fillStyle='rgba(235,248,255,.85)';g.beginPath();g.ellipse(-4,-16,10,14,-.4+fl,0,TAU);g.fill();g.beginPath();g.ellipse(6,-15,8,12,.3-fl,0,TAU);g.fill();
 g.fillStyle=buddy?'#ffd86a':'#ffc21a';g.beginPath();g.ellipse(0,0,20,14,0,0,TAU);g.fill();g.fillStyle='#2a2018';g.fillRect(-9,-13,5,26);g.fillRect(1,-13,5,26);g.beginPath();g.moveTo(-20,0);g.lineTo(-27,3);g.lineTo(-19,5);g.fill();
 circ(13,-4,6,'#fff');circ(15,-4,3,'#1a1a1a');g.strokeStyle='#2a2018';g.lineWidth=1.6;g.beginPath();g.moveTo(14,-11);g.quadraticCurveTo(18,-22,24,-22);g.stroke();circ(9,4,2.5,'rgba(255,120,120,.6)');g.restore()}
function drawWasp(x,y,s){g.save();g.translate(x,y);g.scale(-s,s);const fl=Math.sin(T*55)*.5;g.fillStyle='rgba(230,240,255,.7)';g.beginPath();g.ellipse(-2,-14,7,13,-.3+fl,0,TAU);g.fill();g.fillStyle='#ff9a1a';g.beginPath();g.ellipse(-10,2,12,8,0,0,TAU);g.fill();g.fillStyle='#1a1410';g.fillRect(-16,-6,3,16);g.fillRect(-9,-6,3,16);g.beginPath();g.moveTo(-22,2);g.lineTo(-32,6);g.lineTo(-21,7);g.fill();
 g.fillStyle='#ff9a1a';g.beginPath();g.ellipse(8,-2,8,7,0,0,TAU);g.fill();circ(11,-4,3.2,'#fff');circ(12,-4,1.8,'#c01a1a');g.strokeStyle='#1a1410';g.lineWidth=2;g.beginPath();g.moveTo(8,-9);g.lineTo(14,-7);g.stroke();g.restore()}
function drawFlower(f,x,hy,s){g.save();g.translate(x,hy);g.scale(s,s);
 if(f.st){g.strokeStyle='#3f8a3a';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(4,f.st*.5,0,f.st);g.stroke();g.fillStyle='#4fa040';g.beginPath();g.ellipse(7,f.st*.6,8,3.5,.5,0,TAU);g.fill()}
 if(f.t==='open'){const c=f.used?'#c9b8a8':f.c,r=f.used?9:13;for(let i=0;i<6;i++){const a=i/6*TAU+(f.ph||0)*.2;circ(Math.cos(a)*r,Math.sin(a)*r*.6,f.used?6:9,c)}circ(0,0,f.used?5:8,f.used?'#a89060':'#ffd23a')}
 else if(f.t==='bud'){g.fillStyle='#6fbf50';g.beginPath();g.moveTo(0,8);g.quadraticCurveTo(-11,-4,0,-18);g.quadraticCurveTo(11,-4,0,8);g.fill();g.fillStyle='#ff9ab8';g.fillRect(-1.5,-18,3,6)}
 else{g.fillStyle='#4a7a3a';g.beginPath();g.ellipse(0,3,9,8,0,0,TAU);g.fill();g.fillStyle='#b05ad8';g.beginPath();for(let i=0;i<9;i++){const a=Math.PI+i/8*Math.PI;g.moveTo(0,-2);g.lineTo(Math.cos(a)*15,-2+Math.sin(a)*15);g.lineTo(Math.cos(a+.15)*8,-2+Math.sin(a+.15)*8)}g.fill();g.strokeStyle='#2f5a2a';g.lineWidth=1.5;for(let i=0;i<6;i++){const a=i/6*TAU;g.beginPath();g.moveTo(Math.cos(a)*8,3+Math.sin(a)*7);g.lineTo(Math.cos(a)*14,3+Math.sin(a)*12);g.stroke()}}
 g.restore()}
function drawScene(){let gr=g.createLinearGradient(0,0,0,gy);gr.addColorStop(0,'#8fd3ff');gr.addColorStop(1,'#fff3d6');g.fillStyle=gr;g.fillRect(0,0,W,gy);circ(W*.85,H*.14,30*k,'#fff6c0');
 for(const [par,col,hh,per] of [[.15,'#b7dfa0',90,420],[.4,'#8fcc7a',60,260]]){const o=-(camX*par*k)%(per*k);g.fillStyle=col;for(let x=o-per*k;x<W+per*k;x+=per*k){g.beginPath();g.ellipse(x,gy,per*.75*k,hh*k,0,Math.PI,0);g.fill()}}
 g.fillStyle='#5fae4a';g.fillRect(0,gy,W,H-gy);g.fillStyle='#4f9a3e';const o=-(camX*k)%(18*k);for(let x=o-18*k;x<W;x+=18*k){g.beginPath();g.moveTo(x,gy+2);g.lineTo(x+5*k,gy-9*k);g.lineTo(x+10*k,gy+2);g.fill()}
 // landing marker
 if(bee.mode==='fly'&&state!=='end'){const lx=bee.x+spd*.22,f=under(lx);g.fillStyle=f&&f.t==='open'&&!f.used?'rgba(255,240,120,.55)':'rgba(0,0,0,.18)';g.beginPath();g.ellipse(sx(lx),gy+6*k,14*k,4*k,0,0,TAU);g.fill()}
 for(const f of flowers){const x=sx(f.x);if(x<-60||x>W+60)continue;drawFlower(f,x,headY(f),k)}
 for(const w of wasps)drawWasp(sx(w.x),waspY(w),k*1.1);
 if(bud)drawBee(sx(bud.x),bud.y,k*(bud.out?.8:.85),1,0);
 g.globalAlpha=bee.inv>0&&Math.sin(T*40)>0?.4:1;drawBee(sx(bee.x),bee.y,k,0,0);g.globalAlpha=1;
 // honey meter
 const mx=UI(14),my=UI(68),mw=UI(26),mh=UI(30);g.fillStyle='rgba(255,255,255,.55)';rr(mx,my,mw,mh,UI(6));g.fill();g.fillStyle='#ffb21a';const fh=mh*pollen/5;rr(mx,my+mh-fh,mw,fh,UI(6));g.fill();g.strokeStyle='#8a5a10';g.lineWidth=2;rr(mx,my,mw,mh,UI(6));g.stroke();g.fillStyle='#8a5a10';g.fillRect(mx-2,my-UI(4),mw+4,UI(5));
 txt('x'+jars,mx+mw+UI(6),my+mh/2,UI(17),'#fff','left','rgba(0,0,0,.5)')}

// ===== shared one-button core =====
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=1,H=1,DPR=1;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const pick=a=>a[Math.random()*a.length|0];
const FONT="'Fredoka','Trebuchet MS',system-ui,sans-serif";
const UI=n=>n*cl(Math.min(W,H)/400,.82,1.6);
function fit(){DPR=Math.min(window.devicePixelRatio||1,3);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';if(G.resize)G.resize()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));

// ---- audio (generated in code) ----
let ac=null,muted=/[?&]mute=1/.test(location.search),nbuf=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,delay){if(muted||!ac)return;try{const t=ac.currentTime+(delay||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v||.08,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function hiss(d,v,f){if(muted||!ac)return;try{if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate*.6|0,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=ac.currentTime,s=ac.createBufferSource(),bp=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=nbuf;bp.type='bandpass';bp.frequency.value=f||1200;gn.gain.setValueAtTime(v||.1,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bp);bp.connect(gn);gn.connect(ac.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}
const coinSfx=()=>{tone(1320,.07,'square',.035);tone(1760,.12,'square',.03,0,.06)};

// ---- drawing helpers ----
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,size,col,align,stroke){g.font=`700 ${Math.round(size)}px ${FONT}`;g.textAlign=align||'center';g.textBaseline='middle';if(stroke){g.lineWidth=size*.2;g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function wrap(s,maxW,size){g.font=`700 ${Math.round(size)}px ${FONT}`;const out=[];let line='';for(const w of s.split(' ')){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fill()}
function coinIcon(x,y,r){circ(x,y,r,'#a8741a');circ(x,y,r*.82,'#f6c343');g.strokeStyle='#d9a12c';g.lineWidth=r*.14;g.beginPath();g.arc(x,y,r*.5,0,TAU);g.stroke();circ(x-r*.3,y-r*.3,r*.18,'#fff6c8')}
function heart(x,y,s,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s*.9,y-s*.2,x-s*.4,y-s*.85,x,y-s*.35);g.bezierCurveTo(x+s*.4,y-s*.85,x+s*.9,y-s*.2,x,y+s*.35);g.fill()}
function lockIcon(x,y,s){g.strokeStyle='#cfc6b8';g.lineWidth=s*.16;g.beginPath();g.arc(x,y-s*.15,s*.32,Math.PI,0);g.stroke();g.fillStyle='#cfc6b8';rr(x-s*.48,y-s*.15,s*.96,s*.72,s*.12);g.fill();circ(x,y+s*.15,s*.11,'#5b5348')}

// ---- fx ----
let parts=[],pops=[],shake=0;
function burst(x,y,n,col,sp,sz,grav,life){for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.25,1)*(sp||150);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:(life||.6)*R(.6,1.25),c:Array.isArray(col)?pick(col):col,s:(sz||4)*R(.6,1.3),gr:grav||0})}}
function pop(x,y,t,col,size,big){pops.push({x,y,t,c:col||'#fff',s:size||UI(22),l:0,big:!!big})}
function perfect(x,y){pop(x,y,'PERFECT!','#ffe866',UI(32),1);shake=Math.max(shake,UI(9));tone(990,.1,'triangle',.07);tone(1480,.22,'triangle',.06,0,.07)}
function fxShift(dx){for(const p of parts)p.x+=dx;for(const p of pops)p.x+=dx}
function updFx(dt){for(const p of parts){p.l+=dt;p.vx*=1-1.8*dt;p.vy*=1-1.8*dt;p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.l<p.m);for(const p of pops)p.l+=dt*.9;pops=pops.filter(p=>p.l<1);shake=Math.max(0,shake-dt*40)}
function drawFx(){for(const p of parts){g.globalAlpha=cl(1-p.l/p.m,0,1);circ(p.x,p.y,p.s*(1-.5*p.l/p.m),p.c)}g.globalAlpha=1;
 for(const p of pops){const k=p.l,sc=p.big?(k<.12?.4+k/.12:1.4-Math.min(.4,(k-.12)*2)):(k<.08?.6+k*5:1);g.globalAlpha=cl((1-k)*2.5,0,1);txt(p.t,cl(p.x,UI(60),W-UI(60)),p.y-k*UI(46),p.s*sc,p.c,'center','rgba(35,20,12,.85)')}g.globalAlpha=1}

// ---- mute toggle (only extra control) ----
function muteBox(){const s=Math.round(cl(Math.min(W,H)*.08,30,44));return{x:W-s-8,y:8,s}}
function drawMute(){const b=muteBox(),s=b.s;g.save();g.globalAlpha=.8;g.fillStyle='rgba(0,0,0,.35)';rr(b.x,b.y,s,s,s*.25);g.fill();g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=s*.07;g.lineCap='round';const x=b.x+s*.2,y=b.y+s*.5;g.beginPath();g.moveTo(x,y-s*.1);g.lineTo(x+s*.13,y-s*.1);g.lineTo(x+s*.3,y-s*.24);g.lineTo(x+s*.3,y+s*.24);g.lineTo(x+s*.13,y+s*.1);g.lineTo(x,y+s*.1);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+s*.42,y-s*.12);g.lineTo(x+s*.64,y+s*.12);g.moveTo(x+s*.64,y-s*.12);g.lineTo(x+s*.42,y+s*.12)}else{g.arc(x+s*.32,y,s*.14,-.9,.9);g.moveTo(x+s*.32+s*.26*Math.cos(-.9),y+s*.26*Math.sin(-.9));g.arc(x+s*.32,y,s*.26,-.9,.9)}g.stroke();g.restore()}

// ---- flow: ready -> play -> choose -> play -> end ----
let state='ready',runT=0,endT=0,coins=0,choice=null,upg=null,offered=false,held=false,endReason='time',best=0,newBest=false;
const grace=()=>runT<20;
try{best=+localStorage.getItem(G_KEY)||0}catch(e){}
function press(){
 if(state==='ready'){state='play';runT=0;G.start&&G.start();G.down();return}
 if(state==='play'){G.down();return}
 if(state==='choose'){if(choice.t<.6)return;const u=G.upgrades[choiceSel()];upg=u.id;state='play';tone(523,.1,'triangle',.07);tone(784,.1,'triangle',.07,0,.08);tone(1046,.25,'triangle',.07,0,.16);burst(W/2,H/2,40,['#ffe866','#fff','#ffb347'],UI(420),UI(5),0,.8);pop(W/2,H*.42,u.name+'!','#ffe866',UI(34),1);G.onUpgrade&&G.onUpgrade(upg);return}
 if(state==='end'&&endT>1.1)restart()}
function release(){if(state==='play')G.up&&G.up()}
function restart(){parts=[];pops=[];coins=0;upg=null;offered=false;choice=null;runT=0;endT=0;state='ready';G.reset()}
const choiceSel=()=>Math.floor(choice.t/.85)%2;
function offerUpgrade(){offered=true;state='choose';choice={t:0,last:-1};tone(660,.12,'triangle',.07);tone(880,.18,'triangle',.07,0,.1)}
function endRun(r){if(state!=='play')return;state='end';endT=0;endReason=r||'time';const sc=G.score();newBest=sc>best;if(newBest){best=sc;try{localStorage.setItem(G_KEY,best)}catch(e){}}tone(r==='time'?660:300,.2,'triangle',.08);tone(r==='time'?880:200,.4,'triangle',.08,0,.18)}

// ---- input: one button (pointer anywhere / Space) ----
function inMute(x,y){const b=muteBox();return x>=b.x-8&&y<=b.y+b.s+8}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();if(inMute(e.clientX,e.clientY)){muted=!muted;if(!muted)tone(660,.1,'triangle',.08);return}if(held)return;held=true;press()});
const rel=()=>{if(!held)return;held=false;release()};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);addEventListener('blur',rel);
addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();if(e.repeat||held)return;audioOn();held=true;press()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();rel()}});
['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));

// ---- shared screens ----
function drawHud(){const y=UI(24);coinIcon(UI(22),y,UI(11));txt(''+coins,UI(39),y+1,UI(22),'#fff','left','rgba(0,0,0,.55)');
 if(state!=='ready'){const left=Math.max(0,G.roundLen-runT),bw=Math.min(W*.3,UI(150)),bx=W/2-bw/2,bh=UI(10);g.fillStyle='rgba(0,0,0,.35)';rr(bx,y-bh/2,bw,bh,bh/2);g.fill();g.fillStyle=left<10?'#ff7a6a':'#fff3c4';rr(bx,y-bh/2,Math.max(bh,bw*left/G.roundLen),bh,bh/2);g.fill();txt(Math.ceil(left)+'s',bx+bw+UI(8),y+1,UI(15),'#fff','left','rgba(0,0,0,.5)')}
 if(G.lives!=null&&state!=='ready'){const y2=UI(52);if(grace())txt('Safe start '+Math.ceil(20-runT)+'s',UI(12),y2,UI(14),'#c8ffd0','left','rgba(0,0,0,.5)');else for(let i=0;i<G.maxLives;i++)heart(UI(20)+i*UI(24),y2,UI(18),i<G.lives?'#ff5a6e':'rgba(0,0,0,.3)')}
 if(upg){const u=G.upgrades.find(v=>v.id===upg);txt('✦ '+u.name,W/2,UI(46),UI(14),'#ffe866','center','rgba(0,0,0,.55)')}}
function drawHint(){const t=performance.now()/1000,y=G.hintY?G.hintY():H*.86;g.font=`700 100px ${FONT}`;const m=g.measureText(G.hint).width/100,s=Math.min(UI(24),W*.88/(m+1.4)),tw=(m+1.4)*s;g.globalAlpha=.8+.2*Math.sin(t*4);g.fillStyle='rgba(20,15,30,.62)';rr(W/2-tw/2,y-s*.95,tw,s*1.9,s*.95);g.fill();g.globalAlpha=1;txt(G.hint,W/2,y+1,s,'#fff')}
function drawChoice(){const t=choice.t,sel=choiceSel();if(sel!==choice.last){choice.last=sel;if(t>.05)tone(sel?620:520,.05,'square',.03)}
 g.fillStyle='rgba(10,14,30,.66)';g.fillRect(0,0,W,H);
 const portrait=W<H*1.05,q=Math.min(UI(1),H/(portrait?620:420),W/(portrait?380:680));let cw,ch,pos,ty;
 if(portrait){cw=Math.min(W*.88,330*q);ch=170*q;ty=H/2-ch-64*q;pos=[[W/2,H/2-ch/2+6*q],[W/2,H/2+ch/2+24*q]]}
 else{cw=Math.min(W*.42,300*q);ch=220*q;ty=H/2-ch/2-58*q;pos=[[W/2-cw/2-14*q,H/2+16*q],[W/2+cw/2+14*q,H/2+16*q]]}
 txt('Choose an upgrade',W/2,ty,30*q,'#fff','center','rgba(0,0,0,.5)');txt(t<.6?'get ready...':'Tap when your card glows',W/2,ty+30*q,17*q,'#ffe9a8');
 G.upgrades.forEach((u,i)=>{const on=i===sel&&t>.15,[cx,cy]=pos[i],sc=on?1.05:.94;g.save();g.translate(cx,cy);g.scale(sc,sc);
  if(on){g.shadowColor='#ffe866';g.shadowBlur=24*q}g.fillStyle=on?'#fff7e6':'#a9a39a';rr(-cw/2,-ch/2,cw,ch,16*q);g.fill();g.shadowBlur=0;
  g.lineWidth=4*q;g.strokeStyle=on?'#ffb52e':'#6d675f';g.stroke();
  if(portrait){const ic=ch*.6;G.drawIcon(u.id,-cw/2+ic*.62,0,ic);const tx=-cw/2+ic*1.22,tw=cw/2-tx-12*q;txt(u.name,tx,-ch*.3,21*q,'#3a2a1a','left');const ls=wrap(u.desc,tw,14*q);ls.slice(0,5).forEach((l,j)=>txt(l,tx,-ch*.1+j*17*q,14*q,'#5a4a38','left'))}
  else{const ic=ch*.36;G.drawIcon(u.id,0,-ch*.25,ic);txt(u.name,0,ch*.03,22*q,'#3a2a1a');const ls=wrap(u.desc,cw-26*q,14*q);ls.slice(0,4).forEach((l,j)=>txt(l,0,ch*.17+j*17*q,14*q,'#5a4a38'))}
  if(on&&t>.6){const f=(t%.85)/.85;g.fillStyle='#ffb52e';rr(-cw/2+14*q,ch/2-12*q,(cw-28*q)*(1-f),5*q,2.5*q);g.fill()}
  g.restore()})}
function drawEnd(){g.fillStyle='rgba(8,12,24,.68)';g.fillRect(0,0,W,H);const q=Math.min(UI(1),H*.95/400,W*.95/380),pw=Math.min(W*.94,440*q),ph=400*q,px=W/2-pw/2,py=H/2-ph/2;
 g.fillStyle='#fff7e6';rr(px,py,pw,ph,20*q);g.fill();g.lineWidth=4*q;g.strokeStyle='#ffb52e';g.stroke();
 txt(G.endTitle(endReason),W/2,py+38*q,30*q,'#3a2a1a');
 const ls=G.endLines();ls.forEach((l,i)=>txt(l,W/2,py+84*q+i*27*q,19*q,'#5a4a38'));
 txt(newBest?'New best: '+best+'!':'Best: '+best,W/2,py+84*q+ls.length*27*q+4*q,16*q,newBest?'#e0761a':'#8a7a66');
 txt('Coming next',W/2,py+232*q,15*q,'#8a7a66');const bw=(pw-48*q)/3;
 G.locked.forEach((n,i)=>{const bx=px+16*q+i*(bw+8*q),by=py+246*q;g.fillStyle='#4b443c';rr(bx,by,bw,84*q,12*q);g.fill();lockIcon(bx+bw/2,by+28*q,26*q);const nl=wrap(n,bw-8*q,13*q);nl.forEach((l,j)=>txt(l,bx+bw/2,by+60*q+j*14*q-(nl.length-1)*7*q,13*q,'#f1e7d6'))});
 if(endT>1.1){g.globalAlpha=.6+.4*Math.sin(endT*5);txt('Tap to play again',W/2,py+ph-30*q,22*q,'#e0761a');g.globalAlpha=1}}

// ---- main loop (delta time) ----
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(state==='play'){runT+=dt;G.update(dt);if(state==='play'&&runT>=G.roundLen)endRun('time');
  if(state==='play'&&!offered&&runT>12&&(coins>=G.upCoins||runT>=30)&&(!G.safe||G.safe()||runT>38))offerUpgrade()}
 else if(state==='choose')choice.t+=dt;
 else if(G.idle)G.idle(dt);
 if(state==='end')endT+=dt;
 updFx(dt);
 g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);g.save();if(shake>.2)g.translate(R(-shake,shake),R(-shake,shake));G.draw();drawFx();g.restore();
 drawHud();if(state==='ready')drawHint();if(state==='choose')drawChoice();if(state==='end')drawEnd();drawMute();
 requestAnimationFrame(frame)}
function boot(){fit();G.reset();requestAnimationFrame(t=>{last=t;frame(t)})}

boot();
})();
</script>
