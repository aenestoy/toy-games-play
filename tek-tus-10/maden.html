<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deep Shaft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#20160f;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
// ---------- core ----------
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=1,H=1,u=1,TS=14,DPR=1;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,PI=Math.PI;
const FONT='Rubik,system-ui,sans-serif';
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function fit(){DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';u=Math.min(W/9,H/14);TS=Math.max(13,u*.42);layout()}
let best=0;try{best=+localStorage.getItem('deepShaftBest')||0}catch(e){}

// ---------- audio ----------
let ac=null,nbuf=null,muted=/[?&]mute=1/.test(location.search);
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t0=ac.currentTime+(dl||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);gn.gain.setValueAtTime(v||.08,t0);gn.gain.exponentialRampToValueAtTime(.0008,t0+d);o.connect(gn);gn.connect(ac.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
function noise(d,v,fr){if(muted||!ac)return;try{if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain(),t0=ac.currentTime;s.buffer=nbuf;f.type='bandpass';f.frequency.value=fr||1000;gn.gain.setValueAtTime(v||.1,t0);gn.gain.exponentialRampToValueAtTime(.0008,t0+d);s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(t0);s.stop(t0+d+.02)}catch(e){}}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,size,col,al,w,ol){g.font=(w||500)+' '+size+'px '+FONT;g.textAlign=al||'center';g.textBaseline='middle';if(ol){g.lineWidth=size*.2;g.lineJoin='round';g.strokeStyle='rgba(10,6,4,.85)';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function wrap(s,x,y,maxw,size,col,lh){g.font='500 '+size+'px '+FONT;const ws=s.split(' '),ls=[];let l='';for(const w of ws){const t=l?l+' '+w:w;if(g.measureText(t).width>maxw&&l){ls.push(l);l=w}else l=t}ls.push(l);ls.forEach((q,i)=>txt(q,x,y+i*size*(lh||1.25),size,col,'center',500));return ls.length}
function coin(x,y,r){g.fillStyle='#c98a1a';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#ffd34d';g.beginPath();g.arc(x,y-r*.08,r*.8,0,7);g.fill();g.fillStyle='#c98a1a';g.fillRect(x-r*.3,y-r*.3,r*.6,r*.5)}
function helmet(x,y,s,on){g.fillStyle=on?'#f2b632':'rgba(255,255,255,.18)';g.beginPath();g.arc(x,y,s*.5,PI,0);g.fill();g.fillRect(x-s*.62,y-1,s*1.24,s*.14);if(on){g.fillStyle='#fff7c0';g.beginPath();g.arc(x,y-s*.25,s*.12,0,7);g.fill()}}
function lock(x,y,s){g.strokeStyle='#c8c2bb';g.lineWidth=s*.16;g.beginPath();g.arc(x,y-s*.15,s*.3,PI,0);g.stroke();g.fillStyle='#c8c2bb';rr(x-s*.45,y-s*.15,s*.9,s*.7,s*.12);g.fill();g.fillStyle='#2b2420';g.beginPath();g.arc(x,y+s*.15,s*.1,0,7);g.fill()}

// ---------- fx ----------
const P=[],T=[];let shake=0,flash=0;
function burst(x,y,n,col,sp,life,grav,size,dir){for(let i=0;i<n;i++){const a=dir!==undefined?dir+R(-.7,.7):R(0,6.283),s=R(.25,1)*sp;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*R(.6,1),m:life,c:Array.isArray(col)?col[i%col.length]:col,g:grav||0,s:size*R(.6,1.2)})}}
function pop(t,x,y,c,s){T.push({t,x,y,c:c||'#fff',s:s||1,l:1})}
function updFx(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=dt;if(p.l<=0){P.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}for(let i=T.length-1;i>=0;i--){const q=T[i];q.l-=dt*.85;q.y-=u*.7*dt;if(q.l<=0)T.splice(i,1)}shake=Math.max(0,shake-dt*2.5);flash=Math.max(0,flash-dt*3)}
function drawFx(){for(const p of P){g.globalAlpha=cl(p.l/p.m,0,1);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}g.globalAlpha=1;for(const q of T){const k=1-q.l,sc=k<.12?.5+k/.12*.75:1.25-Math.min(.25,(k-.12)*.6);g.globalAlpha=cl(q.l*2.2,0,1);txt(q.t,q.x,q.y,TS*1.35*q.s*sc,q.c,'center',700,true)}g.globalAlpha=1}

// ---------- game state ----------
const ROUND=80,LOCKED=['Crystal Layer','Ore Cart Rail','Lava Depth'];
const ORE=[{n:'Copper',c:'#d9824a',hi:'#ffb07a',v:3},{n:'Silver',c:'#b9cfdc',hi:'#f2fbff',v:5},{n:'Gold',c:'#f5c637',hi:'#fff2a8',v:8}];
const LAYERS=['#6e4c34','#5c5249','#474a5c','#3d3150','#5c2f2b'];
const CARDS=[
 {id:'wide',name:'Wide Drill',col:'#38b6c9',desc:'The thin drill line becomes a wide band. Every vein inside it is mined at once, so one stop can hit two.',icon:(x,y,s)=>{g.fillStyle='rgba(56,182,201,.35)';g.fillRect(x-s*1.4,y-s*.5,s*2.8,s);g.fillStyle='#d9824a';g.fillRect(x-s*1.4,y-s*.35,s*2.8,s*.2);g.fillStyle='#f5c637';g.fillRect(x-s*1.4,y+s*.18,s*2.8,s*.2);g.strokeStyle='#38b6c9';g.lineWidth=3;g.strokeRect(x-s*1.4,y-s*.5,s*2.8,s)}},
 {id:'dyn',name:'Dynamite',col:'#e0533a',desc:'Every other tap drops a charge and you keep moving. It blasts the next vein below open: double ore and easy to hit.',icon:(x,y,s)=>{g.save();g.translate(x,y);g.rotate(-.4);g.fillStyle='#c8322a';rr(-s*.3,-s*.8,s*.6,s*1.6,s*.15);g.fill();g.fillStyle='#f2e6d0';g.fillRect(-s*.3,-s*.2,s*.6,s*.25);g.strokeStyle='#5a4030';g.lineWidth=3;g.beginPath();g.moveTo(0,-s*.8);g.quadraticCurveTo(s*.3,-s*1.2,s*.5,-s*1.1);g.stroke();g.fillStyle='#ffd34d';g.beginPath();g.arc(s*.55,-s*1.1,s*.18,0,7);g.fill();g.restore()}}
];
let st='ready',clock=0,runT=0,coins=0,helmets=3,upg=null,choiceT=0,endT=0,perfects=0,drills=0,newBest=false;
let depth=0,v=0,mode='move',drillT=0,drillDur=.5,veins=[],gas=[],nextD=3,charge=null,dynReady=true,stun=0,maxCombo=0,streak=0;
let cageY,SW;
function layout(){cageY=H*.42;SW=Math.min(3*u,W*.34)}
const sy=d=>cageY+(d-depth)*u;
const vTarget=()=>2.3+Math.min(2.8,runT*.035);
function gen(){
 while(nextD<depth+H/u+3){
  const deep=nextD/40,r=Math.random(),tier=r<.18+deep*.15?2:r<.5+deep*.1?1:0;
  veins.push({d:nextD,th:R(.32,.55),tier,done:false,blast:false,ph:R(0,6)});
  const gap=R(1.9,3.4);
  if(runT>14&&Math.random()<.45+Math.min(.25,runT*.003)){const h=Math.min(gap-1.1,R(.9,1.5));if(h>.6)gas.push({d:nextD+gap/2,h,ph:R(0,6)})}
  nextD+=gap;
 }
 veins=veins.filter(q=>q.d>depth-cageY/u-2);gas=gas.filter(q=>q.d>depth-cageY/u-2);
}
function reset(){st='play';runT=0;coins=0;helmets=3;upg=null;perfects=0;drills=0;depth=0;v=0;mode='move';veins=[];gas=[];nextD=3;charge=null;dynReady=true;stun=0;streak=0;maxCombo=0;P.length=T.length=0;gen()}

const tol=q=>{const half=q.th/2;if(upg==='wide')return{good:half+.85,perf:.32};return q.blast?{good:half+.6,perf:.3}:{good:half+.12,perf:.13}};
function glowOf(q){if(q.done)return 0;const off=Math.abs(q.d-depth),t=tol(q);return off<t.perf?1:off<t.good?.55:0}

function startDrill(){
 mode='drill';drillT=0;v=0;drills++;
 const inGas=gas.find(q=>Math.abs(q.d-depth)<q.h/2);
 if(inGas&&runT>20){helmets--;mode='stun';stun=1;shake=1.4;flash=1;streak=0;pop('GAS BLAST!',W/2,cageY-u*2,'#9dff6a',1.3);noise(.7,.3,150);tone(80,.6,'sawtooth',.12,30);burst(W/2,cageY,40,['#9dff6a','#ffd34d','#e0533a','#444'],u*8,1,u*3,u*.25);gas.splice(gas.indexOf(inGas),1);return}
 const cand=veins.filter(q=>!q.done&&Math.abs(q.d-depth)<tol(q).good);
 let hits=cand;if(upg!=='wide'&&cand.length>1){cand.sort((a,b)=>Math.abs(a.d-depth)-Math.abs(b.d-depth));hits=[cand[0]]}
 noise(.45,.08,900);tone(140,.4,'square',.03,190);
 if(!hits.length){streak=0;pop('Rubble',W/2,cageY-u*1.6,'#c9b8a8',.9);burst(W/2-SW/2,cageY,10,['#7a6a5a','#4a3a2a'],u*3,.6,u*8,u*.18,PI);burst(W/2+SW/2,cageY,10,['#7a6a5a','#4a3a2a'],u*3,.6,u*8,u*.18,0);if(inGas)pop('Gas! Avoid it after 0:20',W/2,cageY+u*1.6,'#9dff6a',.7);return}
 let total=0,anyPerf=false;
 for(const q of hits){const perf=Math.abs(q.d-depth)<tol(q).perf;let val=ORE[q.tier].v*(perf?2:1)*(q.blast?2:1);total+=val;q.done=true;if(perf)anyPerf=true;
  const y=sy(q.d);burst(W/2-SW/2,y,16,[ORE[q.tier].c,ORE[q.tier].hi],u*4,.8,u*7,u*.2,PI);burst(W/2+SW/2,y,16,[ORE[q.tier].c,ORE[q.tier].hi],u*4,.8,u*7,u*.2,0)}
 coins+=total;
 if(anyPerf){perfects++;streak++;maxCombo=Math.max(maxCombo,streak);shake=.6;pop('PERFECT',W/2,cageY-u*2.3,'#fff2a8',1.2);tone(988,.1,'square',.05,0,.05);tone(1480,.18,'triangle',.06,0,.13)}else{streak=0;tone(660,.12,'triangle',.06,0,.05)}
 pop('+'+total+(hits.length>1?'  x'+hits.length+' veins':''),W/2,cageY-u*1.4,ORE[hits[0].tier].hi,1);
 if(upg==='dyn')dynReady=true;
}
function throwCharge(){dynReady=false;charge={d:depth,vd:v+5};tone(500,.12,'triangle',.05,300);noise(.1,.05,3000)}
function blast(at){
 charge=null;const tgt=veins.find(q=>!q.done&&!q.blast&&q.d>at-1&&q.d<at+1);
 shake=.7;noise(.5,.25,200);tone(70,.4,'sawtooth',.1,35);
 const y=sy(at);burst(W/2,y,30,['#ffd34d','#e0533a','#fff','#6b5040'],u*7,.8,u*4,u*.22);
 if(tgt){tgt.blast=true;pop('Blasted! x2',W/2+SW,y,'#ffb07a',.9)}
 gas=gas.filter(q=>Math.abs(q.d-at)>2.2);
}
function endGame(){st='end';endT=0;if(coins>best){best=coins;newBest=true;try{localStorage.setItem('deepShaftBest',best)}catch(e){}}else newBest=false;tone(330,.25,'triangle',.07);tone(247,.4,'triangle',.07,0,.2)}

// ---------- input ----------
let held=false;
const MB=()=>({x:W-50,y:8,w:42,h:42});
function onDown(){
 if(st==='ready'){reset();tone(220,.2,'square',.04,330);return}
 if(st==='choice'){if(choiceT<.6)return;const c=CARDS[Math.floor(choiceT/.85)%2];upg=c.id;st='play';pop(c.name+'!',W/2,H*.62,c.col,1.3);tone(523,.1,'square',.05);tone(784,.2,'square',.05,0,.08);shake=.3;return}
 if(st==='end'){if(endT>1)reset();return}
 if(mode!=='move')return;
 if(upg==='dyn'&&dynReady&&!charge){throwCharge();return}
 startDrill();
}
function press(x,y){if(x!==undefined){const b=MB();if(x>=b.x-8&&x<=b.x+b.w+8&&y>=b.y-8&&y<=b.y+b.h+8){muted=!muted;audio();if(!muted)tone(660,.08,'triangle',.08);return}}audio();if(held)return;held=true;onDown()}
function lift(){held=false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();press(e.clientX,e.clientY)});
addEventListener('pointerup',lift);addEventListener('pointercancel',lift);addEventListener('blur',lift);
addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();if(!e.repeat)press()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();lift()}});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('contextmenu',e=>e.preventDefault());

// ---------- update ----------
function update(dt){
 clock+=dt;updFx(dt);
 if(st==='choice'){choiceT+=dt;return}
 if(st==='end'){endT+=dt;return}
 if(st==='ready')return;
 runT+=dt;
 if(mode==='move'){v=Math.min(vTarget(),v+7*dt)}
 else if(mode==='drill'){drillT+=dt;if(Math.random()<.6){const s=Math.random()<.5?-1:1;burst(W/2+s*(SW/2+u*1.2),cageY,1,['#ffd34d','#fff'],u*3,.3,u*5,u*.1,s<0?PI:0)}if(drillT>=drillDur)mode='move'}
 else if(mode==='stun'){stun-=dt;if(stun<=0)mode='move'}
 depth+=v*dt;
 if(charge){charge.vd+=12*dt;charge.d+=charge.vd*dt;const nv=veins.find(q=>!q.done&&!q.blast&&q.d>depth+.4&&q.d<=charge.d);if(nv)blast(nv.d);else if(charge.d>depth+7)blast(charge.d)}
 gen();
 if(helmets<=0||(runT>=ROUND&&mode==='move'))endGame();
 else if(!upg&&mode==='move'&&(coins>=60||runT>=30)){st='choice';choiceT=0;tone(740,.1,'triangle',.06);tone(988,.15,'triangle',.06,0,.1)}
}

// ---------- render ----------
function drawRock(){
 const d0=depth-cageY/u-1,d1=depth+(H-cageY)/u+1;
 for(let k=Math.floor(d0/14);k<=Math.floor(d1/14);k++){const y0=sy(k*14),y1=sy((k+1)*14);g.fillStyle=LAYERS[((k%5)+5)%5];g.fillRect(0,y0,W,y1-y0+1)}
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(0,0,0,.35)');gr.addColorStop(.4,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(0,0,0,.22)';
 for(let i=Math.floor(d0/.7);i<=d1/.7;i++){const y=sy(i*.7);for(let j=0;j<3;j++){const h=hash(i*3+j),x=h*W,s=u*(.08+hash(i*7+j)*.2);if(Math.abs(x-W/2)<SW/2)continue;g.beginPath();g.ellipse(x,y,s*1.6,s,0,0,7);g.fill()}}
 g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=2;for(let i=Math.floor(d0/2.3);i<=d1/2.3;i++){const y=sy(i*2.3+hash(i)*.6);g.beginPath();g.moveTo(0,y);for(let x=0;x<=W;x+=W/8)g.lineTo(x,y+Math.sin(x*.02+i)*u*.15);g.stroke()}
}
function drawGas(){for(const q of gas){const y=sy(q.d),h=q.h*u,a=.32+.08*Math.sin(clock*3+q.ph),danger=runT>20;
 g.fillStyle=`rgba(120,230,80,${a})`;g.fillRect(0,y-h/2,W,h);
 g.fillStyle=`rgba(170,255,120,${a*.9})`;for(let i=0;i<9;i++){const x=W*(i+.5)/9+Math.sin(clock*1.5+i+q.ph)*u*.3;g.beginPath();g.arc(x,y+Math.cos(clock*2+i)*h*.2,h*.42,0,7);g.fill()}
 txt(danger?'GAS - DON\'T STOP':'GAS',W/2+SW/2+u*1.6,y,TS*.75,'#e9ffd8','center',700,true)}}
function drawVeins(){for(const q of veins){const y=sy(q.d),h=q.th*u,o=ORE[q.tier];if(y<-u||y>H+u)continue;const gl=st==='play'&&mode==='move'?glowOf(q):0;
 g.fillStyle=q.done?'#1a120c':o.c;g.beginPath();g.moveTo(0,y-h/2);for(let x=0;x<=W;x+=W/12)g.lineTo(x,y-h/2+Math.sin(x*.03+q.ph)*u*.08);for(let x=W;x>=0;x-=W/12)g.lineTo(x,y+h/2+Math.sin(x*.025+q.ph+2)*u*.08);g.closePath();g.fill();
 if(!q.done){g.fillStyle=o.hi;for(let i=0;i<10;i++){const x=hash(q.ph*100+i)*W;if(Math.abs(x-W/2)<SW/2)continue;const tw=.5+.5*Math.sin(clock*4+i+q.ph);g.globalAlpha=.5+tw*.5;g.fillRect(x-u*.07,y-u*.07,u*.14,u*.14)}g.globalAlpha=1}
 if(q.blast&&!q.done){g.strokeStyle='#ffb07a';g.lineWidth=3;g.strokeRect(-2,y-h/2-u*.6,W+4,h+u*1.2);txt('x2',W/2-SW/2-u*.9,y,TS*.95,'#ffb07a','center',700,true)}
 if(gl>0){g.globalAlpha=gl*.6;g.fillStyle='#fff';g.fillRect(0,y-h/2-2,W,h+4);g.globalAlpha=1}}}
function drawShaft(){
 const x0=W/2-SW/2;g.fillStyle='rgba(12,8,6,.82)';g.fillRect(x0,0,SW,H);
 g.fillStyle='#5a3c22';const d0=depth-cageY/u-2;for(let i=Math.floor(d0/2);i<d0+H/u+4;i+=1){const y=sy(i*2);g.fillRect(x0-u*.12,y,SW+u*.24,u*.22)}
 g.fillStyle='#3a2a1a';g.fillRect(x0,0,u*.16,H);g.fillRect(x0+SW-u*.16,0,u*.16,H);
}
function drawCage(){
 const cw=Math.min(SW-u*.5,u*2.2),top=cageY-u*1.35,bh=u*1.8,x=W/2-cw/2,jig=mode==='drill'?R(-1,1)*u*.03:0;
 g.strokeStyle='#bfb6a0';g.lineWidth=Math.max(2,u*.06);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,top);g.stroke();
 // drill line / band
 if(st!=='end'){if(upg==='wide'){g.fillStyle='rgba(56,182,201,.18)';g.fillRect(0,cageY-.85*u,W,1.7*u);g.strokeStyle='rgba(56,182,201,.7)';g.lineWidth=2;g.strokeRect(-2,cageY-.85*u,W+4,1.7*u)}
  g.strokeStyle='rgba(120,240,255,.85)';g.lineWidth=2;g.setLineDash([u*.3,u*.2]);g.lineDashOffset=-clock*u*2;g.beginPath();g.moveTo(0,cageY);g.lineTo(W,cageY);g.stroke();g.setLineDash([])}
 g.save();g.translate(jig,0);
 g.fillStyle='#2e2a28';g.fillRect(x,top,cw,bh);g.strokeStyle='#8a7f72';g.lineWidth=Math.max(2,u*.08);g.strokeRect(x,top,cw,bh);
 for(let i=1;i<4;i++){g.beginPath();g.moveTo(x+cw*i/4,top);g.lineTo(x+cw*i/4,top+bh);g.stroke()}
 // miner
 g.fillStyle='#f2b632';g.beginPath();g.arc(W/2,top+bh*.42,u*.32,PI,0);g.fill();g.fillStyle='#e8c4a0';g.beginPath();g.arc(W/2,top+bh*.5,u*.24,0,7);g.fill();g.fillStyle='#fff7c0';g.beginPath();g.arc(W/2,top+bh*.3,u*.08,0,7);g.fill();
 // drills
 const ext=mode==='drill'?Math.min(1,drillT/.12)*(1-Math.max(0,(drillT-drillDur+.12)/.12)):0,len=u*.5+ext*u*1.3;
 for(const s of[-1,1]){const bx=W/2+s*cw/2;g.fillStyle='#6c6a70';g.fillRect(s<0?bx-len:bx,cageY-u*.12,len,u*.24);g.fillStyle='#d8d4cc';g.beginPath();g.moveTo(bx+s*len,cageY-u*.2);g.lineTo(bx+s*(len+u*.45),cageY);g.lineTo(bx+s*len,cageY+u*.2);g.closePath();g.fill();
  if(ext>0){g.strokeStyle='#4a4850';g.lineWidth=2;for(let k=0;k<4;k++){const xx=bx+s*(len-u*.4+((clock*30+k*.25)%1)*u*.4);g.beginPath();g.moveTo(xx,cageY-u*.12);g.lineTo(xx+s*u*.1,cageY+u*.12);g.stroke()}}}
 g.restore();
 if(charge){const y=sy(charge.d);g.fillStyle='#c8322a';rr(W/2-u*.12,y-u*.35,u*.24,u*.7,u*.06);g.fill();g.fillStyle='#ffd34d';g.beginPath();g.arc(W/2,y-u*.45,u*.1+Math.random()*u*.05,0,7);g.fill()}
}
function drawHUD(){
 const y0=14+TS*.9;coin(14+TS*.6,y0,TS*.6);txt(''+coins,14+TS*1.5,y0,TS*1.3,'#fff','left',700,true);
 for(let i=0;i<3;i++)helmet(14+TS*.6+i*TS*1.4,y0+TS*1.7,TS*.9,i<helmets);
 if(upg==='wide')txt('Wide Drill',14,y0+TS*3,TS*.85,'#7fe0ef','left',700,true);
 if(upg==='dyn')txt(dynReady&&!charge?'Next tap: DYNAMITE':'Next tap: drill',14,y0+TS*3,TS*.85,dynReady&&!charge?'#ff9a7a':'#fff','left',700,true);
 if(st==='play'||st==='choice'){const f=cl(1-runT/ROUND,0,1);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,0,W,6);g.fillStyle=f<.2?'#ff7a5a':'#9fe8ff';g.fillRect(0,0,W*f,6);
  const s=Math.max(0,Math.ceil(ROUND-runT));txt(Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'   '+Math.floor(depth*2)+' m',W/2,TS*1.3,TS*.95,'#fff','center',600,true);
  if(runT<20)txt('Safe zone: no gas yet',W/2,TS*2.5,TS*.75,'rgba(255,255,255,.75)','center',500,true);
  if(st==='play'&&drills<3)txt('Tap when a vein lights up',W/2,cageY+u*1.6,TS*1.05,'#fff2a8','center',700,true)}
}
function choiceLayout(){const port=W<H*.95;if(port){const cw=Math.min(W*.86,400),ch=Math.min(H*.29,230);return[[W/2-cw/2,H*.53-ch-8,cw,ch],[W/2-cw/2,H*.53+8,cw,ch]]}const cw=Math.min(W*.38,380),ch=Math.min(H*.62,260);return[[W/2-cw-10,H*.54-ch/2,cw,ch],[W/2+10,H*.54-ch/2,cw,ch]]}
function drawChoice(){
 g.fillStyle='rgba(5,3,2,.66)';g.fillRect(0,0,W,H);
 const L=choiceLayout(),sel=Math.floor(choiceT/.85)%2,ph=(choiceT%.85)/.85;
 txt('Pick an upgrade',W/2,Math.max(L[0][1]-TS*1.8,TS*1.6),TS*1.5,'#fff','center',700,true);
 for(let i=0;i<2;i++){const[x,y,w,h]=L[i],c=CARDS[i],on=i===sel,s=on?1.03+Math.sin(clock*9)*.01:.95;
  g.save();g.translate(x+w/2,y+h/2);g.scale(s,s);g.translate(-w/2,-h/2);
  if(on){g.globalAlpha=.4;g.fillStyle=c.col;rr(-9,-9,w+18,h+18,20);g.fill();g.globalAlpha=1}
  g.fillStyle=on?'#2b2724':'#1c1917';rr(0,0,w,h,14);g.fill();g.lineWidth=on?5:2;g.strokeStyle=on?c.col:'rgba(255,255,255,.15)';g.stroke();
  const ic=Math.min(h*.13,w*.1);c.icon(w/2,h*.2,ic);
  txt(c.name,w/2,h*.4,TS*1.25,on?c.col:'#8a817a','center',700);
  wrap(c.desc,w/2,h*.56,w*.86,TS*.8,on?'#ece4dc':'#8a817a',1.25);
  if(on){g.fillStyle=c.col;g.fillRect(16,h-10,(w-32)*ph,4)}
  g.restore()}
 const by=L[1][1]+L[1][3]+TS*1.6;txt('Tap while your pick is glowing',W/2,Math.min(H-TS,by),TS*.95,'#fff2a8','center',600,true);
}
function drawEnd(){
 g.fillStyle='rgba(5,3,2,.72)';g.fillRect(0,0,W,H);
 const pw=Math.min(W*.92,TS*27),ph=TS*19.8,x=(W-pw)/2,y=Math.max(8,(H-ph)/2);
 g.fillStyle='#2b2724';rr(x,y,pw,ph,16);g.fill();g.strokeStyle='#f2b632';g.lineWidth=4;g.stroke();
 txt(helmets<=0?'Shaft sealed!':'Shift over!',W/2,y+TS*1.9,TS*1.5,'#f2b632','center',700);
 const rows=[['Ore value',coins+(newBest?'  NEW BEST':'')],['Depth reached',Math.floor(depth*2)+' m'],['Perfect drills',perfects],['Best streak',maxCombo]];
 rows.forEach((r,i)=>{const ry=y+TS*(4+i*1.55);txt(r[0],x+TS*1.2,ry,TS*.95,'#a89e95','left',500);txt(''+r[1],x+pw-TS*1.2,ry,TS*1.05,'#fff','right',700)});
 txt('Deeper down',W/2,y+TS*10.6,TS*.9,'#a89e95','center',600);
 const bw=(pw-TS*2.4-TS)/3,bh=TS*4.6;
 for(let i=0;i<3;i++){const bx=x+TS*1.2+i*(bw+TS*.5),byy=y+TS*11.5;g.fillStyle='#45403b';rr(bx,byy,bw,bh,10);g.fill();lock(bx+bw/2,byy+bh*.33,TS*1.4);wrap(LOCKED[i],bx+bw/2,byy+bh*.72,bw*.9,TS*.78,'#e4dcd3',1.15)}
 if(endT>1)txt('Tap to play again',W/2,y+TS*18.2,TS*1.2*(1+Math.sin(clock*5)*.04),'#f2b632','center',700);
}
function drawMute(){const b=MB();g.save();g.globalAlpha=.8;g.fillStyle='rgba(0,0,0,.35)';rr(b.x,b.y,b.w,b.h,10);g.fill();g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=2.5;const cx=b.x+14,cy=b.y+21;g.beginPath();g.moveTo(cx-7,cy-5);g.lineTo(cx-2,cy-5);g.lineTo(cx+5,cy-11);g.lineTo(cx+5,cy+11);g.lineTo(cx-2,cy+5);g.lineTo(cx-7,cy+5);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(cx+10,cy-6);g.lineTo(cx+20,cy+6);g.moveTo(cx+20,cy-6);g.lineTo(cx+10,cy+6)}else{g.arc(cx+6,cy,7,-.9,.9);g.moveTo(cx+6+12*Math.cos(-.9),cy+12*Math.sin(-.9));g.arc(cx+6,cy,12,-.9,.9)}g.stroke();g.restore()}
function render(){
 g.setTransform(DPR,0,0,DPR,0,0);
 if(shake>0){const s=shake*u*.18;g.translate(R(-s,s),R(-s,s))}
 drawRock();drawVeins();drawGas();drawShaft();drawCage();drawFx();
 if(flash>0){g.fillStyle=`rgba(200,255,150,${flash*.5})`;g.fillRect(-20,-20,W+40,H+40)}
 g.setTransform(DPR,0,0,DPR,0,0);
 drawHUD();
 if(st==='ready'){const p=1+Math.sin(clock*5)*.05;txt('Tap',W/2,cageY+u*2,TS*2.4*p,'#fff','center',700,true);txt('to descend. Tap again to stop and drill',W/2,cageY+u*2.9,TS*.9,'#fff2a8','center',600,true);txt('when a vein lines up with the blue line',W/2,cageY+u*2.9+TS*1.2,TS*.9,'#fff2a8','center',600,true)}
 if(st==='choice')drawChoice();
 if(st==='end')drawEnd();
 drawMute();
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(frame)}
addEventListener("resize",fit);fit();gen();requestAnimationFrame(frame);
})();
</script>
