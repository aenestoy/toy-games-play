</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const G_KEY='tt10_balikci_best';
// ===== Lake Line =====
const FISH=[
 {n:'Minnow',b:0,v:1,l:26,c:'#c3d3da',k:'#eef4f6',w:5},
 {n:'Reed Perch',b:0,v:2,l:34,c:'#8fb04a',k:'#e8e7a0',w:3,st:1},
 {n:'Sunfin',b:1,v:3,l:38,c:'#f0a33a',k:'#ffe2a0',w:4},
 {n:'Blue Darter',b:1,v:4,l:44,c:'#4e8fd8',k:'#bfe0ff',w:3},
 {n:'Bronze Carp',b:2,v:6,l:58,c:'#b5813e',k:'#ecc98d',w:4},
 {n:'Glass Trout',b:2,v:8,l:52,c:'#7fd0c8',k:'#e3fffb',w:2,st:1},
 {n:'Old Whisker',b:3,v:12,l:74,c:'#6b5a4a',k:'#b8a48c',w:3,wh:1},
 {n:'Moon Koi',b:3,v:25,l:60,c:'#fff1d6',k:'#ffffff',w:1,sp:1}];
const BANDS=['Shallows','Reeds','Deep','Abyss'],BCOL=['#3f9fc0','#2f7fa6','#22597f','#163756'];
let k=1,surfY=0,botY=0,bandH=0,lx=0,T=0,fish=[],lure,cap=1,album,caught=0,ring=[],flyers=[];
const G={hint:'Hold to sink, let go to reel up',roundLen:75,upCoins:12,maxLives:3,lives:3,locked:['River','Night Fishing','Aquarium'],
 upgrades:[{id:'glow',name:'Glow Lure',desc:'Fish near the lure turn and swim toward it.'},{id:'double',name:'Double Hook',desc:'Carry two fish. Tap while reeling up to snap the hook onto the nearest fish.'}],
 resize(){k=Math.min(W/420,H/540);surfY=Math.max(H*.22,UI(100));botY=H-14*k;bandH=(botY-surfY-20*k)/4;lx=W*.56;if(lure&&lure.mode==='idle')lure.y=surfY+6*k},
 reset(){fish=[];flyers=[];cap=1;caught=0;album=FISH.map(()=>false);this.lives=3;lure={y:surfY+6*k,mode:'idle',hooked:[],snap:false,upT:0,streak:0};for(let i=0;i<10;i++)spawn(true)},
 hintY:()=>surfY+bandH*.9,
 down(){if(G.dbl&&lure.mode==='up'&&!lure.snap&&lure.hooked.length<cap){let bst=null,bd=150*k;for(const f of fish){if(f.hk||f.t==='eel')continue;const d=Math.hypot(f.x-lx,f.y-lure.y);if(d<bd){bd=d;bst=f}}if(bst){lure.snap=true;const oy=lure.y;lure.y=bst.y;hook(bst,true);for(let i=0;i<8;i++)parts.push({x:lx+R(-3,3),y:lerp(oy,bst.y,i/8),vx:0,vy:0,l:0,m:.35,c:'#fff8c0',s:3*k,gr:0});tone(1200,.08,'square',.04,600);return}}
  if(lure.mode!=='down'){lure.mode='down';tone(300,.12,'sine',.05,180)}},
 up(){if(lure.mode==='down'){lure.mode='up';lure.snap=false;lure.upT=0;tone(500,.1,'sine',.04,800)}},
 safe:()=>lure.mode!=='down',
 onUpgrade(id){if(id==='double'){cap=2;G.dbl=1}else G.dbl=0;if(id==='glow')G.glow=1;else G.glow=0},
 start(){},
 score:()=>coins,
 endTitle:r=>r==='time'?"Day's catch!":'Line snapped!',
 endLines:()=>[`Fish caught: ${caught}`,`Coins: ${coins}`,`Album: ${album.filter(a=>a).length} / ${FISH.length}`],
 idle(dt){T+=dt;moveFish(dt)},
 update(dt){T+=dt;const L=lure;
  if(L.mode==='down'){L.y=Math.min(botY-8*k,L.y+(botY-surfY)/2.1*dt);if(Math.random()<dt*8)burst(lx,L.y,1,'rgba(220,240,255,.7)',20*k,2*k,-60*k,.8)}
  else if(L.mode==='up'){L.upT+=dt;L.y-=(botY-surfY)/1.6*dt;if(L.y<=surfY+6*k){L.y=surfY+6*k;L.mode='idle';land()}}
  else L.y=surfY+6*k+Math.sin(T*3)*2*k;
  moveFish(dt);
  if(L.mode!=='idle'&&L.hooked.length<cap)for(const f of fish){if(f.hk||L.mode!=='up')continue;const hx=f.x+f.dir*f.L*.42;if(Math.hypot(hx-lx,f.y-L.y)<(9+f.L/k*.18)*k){if(f.t==='eel'){zap(f);break}hook(f,false);if(L.hooked.length>=cap)break}}
  while(fish.length<10+(runT>20?2:0))spawn(false);
  for(const r of flyers){r.t+=dt*1.8}flyers=flyers.filter(r=>r.t<1);for(const r of ring)r.t+=dt;ring=ring.filter(r=>r.t<1)},
 draw(){drawScene()},
 drawIcon(id,x,y,s){if(id==='glow'){const gr=g.createRadialGradient(x,y,0,x,y,s*.5);gr.addColorStop(0,'rgba(255,240,120,.95)');gr.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=gr;g.fillRect(x-s/2,y-s/2,s,s);drawLure(x,y,s*.09);drawFish(x-s*.32,y+s*.12,s*.3,FISH[2],1,0,0,T)}else{g.strokeStyle='#555';g.lineWidth=s*.04;g.beginPath();g.moveTo(x,y-s*.45);g.lineTo(x,y-s*.1);g.stroke();hookShape(x-s*.12,y,s*.5);hookShape(x+s*.12,y,s*.5)}}};
function hookShape(x,y,s){g.strokeStyle='#8a8f96';g.lineWidth=s*.08;g.lineCap='round';g.beginPath();g.moveTo(x,y-s*.2);g.lineTo(x,y+s*.15);g.arc(x-s*.12,y+s*.15,s*.12,0,Math.PI);g.lineTo(x-s*.24,y+s*.05);g.stroke()}
function pickType(b){const late=runT>20;if(late&&b>=2&&Math.random()<.22)return'eel';if(late&&b>=1&&Math.random()<.1)return'boot';const pool=FISH.map((f,i)=>i).filter(i=>FISH[i].b===b);let tot=pool.reduce((s,i)=>s+FISH[i].w,0),r=Math.random()*tot;for(const i of pool){r-=FISH[i].w;if(r<=0)return i}return pool[0]}
function spawn(init){const cnt=[0,0,0,0];for(const f of fish)cnt[f.b]++;const want=[3,3,3,2];let b=0,lack=-9;for(let i=0;i<4;i++){const d=want[i]-cnt[i]+Math.random()*.5;if(d>lack){lack=d;b=i}}const t=pickType(b),dir=Math.random()<.5?1:-1;
 const L=(t==='eel'?90:t==='boot'?30:FISH[t].l)*k;const y=surfY+20*k+bandH*(b+R(.2,.8));fish.push({t,b,dir,L,x:init?R(0,W):(dir>0?-L-R(0,80*k):W+L+R(0,80*k)),y,by:y,ph:R(0,6),sp:(t==='boot'?14:R(28,52)+b*6)*k,hk:false})}
function moveFish(dt){const L=lure;for(const f of fish){if(f.hk)continue;let sp=f.sp;
 if(G.glow&&L.mode!=='idle'&&f.t!=='eel'&&f.t!=='boot'){const d=Math.hypot(f.x-lx,f.y-L.y);if(d<170*k){const want=lx>f.x?1:-1;if(want!==f.dir&&Math.abs(lx-f.x)>f.L*.6)f.dir=want;f.by+=(L.y-f.by)*cl(dt*1.4,0,1);sp*=1.35;f.lit=1}else f.lit=0}else f.lit=0;
 f.x+=f.dir*sp*dt;f.y=f.by+Math.sin(f.ph+T*2)*5*k;f.by=cl(f.by,surfY+14*k,botY-10*k)}
 fish=fish.filter(f=>f.hk||(f.x>-f.L*2-120*k&&f.x<W+f.L*2+120*k))}
function hook(f,snapped){f.hk=true;lure.hooked.push(f);const L=lure;burst(lx,L.y,10,['#fff','#bfe8ff'],120*k,3*k,0,.5);tone(220,.08,'square',.05,440);
 if(f.t==='boot'){pop(lx,L.y-20*k,'Old boot...','#d8c8b0',UI(18));return}
 if(!snapped&&L.upT<.22){perfect(lx,L.y-30*k);coins+=1}else pop(lx,L.y-24*k,'Bite!','#fff',UI(20))}
function zap(f){f.hk=false;burst(lx,lure.y,24,['#fffb7a','#9effe0'],260*k,3*k,0,.5);shake=Math.max(shake,UI(10));tone(90,.3,'sawtooth',.07,50);hiss(.3,.12,3000);for(const h of lure.hooked)h.hk=false,h.dir*=-1;lure.hooked=[];lure.mode='idle';lure.y=surfY+6*k;f.dir*=-1;f.x+=f.dir*60*k;
 G.lives--;pop(lx,surfY+50*k,'ZAP! Line lost','#ffe866',UI(24),1);if(G.lives<=0)endRun('out')}
function land(){const hk=lure.hooked;lure.hooked=[];if(!hk.length)return;let n=0;
 for(const f of hk){fish.splice(fish.indexOf(f),1);flyers.push({f,t:0});if(f.t==='boot'){tone(150,.15,'triangle',.05);continue}
  const F=FISH[f.t];n++;caught++;coins+=F.v;coinSfx();pop(lx+(n-1)*40*k,surfY-30*k,'+'+F.v+' '+F.n,'#fff3a0',UI(20));
  if(!album[f.t]){album[f.t]=true;ring.push({i:f.t,t:0});pop(W/2,surfY+70*k,'NEW: '+F.n+'!','#9fffd0',UI(24),1);tone(784,.1,'triangle',.06,0,.15);tone(1175,.2,'triangle',.06,0,.25)}
  if(F.b>=3){shake=Math.max(shake,UI(8));burst(lx,surfY,30,['#ffe866','#fff'],300*k,4*k,300*k,.8)}}
 burst(lx,surfY,18,['#fff','#cfefff'],160*k,3*k,400*k,.7);hiss(.25,.08,900);
 if(n===2){pop(W/2,surfY+40*k,'DOUBLE CATCH! +3','#ffb347',UI(28),1);coins+=3;shake=Math.max(shake,UI(9))}}
function drawFish(x,y,L,F,dir,rot,sil,t){const h=L*.36,w=Math.sin(t*9+x*.05)*.22;g.save();g.translate(x,y);g.rotate(rot);g.scale(dir,1);const c=sil?'#0f2433':F.c;g.fillStyle=c;
 g.beginPath();g.moveTo(-L*.36,0);g.lineTo(-L*.6,-h*.65+w*h);g.lineTo(-L*.54,w*h*.5);g.lineTo(-L*.6,h*.65+w*h);g.closePath();g.fill();
 g.beginPath();g.moveTo(-L*.1,-h*.42);g.lineTo(L*.05,-h*.8);g.lineTo(L*.18,-h*.4);g.fill();
 g.beginPath();g.ellipse(0,0,L*.44,h*.5,0,0,TAU);g.fill();
 if(!sil){g.fillStyle=F.k;g.beginPath();g.ellipse(L*.03,h*.18,L*.3,h*.22,0,0,TAU);g.fill();
  if(F.st){g.fillStyle='rgba(0,0,0,.18)';for(let i=-1;i<2;i++){g.fillRect(i*L*.13-L*.025,-h*.42,L*.05,h*.6)}}
  if(F.sp){g.fillStyle='#ff7a3a';circ(-L*.1,-h*.12,h*.18,'#ff7a3a');circ(L*.12,-h*.2,h*.12,'#e84a2a')}
  if(F.wh){g.strokeStyle='#3a2e24';g.lineWidth=Math.max(1,L*.02);g.beginPath();g.moveTo(L*.4,h*.05);g.quadraticCurveTo(L*.55,h*.2,L*.6,h*.45);g.moveTo(L*.4,0);g.quadraticCurveTo(L*.6,-h*.05,L*.68,h*.2);g.stroke()}
  circ(L*.27,-h*.1,h*.15,'#fff');circ(L*.29,-h*.1,h*.08,'#152029')}
 g.restore()}
function drawEel(f){const n=10;g.lineCap='round';g.strokeStyle='#2c4a2a';g.lineWidth=11*k;g.beginPath();for(let i=0;i<=n;i++){const px=f.x-f.dir*f.L*(i/n-.5),py=f.y+Math.sin(T*6+i*.8)*5*k;i?g.lineTo(px,py):g.moveTo(px,py)}g.stroke();g.strokeStyle='#5e8a3a';g.lineWidth=3*k;g.stroke();const hx=f.x+f.dir*f.L*.5,hy=f.y+Math.sin(T*6)*5*k;circ(hx,hy,7*k,'#2c4a2a');circ(hx+f.dir*2*k,hy-2*k,2.4*k,'#fff36a');if(Math.random()<.1)burst(hx,hy,1,'#fffb7a',40*k,2*k,0,.3)}
function drawBoot(f){g.save();g.translate(f.x,f.y);g.rotate(Math.sin(T+f.ph)*.3);g.fillStyle='#6e4a2c';rr(-8*k,-14*k,12*k,22*k,3*k);g.fill();rr(-8*k,2*k,22*k,9*k,4*k);g.fill();g.fillStyle='#3c2818';g.fillRect(-8*k,8*k,22*k,3*k);g.restore()}
function drawLure(x,y,r){circ(x,y,r,'#e8463a');g.fillStyle='#fff';g.beginPath();g.arc(x,y,r,Math.PI,0);g.fill();circ(x,y,r*.3,'#222')}
function drawScene(){const L=lure;
 let gr=g.createLinearGradient(0,0,0,surfY);gr.addColorStop(0,'#ffcf9a');gr.addColorStop(1,'#ffe9c8');g.fillStyle=gr;g.fillRect(0,0,W,surfY);
 circ(W*.82,surfY*.62,26*k,'#fff4d8');g.fillStyle='#6b9a6a';g.beginPath();g.moveTo(0,surfY);for(let x=0;x<=W;x+=20)g.lineTo(x,surfY-14*k-Math.abs(Math.sin(x*.006))*28*k);g.lineTo(W,surfY);g.fill();
 g.fillStyle='#4f7d55';g.beginPath();g.moveTo(0,surfY);for(let x=0;x<=W;x+=16)g.lineTo(x,surfY-6*k-Math.abs(Math.sin(x*.013+1))*12*k);g.lineTo(W,surfY);g.fill();
 for(let i=0;i<4;i++){const y0=surfY+(i?20*k+bandH*i:0),y1=surfY+20*k+bandH*(i+1);g.fillStyle=BCOL[i];g.fillRect(0,y0,W,(i===3?H:y1)-y0+1);txt(BANDS[i],W-8*k,y0+14*k,UI(12),'rgba(255,255,255,.35)','right')}
 g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;g.beginPath();for(let x=0;x<=W;x+=8){const y=surfY+Math.sin(x*.05+T*2)*2;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
 g.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<6;i++){const x=(i*W/5+T*12*k)%(W+80)-40;g.beginPath();g.moveTo(x,surfY);g.lineTo(x+30*k,surfY);g.lineTo(x-60*k,botY);g.lineTo(x-110*k,botY);g.fill()}
 g.fillStyle='#2a3e3a';for(let x=0;x<W;x+=26*k){g.beginPath();g.ellipse(x,botY+10*k,18*k,10*k,0,0,TAU);g.fill()}
 for(let i=0;i<8;i++){const x=(i*137)%W;g.strokeStyle='#2f6a4a';g.lineWidth=3*k;g.beginPath();g.moveTo(x,botY);g.quadraticCurveTo(x+Math.sin(T+i)*12*k,botY-40*k,x+Math.sin(T*1.3+i)*8*k,botY-(60+i*7)*k);g.stroke()}
 if(G.glow&&L.mode!=='idle'){const gr2=g.createRadialGradient(lx,L.y,0,lx,L.y,170*k);gr2.addColorStop(0,'rgba(255,240,140,.35)');gr2.addColorStop(1,'rgba(255,240,140,0)');g.fillStyle=gr2;g.fillRect(lx-170*k,L.y-170*k,340*k,340*k)}
 for(const f of fish){if(f.hk)continue;if(f.t==='eel')drawEel(f);else if(f.t==='boot')drawBoot(f);else{if(f.lit)circ(f.x,f.y,f.L*.5,'rgba(255,240,140,.15)');drawFish(f.x,f.y,f.L,FISH[f.t],f.dir,0,0,T+f.ph)}}
 // boat + angler
 const by=surfY+Math.sin(T*1.6)*2*k,bx=lx-60*k;g.fillStyle='#a2582e';g.beginPath();g.moveTo(bx-56*k,by-14*k);g.lineTo(bx+46*k,by-14*k);g.lineTo(bx+34*k,by+6*k);g.lineTo(bx-46*k,by+6*k);g.closePath();g.fill();g.fillStyle='#c97a43';g.fillRect(bx-56*k,by-16*k,102*k,5*k);
 circ(bx-6*k,by-30*k,13*k,'#3d6f8e');circ(bx-4*k,by-48*k,10*k,'#f2c49b');g.fillStyle='#e9c547';g.beginPath();g.ellipse(bx-4*k,by-55*k,17*k,5*k,0,0,TAU);g.fill();rr(bx-12*k,by-66*k,16*k,12*k,5*k);g.fill();circ(bx,by-48*k,1.8*k,'#222');
 const tipX=lx,tipY=surfY-46*k;g.strokeStyle='#5a3a20';g.lineWidth=3*k;g.beginPath();g.moveTo(bx+4*k,by-30*k);g.lineTo(tipX,tipY);g.stroke();
 g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.2;g.beginPath();g.moveTo(tipX,tipY);g.lineTo(lx,L.y);g.stroke();
 L.hooked.forEach((f,i)=>{const yy=L.y+f.L*.45+i*4*k,xx=lx+(i?10:-4)*k;if(f.t==='boot')drawBoot({x:xx,y:yy,ph:0});else drawFish(xx,yy,f.L,FISH[f.t],1,-Math.PI/2+Math.sin(T*12)*.25,0,T)});
 drawLure(lx,L.y,6*k);
 for(const r of flyers){const t=r.t,x=lerp(lx,bx,t),y=surfY-Math.sin(t*Math.PI)*70*k;if(r.f.t==='boot')drawBoot({x,y,ph:0});else drawFish(x,y,r.f.L,FISH[r.f.t],-1,t*6,0,T)}
 // album
 const n=FISH.length,s=Math.min(W*(W>H?.5:.86)/n,UI(36)),ay=W>H?UI(70):Math.min(UI(84),surfY-48*k-s*.5),ax=W>H?W-n*s-12:W/2-n*s/2;
 g.fillStyle='rgba(40,25,10,.25)';rr(ax-4,ay-s*.45,n*s+8,s*.9,8);g.fill();
 for(let i=0;i<n;i++){const rg=ring.find(r=>r.i===i),sc=rg?1+Math.sin(rg.t*Math.PI)*.6:1;drawFish(ax+s*(i+.5),ay,s*.78*sc,FISH[i],1,0,!album[i],0)}}

// ===== shared one-button core =====
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=1,H=1,DPR=1;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const pick=a=>a[Math.random()*a.length|0];
const FONT="'Fredoka','Trebuchet MS',system-ui,sans-serif";
const UI=n=>n*cl(Math.min(W,H)/400,.82,1.6);
function fit(){DPR=Math.min(window.devicePixelRatio||1,3);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';if(G.resize)G.resize()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));

// ---- audio (generated in code) ----
let ac=null,muted=/[?&]mute=1/.test(location.search),nbuf=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,delay){if(muted||!ac)return;try{const t=ac.currentTime+(delay||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v||.08,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function hiss(d,v,f){if(muted||!ac)return;try{if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate*.6|0,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=ac.currentTime,s=ac.createBufferSource(),bp=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=nbuf;bp.type='bandpass';bp.frequency.value=f||1200;gn.gain.setValueAtTime(v||.1,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bp);bp.connect(gn);gn.connect(ac.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}
const coinSfx=()=>{tone(1320,.07,'square',.035);tone(1760,.12,'square',.03,0,.06)};

// ---- drawing helpers ----
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,size,col,align,stroke){g.font=`700 ${Math.round(size)}px ${FONT}`;g.textAlign=align||'center';g.textBaseline='middle';if(stroke){g.lineWidth=size*.2;g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function wrap(s,maxW,size){g.font=`700 ${Math.round(size)}px ${FONT}`;const out=[];let line='';for(const w of s.split(' ')){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fill()}
function coinIcon(x,y,r){circ(x,y,r,'#a8741a');circ(x,y,r*.82,'#f6c343');g.strokeStyle='#d9a12c';g.lineWidth=r*.14;g.beginPath();g.arc(x,y,r*.5,0,TAU);g.stroke();circ(x-r*.3,y-r*.3,r*.18,'#fff6c8')}
function heart(x,y,s,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s*.9,y-s*.2,x-s*.4,y-s*.85,x,y-s*.35);g.bezierCurveTo(x+s*.4,y-s*.85,x+s*.9,y-s*.2,x,y+s*.35);g.fill()}
function lockIcon(x,y,s){g.strokeStyle='#cfc6b8';g.lineWidth=s*.16;g.beginPath();g.arc(x,y-s*.15,s*.32,Math.PI,0);g.stroke();g.fillStyle='#cfc6b8';rr(x-s*.48,y-s*.15,s*.96,s*.72,s*.12);g.fill();circ(x,y+s*.15,s*.11,'#5b5348')}

// ---- fx ----
let parts=[],pops=[],shake=0;
function burst(x,y,n,col,sp,sz,grav,life){for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.25,1)*(sp||150);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:(life||.6)*R(.6,1.25),c:Array.isArray(col)?pick(col):col,s:(sz||4)*R(.6,1.3),gr:grav||0})}}
function pop(x,y,t,col,size,big){pops.push({x,y,t,c:col||'#fff',s:size||UI(22),l:0,big:!!big})}
function perfect(x,y){pop(x,y,'PERFECT!','#ffe866',UI(32),1);shake=Math.max(shake,UI(9));tone(990,.1,'triangle',.07);tone(1480,.22,'triangle',.06,0,.07)}
function fxShift(dx){for(const p of parts)p.x+=dx;for(const p of pops)p.x+=dx}
function updFx(dt){for(const p of parts){p.l+=dt;p.vx*=1-1.8*dt;p.vy*=1-1.8*dt;p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.l<p.m);for(const p of pops)p.l+=dt*.9;pops=pops.filter(p=>p.l<1);shake=Math.max(0,shake-dt*40)}
function drawFx(){for(const p of parts){g.globalAlpha=cl(1-p.l/p.m,0,1);circ(p.x,p.y,p.s*(1-.5*p.l/p.m),p.c)}g.globalAlpha=1;
 for(const p of pops){const k=p.l,sc=p.big?(k<.12?.4+k/.12:1.4-Math.min(.4,(k-.12)*2)):(k<.08?.6+k*5:1);g.globalAlpha=cl((1-k)*2.5,0,1);txt(p.t,cl(p.x,UI(60),W-UI(60)),p.y-k*UI(46),p.s*sc,p.c,'center','rgba(35,20,12,.85)')}g.globalAlpha=1}

// ---- mute toggle (only extra control) ----
function muteBox(){const s=Math.round(cl(Math.min(W,H)*.08,30,44));return{x:W-s-8,y:8,s}}
function drawMute(){const b=muteBox(),s=b.s;g.save();g.globalAlpha=.8;g.fillStyle='rgba(0,0,0,.35)';rr(b.x,b.y,s,s,s*.25);g.fill();g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=s*.07;g.lineCap='round';const x=b.x+s*.2,y=b.y+s*.5;g.beginPath();g.moveTo(x,y-s*.1);g.lineTo(x+s*.13,y-s*.1);g.lineTo(x+s*.3,y-s*.24);g.lineTo(x+s*.3,y+s*.24);g.lineTo(x+s*.13,y+s*.1);g.lineTo(x,y+s*.1);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+s*.42,y-s*.12);g.lineTo(x+s*.64,y+s*.12);g.moveTo(x+s*.64,y-s*.12);g.lineTo(x+s*.42,y+s*.12)}else{g.arc(x+s*.32,y,s*.14,-.9,.9);g.moveTo(x+s*.32+s*.26*Math.cos(-.9),y+s*.26*Math.sin(-.9));g.arc(x+s*.32,y,s*.26,-.9,.9)}g.stroke();g.restore()}

// ---- flow: ready -> play -> choose -> play -> end ----
let state='ready',runT=0,endT=0,coins=0,choice=null,upg=null,offered=false,held=false,endReason='time',best=0,newBest=false;
const grace=()=>runT<20;
try{best=+localStorage.getItem(G_KEY)||0}catch(e){}
function press(){
 if(state==='ready'){state='play';runT=0;G.start&&G.start();G.down();return}
 if(state==='play'){G.down();return}
 if(state==='choose'){if(choice.t<.6)return;const u=G.upgrades[choiceSel()];upg=u.id;state='play';tone(523,.1,'triangle',.07);tone(784,.1,'triangle',.07,0,.08);tone(1046,.25,'triangle',.07,0,.16);burst(W/2,H/2,40,['#ffe866','#fff','#ffb347'],UI(420),UI(5),0,.8);pop(W/2,H*.42,u.name+'!','#ffe866',UI(34),1);G.onUpgrade&&G.onUpgrade(upg);return}
 if(state==='end'&&endT>1.1)restart()}
function release(){if(state==='play')G.up&&G.up()}
function restart(){parts=[];pops=[];coins=0;upg=null;offered=false;choice=null;runT=0;endT=0;state='ready';G.reset()}
const choiceSel=()=>Math.floor(choice.t/.85)%2;
function offerUpgrade(){offered=true;state='choose';choice={t:0,last:-1};tone(660,.12,'triangle',.07);tone(880,.18,'triangle',.07,0,.1)}
function endRun(r){if(state!=='play')return;state='end';endT=0;endReason=r||'time';const sc=G.score();newBest=sc>best;if(newBest){best=sc;try{localStorage.setItem(G_KEY,best)}catch(e){}}tone(r==='time'?660:300,.2,'triangle',.08);tone(r==='time'?880:200,.4,'triangle',.08,0,.18)}

// ---- input: one button (pointer anywhere / Space) ----
function inMute(x,y){const b=muteBox();return x>=b.x-8&&y<=b.y+b.s+8}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();if(inMute(e.clientX,e.clientY)){muted=!muted;if(!muted)tone(660,.1,'triangle',.08);return}if(held)return;held=true;press()});
const rel=()=>{if(!held)return;held=false;release()};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);addEventListener('blur',rel);
addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();if(e.repeat||held)return;audioOn();held=true;press()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();rel()}});
['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));

// ---- shared screens ----
function drawHud(){const y=UI(24);coinIcon(UI(22),y,UI(11));txt(''+coins,UI(39),y+1,UI(22),'#fff','left','rgba(0,0,0,.55)');
 if(state!=='ready'){const left=Math.max(0,G.roundLen-runT),bw=Math.min(W*.3,UI(150)),bx=W/2-bw/2,bh=UI(10);g.fillStyle='rgba(0,0,0,.35)';rr(bx,y-bh/2,bw,bh,bh/2);g.fill();g.fillStyle=left<10?'#ff7a6a':'#fff3c4';rr(bx,y-bh/2,Math.max(bh,bw*left/G.roundLen),bh,bh/2);g.fill();txt(Math.ceil(left)+'s',bx+bw+UI(8),y+1,UI(15),'#fff','left','rgba(0,0,0,.5)')}
 if(G.lives!=null&&state!=='ready'){const y2=UI(52);if(grace())txt('Safe start '+Math.ceil(20-runT)+'s',UI(12),y2,UI(14),'#c8ffd0','left','rgba(0,0,0,.5)');else for(let i=0;i<G.maxLives;i++)heart(UI(20)+i*UI(24),y2,UI(18),i<G.lives?'#ff5a6e':'rgba(0,0,0,.3)')}
 if(upg){const u=G.upgrades.find(v=>v.id===upg);txt('✦ '+u.name,W/2,UI(46),UI(14),'#ffe866','center','rgba(0,0,0,.55)')}}
function drawHint(){const t=performance.now()/1000,y=G.hintY?G.hintY():H*.86;g.font=`700 100px ${FONT}`;const m=g.measureText(G.hint).width/100,s=Math.min(UI(24),W*.88/(m+1.4)),tw=(m+1.4)*s;g.globalAlpha=.8+.2*Math.sin(t*4);g.fillStyle='rgba(20,15,30,.62)';rr(W/2-tw/2,y-s*.95,tw,s*1.9,s*.95);g.fill();g.globalAlpha=1;txt(G.hint,W/2,y+1,s,'#fff')}
function drawChoice(){const t=choice.t,sel=choiceSel();if(sel!==choice.last){choice.last=sel;if(t>.05)tone(sel?620:520,.05,'square',.03)}
 g.fillStyle='rgba(10,14,30,.66)';g.fillRect(0,0,W,H);
 const portrait=W<H*1.05,q=Math.min(UI(1),H/(portrait?620:420),W/(portrait?380:680));let cw,ch,pos,ty;
 if(portrait){cw=Math.min(W*.88,330*q);ch=170*q;ty=H/2-ch-64*q;pos=[[W/2,H/2-ch/2+6*q],[W/2,H/2+ch/2+24*q]]}
 else{cw=Math.min(W*.42,300*q);ch=220*q;ty=H/2-ch/2-58*q;pos=[[W/2-cw/2-14*q,H/2+16*q],[W/2+cw/2+14*q,H/2+16*q]]}
 txt('Choose an upgrade',W/2,ty,30*q,'#fff','center','rgba(0,0,0,.5)');txt(t<.6?'get ready...':'Tap when your card glows',W/2,ty+30*q,17*q,'#ffe9a8');
 G.upgrades.forEach((u,i)=>{const on=i===sel&&t>.15,[cx,cy]=pos[i],sc=on?1.05:.94;g.save();g.translate(cx,cy);g.scale(sc,sc);
  if(on){g.shadowColor='#ffe866';g.shadowBlur=24*q}g.fillStyle=on?'#fff7e6':'#a9a39a';rr(-cw/2,-ch/2,cw,ch,16*q);g.fill();g.shadowBlur=0;
  g.lineWidth=4*q;g.strokeStyle=on?'#ffb52e':'#6d675f';g.stroke();
  if(portrait){const ic=ch*.6;G.drawIcon(u.id,-cw/2+ic*.62,0,ic);const tx=-cw/2+ic*1.22,tw=cw/2-tx-12*q;txt(u.name,tx,-ch*.3,21*q,'#3a2a1a','left');const ls=wrap(u.desc,tw,14*q);ls.slice(0,5).forEach((l,j)=>txt(l,tx,-ch*.1+j*17*q,14*q,'#5a4a38','left'))}
  else{const ic=ch*.36;G.drawIcon(u.id,0,-ch*.25,ic);txt(u.name,0,ch*.03,22*q,'#3a2a1a');const ls=wrap(u.desc,cw-26*q,14*q);ls.slice(0,4).forEach((l,j)=>txt(l,0,ch*.17+j*17*q,14*q,'#5a4a38'))}
  if(on&&t>.6){const f=(t%.85)/.85;g.fillStyle='#ffb52e';rr(-cw/2+14*q,ch/2-12*q,(cw-28*q)*(1-f),5*q,2.5*q);g.fill()}
  g.restore()})}
function drawEnd(){g.fillStyle='rgba(8,12,24,.68)';g.fillRect(0,0,W,H);const q=Math.min(UI(1),H*.95/400,W*.95/380),pw=Math.min(W*.94,440*q),ph=400*q,px=W/2-pw/2,py=H/2-ph/2;
 g.fillStyle='#fff7e6';rr(px,py,pw,ph,20*q);g.fill();g.lineWidth=4*q;g.strokeStyle='#ffb52e';g.stroke();
 txt(G.endTitle(endReason),W/2,py+38*q,30*q,'#3a2a1a');
 const ls=G.endLines();ls.forEach((l,i)=>txt(l,W/2,py+84*q+i*27*q,19*q,'#5a4a38'));
 txt(newBest?'New best: '+best+'!':'Best: '+best,W/2,py+84*q+ls.length*27*q+4*q,16*q,newBest?'#e0761a':'#8a7a66');
 txt('Coming next',W/2,py+232*q,15*q,'#8a7a66');const bw=(pw-48*q)/3;
 G.locked.forEach((n,i)=>{const bx=px+16*q+i*(bw+8*q),by=py+246*q;g.fillStyle='#4b443c';rr(bx,by,bw,84*q,12*q);g.fill();lockIcon(bx+bw/2,by+28*q,26*q);const nl=wrap(n,bw-8*q,13*q);nl.forEach((l,j)=>txt(l,bx+bw/2,by+60*q+j*14*q-(nl.length-1)*7*q,13*q,'#f1e7d6'))});
 if(endT>1.1){g.globalAlpha=.6+.4*Math.sin(endT*5);txt('Tap to play again',W/2,py+ph-30*q,22*q,'#e0761a');g.globalAlpha=1}}

// ---- main loop (delta time) ----
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(state==='play'){runT+=dt;G.update(dt);if(state==='play'&&runT>=G.roundLen)endRun('time');
  if(state==='play'&&!offered&&runT>12&&(coins>=G.upCoins||runT>=30)&&(!G.safe||G.safe()||runT>38))offerUpgrade()}
 else if(state==='choose')choice.t+=dt;
 else if(G.idle)G.idle(dt);
 if(state==='end')endT+=dt;
 updFx(dt);
 g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);g.save();if(shake>.2)g.translate(R(-shake,shake),R(-shake,shake));G.draw();drawFx();g.restore();
 drawHud();if(state==='ready')drawHint();if(state==='choose')drawChoice();if(state==='end')drawEnd();drawMute();
 requestAnimationFrame(frame)}
function boot(){fit();G.reset();requestAnimationFrame(t=>{last=t;frame(t)})}

boot();
})();
</script>
