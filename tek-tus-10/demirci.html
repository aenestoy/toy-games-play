<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Forge Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a0f0b;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
// ================= core =================
const cv=document.getElementById('c'),g=cv.getContext('2d');
const FONT='"Alfa Slab One",Georgia,serif',FB='system-ui,"Segoe UI",Roboto,Arial,sans-serif';
let VW=1,VH=1,DPR=1,S=1,TS=1;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);VW=Math.max(1,innerWidth);VH=Math.max(1,innerHeight);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';layout()}
addEventListener('resize',resize);
let ac=null,muted=/[?&]mute=1/.test(location.search),nbuf=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t=ac.currentTime+(dl||0),o=ac.createOscillator(),k=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);k.gain.setValueAtTime(v||.06,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,v,fc,type){if(muted||!ac)return;try{if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),k=ac.createGain();s.buffer=nbuf;f.type=type||'lowpass';f.frequency.value=fc||1200;k.gain.setValueAtTime(v||.1,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(k);k.connect(ac.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,sz,col,al,stroke,font){g.font=Math.round(sz)+'px '+(font||FONT);g.textAlign=al||'center';g.textBaseline='middle';if(stroke){g.lineWidth=sz*.2;g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function wrapT(s,x,y,maxW,sz,col){g.font='600 '+Math.round(sz)+'px '+FB;g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';const ws=s.split(' '),ls=[];let line='';for(const w of ws){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){ls.push(line);line=w}else line=t}ls.push(line);const lh=sz*1.28;ls.forEach((l,i)=>g.fillText(l,x,y+(i-(ls.length-1)/2)*lh))}
function muteRect(){const s=Math.max(34,Math.min(VW,VH)*.065);return{x:VW-s-10,y:10,w:s,h:s}}
function inMute(x,y){const m=muteRect();return x>=m.x-8&&x<=m.x+m.w+8&&y>=m.y-8&&y<=m.y+m.h+8}
function drawMute(){const m=muteRect(),u=m.w/10,cx=m.x+m.w*.4,cy=m.y+m.h/2;g.save();g.globalAlpha=.8;g.fillStyle='rgba(0,0,0,.35)';rr(m.x,m.y,m.w,m.h,m.w*.25);g.fill();g.strokeStyle=g.fillStyle='#fff';g.lineWidth=Math.max(2,m.w*.07);g.lineCap='round';g.beginPath();g.moveTo(cx-3*u,cy-1.5*u);g.lineTo(cx-1.3*u,cy-1.5*u);g.lineTo(cx+.6*u,cy-3.2*u);g.lineTo(cx+.6*u,cy+3.2*u);g.lineTo(cx-1.3*u,cy+1.5*u);g.lineTo(cx-3*u,cy+1.5*u);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(cx+2.2*u,cy-2*u);g.lineTo(cx+4.6*u,cy+2*u);g.moveTo(cx+4.6*u,cy-2*u);g.lineTo(cx+2.2*u,cy+2*u)}else{g.arc(cx+1*u,cy,2.3*u,-.9,.9);g.moveTo(cx+1*u+3.9*u*Math.cos(-.9),cy+3.9*u*Math.sin(-.9));g.arc(cx+1*u,cy,3.9*u,-.9,.9)}g.stroke();g.restore()}
let held=false;
function pDown(x,y){audioOn();if(x!==undefined&&inMute(x,y)){muted=!muted;if(!muted)tone(660,.08,'triangle',.06);return}if(held)return;held=true;onDown()}
function pUp(){if(!held)return;held=false}
addEventListener('pointerdown',e=>{e.preventDefault();pDown(e.clientX,e.clientY)},{passive:false});
addEventListener('pointerup',pUp);addEventListener('pointercancel',pUp);addEventListener('blur',pUp);
addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();if(!e.repeat)pDown()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key===' ')pUp()});
['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(n=>addEventListener(n,e=>e.preventDefault(),{passive:false}));
let parts=[],pops=[],shake=0;
function burst(x,y,n,col,sp,life,sz,grav,up){for(let i=0;i<n;i++){const a=up?R(-Math.PI*.95,-Math.PI*.05):R(0,TAU),v=R(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*R(.6,1),m:life,s:sz*R(.6,1.25),c:col,gr:grav||0})}}
function pop(t,x,y,col,sz){pops.push({t,x,y,c:col,s:sz||1,l:1})}
function updFx(dt){for(const p of parts){p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of pops){p.l-=dt*.85;p.y-=dt*36*TS}pops=pops.filter(p=>p.l>0);shake=Math.max(0,shake-dt*40)}
function drawFx(){for(const p of parts){g.globalAlpha=cl(p.l/p.m,0,1);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}g.globalAlpha=1;for(const p of pops){const k=1+.5*Math.max(0,(p.l-.82)/.18);g.globalAlpha=cl(p.l*1.6,0,1);txt(p.t,p.x,p.y,26*TS*p.s*k,p.c,'center','rgba(0,0,0,.75)')}g.globalAlpha=1}
// two-card choice: a marker alternates, the single tap takes the marked card
function drawChoice(opts,t){g.fillStyle='rgba(12,6,3,.78)';g.fillRect(0,0,VW,VH);const port=VW<VH*1.05,ty=VH*(port?.13:.14);
txt('Choose an upgrade',VW/2,ty,30*TS,'#ffd98a','center','#000');wrapT('The glow jumps between cards. Tap to take the lit one.',VW/2,ty+34*TS,VW*.86,15*TS,'#f1e2cc');
const sel=Math.floor(t/.9)%2;let cw,ch,P;
if(port){cw=Math.min(VW*.88,460);ch=Math.min(cw*.48,VH*.26);P=[[VW/2,VH*.43],[VW/2,VH*.43+ch+18*TS]]}else{cw=Math.min(VW*.38,420);ch=Math.min(cw*.78,VH*.56);P=[[VW/2-cw/2-12*TS,VH*.58],[VW/2+cw/2+12*TS,VH*.58]]}
opts.forEach((o,i)=>{const [x,y]=P[i],on=i===sel,k=on?1+.03*Math.sin(t*12):.96;g.save();g.translate(x,y);g.scale(k,k);if(on){g.shadowColor='#ffc04a';g.shadowBlur=30}g.fillStyle=on?'#4a2a17':'#2a1a12';rr(-cw/2,-ch/2,cw,ch,16);g.fill();g.shadowBlur=0;g.lineWidth=on?4:2;g.strokeStyle=on?'#ffc04a':'#6a4a36';g.stroke();g.globalAlpha=on?1:.6;
if(port){o.icon(-cw/2+ch*.42,0,ch*.3);txt(o.name,ch*.42,-ch*.24,22*TS,'#ffe3a8');wrapT(o.desc,ch*.42,ch*.14,cw-ch*.95,14.5*TS,'#f3e6d6')}
else{o.icon(0,-ch*.2,ch*.17);txt(o.name,0,ch*.08,23*TS,'#ffe3a8');wrapT(o.desc,0,ch*.3,cw*.86,15*TS,'#f3e6d6')}
if(on){g.globalAlpha=.6+.4*Math.sin(t*10);txt('TAP',port?-cw/2+ch*.42:0,port?ch*.36:-ch*.43,15*TS,'#fff','center','#000')}g.restore()});return sel}
function drawLock(x,y,s){g.fillStyle='#8a7a6a';g.strokeStyle='#8a7a6a';g.lineWidth=s*.16;g.beginPath();g.arc(x,y-s*.15,s*.32,Math.PI,0);g.stroke();rr(x-s*.48,y-s*.15,s*.96,s*.72,s*.12);g.fill();g.fillStyle='#2a1d14';g.beginPath();g.arc(x,y+s*.15,s*.11,0,TAU);g.fill()}
function drawEnd(title,lines,locked,t,col){g.fillStyle='rgba(12,6,3,.82)';g.fillRect(0,0,VW,VH);const port=VW<VH*1.05;
txt(title,VW/2,VH*.14,36*TS,col,'center','#000');lines.forEach((l,i)=>txt(l,VW/2,VH*.25+i*30*TS,i?18*TS:24*TS,i?'#f1e2cc':'#fff','center','#000',i?FB:FONT));
const ry=VH*(port?.62:.64);txt('Coming next',VW/2,ry-(port?70:80)*TS,16*TS,'#c9a77e','center',null,FB);
const w=Math.min((VW-40)/3-10,190*TS),h=Math.min(w*1.05,VH*.24);locked.forEach((n,i)=>{const x=VW/2+(i-1)*(w+12);g.fillStyle='#24170f';rr(x-w/2,ry-h/2,w,h,12);g.fill();g.strokeStyle='#5a4230';g.lineWidth=2;g.setLineDash([6,5]);g.stroke();g.setLineDash([]);drawLock(x,ry-h*.15,Math.min(w,h)*.32);g.font='700 '+Math.round(13.5*TS)+'px '+FB;g.fillStyle='#d8c5ad';g.textAlign='center';g.fillText(n,x,ry+h*.24);g.font='600 '+Math.round(10.5*TS)+'px '+FB;g.fillStyle='#8a7562';g.fillText('LOCKED',x,ry+h*.39)});
if(t>.9){g.globalAlpha=.55+.45*Math.sin(t*5);txt('Tap to play again',VW/2,VH*.88,24*TS,'#ffd98a','center','#000');g.globalAlpha=1}}

// ================= Forge Shop =================
const ROUND=75,SAFE=20;
let cx=0,fy=0,bgC=null;
const X=u=>cx+u*S,Y=u=>fy+u*S;
let best=0;try{best=+localStorage.getItem('forgeShopBest')||0}catch(e){}
let state='ready',stT=0,T=0,coins=0,hearts=3,sold=0,upg=null,offered=false,phase=0,cyc=0,cycP=1.25,lastHit=-1,strikes=[],twinCyc=-9,hamT=0,twinT=0,trans=0,deliver=null,queue=[],combo=0,flawless=0,coinFly=[],endTitle='',time=0,ignoreT=0;
const ADVC=['#3f6fb0','#9c3b3b','#3e8a57','#7a4ea3','#b0802c','#2f8a8c'];
function newAdv(slot,fromOff){return{slot,x:fromOff?qx(slot)+260:qx(slot),c:ADVC[(Math.random()*ADVC.length)|0],hat:(Math.random()*4)|0,t:R(0,6),st:'q',stars:-1,face:-1}}
function qx(i){return 150+i*44}
function reset(){T=0;coins=0;hearts=3;sold=0;upg=null;offered=false;combo=0;flawless=0;coinFly=[];parts=[];pops=[];queue=[];for(let i=0;i<4;i++)queue.push(newAdv(i,false));newBlade()}
function newBlade(){strikes=[];phase=0;cyc=0;lastHit=-1;twinCyc=-9;cycP=basePeriod();deliver=null}
function basePeriod(){return lerp(1.3,.8,cl((T-12)/58,0,1))}
const OPTS=[{id:'twin',name:'Twin Hammer',desc:'Every PERFECT strike lands a free second strike on the next peak.',icon:(x,y,r)=>{hamIcon(x-r*.35,y,r,-.4,'#c9d4e2');hamIcon(x+r*.35,y,r,.4,'#8fd0ff')}},
{id:'quench',name:'Quench Bucket',desc:'The peak lasts much longer, and time slows near the top.',icon:(x,y,r)=>{g.fillStyle='#7a5434';g.beginPath();g.moveTo(x-r*.7,y-r*.5);g.lineTo(x+r*.7,y-r*.5);g.lineTo(x+r*.55,y+r*.75);g.lineTo(x-r*.55,y+r*.75);g.closePath();g.fill();g.fillStyle='#5ab8ff';g.fillRect(x-r*.62,y-r*.5,r*1.24,r*.22);g.strokeStyle='#cfe8ff';g.lineWidth=r*.1;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(x+i*r*.35,y-r*.65);g.quadraticCurveTo(x+i*r*.35+r*.2,y-r*.9,x+i*r*.35,y-r*1.15);g.stroke()}}}];
function hamIcon(x,y,r,a,col){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='#6b4423';g.fillRect(-r*.08,-r*.4,r*.16,r*1.2);g.fillStyle=col;rr(-r*.42,-r*.75,r*.84,r*.4,r*.08);g.fill();g.restore()}
function layout(){S=Math.min(VW/430,VH/560);TS=cl(Math.min(VW,VH)/480,.9,1.7);cx=VW/2;fy=VH*(VW<VH?.66:.72);buildBg()}
function buildBg(){bgC=document.createElement('canvas');bgC.width=cv.width;bgC.height=cv.height;const b=bgC.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);
let gr=b.createLinearGradient(0,0,0,fy);gr.addColorStop(0,'#160c08');gr.addColorStop(1,'#3b2216');b.fillStyle=gr;b.fillRect(0,0,VW,fy);
const bw=46*S,bh=22*S;b.strokeStyle='rgba(0,0,0,.28)';b.lineWidth=Math.max(1,1.5*S);for(let r=0,y=fy;y>-bh;y-=bh,r++){b.beginPath();b.moveTo(0,y);b.lineTo(VW,y);b.stroke();for(let x=(r%2)*bw/2;x<VW;x+=bw){b.beginPath();b.moveTo(x,y);b.lineTo(x,y-bh);b.stroke()}}
gr=b.createLinearGradient(0,fy,0,VH);gr.addColorStop(0,'#2a1810');gr.addColorStop(1,'#120a06');b.fillStyle=gr;b.fillRect(0,fy,VW,VH-fy);b.strokeStyle='rgba(255,180,120,.06)';for(let i=1;i<8;i++){const y=fy+(VH-fy)*Math.pow(i/8,1.6);b.beginPath();b.moveTo(0,y);b.lineTo(VW,y);b.stroke()}
// furnace
const fx0=X(-235),fx1=X(-120);b.fillStyle='#2b1d17';b.beginPath();b.moveTo(fx0,fy);b.lineTo(fx0,Y(-150));b.quadraticCurveTo((fx0+fx1)/2,Y(-215),fx1,Y(-150));b.lineTo(fx1,fy);b.fill();b.fillStyle='#120806';b.beginPath();b.moveTo(X(-215),Y(-40));b.lineTo(X(-215),Y(-120));b.quadraticCurveTo(X(-177),Y(-160),X(-140),Y(-120));b.lineTo(X(-140),Y(-40));b.fill();
b.fillStyle='#24170f';b.fillRect(X(-200),Y(-330),X(-155)-X(-200),Y(-200)-Y(-330));
// tool rack
b.strokeStyle='#5a3a24';b.lineWidth=6*S;b.beginPath();b.moveTo(X(120),Y(-300));b.lineTo(X(300),Y(-300));b.stroke();b.fillStyle='rgba(20,12,8,.8)';for(let i=0;i<4;i++){const x=X(140+i*42);b.fillRect(x-2*S,Y(-300),4*S,60*S);b.fillRect(x-10*S,Y(-245)+i%2*8*S,20*S,12*S)}
gr=b.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.3,VW/2,VH/2,Math.max(VW,VH)*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');b.fillStyle=gr;b.fillRect(0,0,VW,VH)}

function windows(){return upg==='quench'?[.12,.22]:[.055,.14]}
function frac(){return phase-Math.floor(phase)}
function tri(){return 1-2*Math.abs(frac()-.5)}
function onDown(){
 if(state==='ready'){state='play';stT=0;reset();tone(330,.12,'triangle',.07);return}
 if(state==='choice'){if(stT>.6){const o=OPTS[Math.floor(stT/.9)%2];upg=o.id;state='play';stT=0;pop(o.name+'!',VW/2,VH*.3,'#8fe0ff',1.1);tone(523,.1,'triangle',.08);tone(784,.18,'triangle',.08,0,.1);newBlade()}return}
 if(state==='end'){if(stT>.9){reset();state='play';stT=0;tone(330,.12,'triangle',.07)}return}
 if(trans>0)return;
 if(cyc===lastHit){tone(140,.05,'square',.03);return}
 const d=Math.abs(frac()-.5),[pw,gw]=windows();strike(d<pw?'p':d<gw?'g':'m',false)}
function strike(q,twin){if(!twin)lastHit=cyc;strikes.push(q);if(twin)twinT=.2;else hamT=.2;const ix=X(0),iy=Y(-80);
 if(q==='p'){combo++;shake=Math.min(16,7+combo*1.5);burst(ix,iy,30,'#ffd65a',420*S,.7,6*S,700*S,true);burst(ix,iy,12,'#fff',260*S,.35,4*S,0);pop(twin?'TWIN!':'PERFECT',ix,iy-70*S,twin?'#8fe0ff':'#ffe066',twin?.9:1.15);tone(880+combo*40,.09,'square',.06);tone(1320,.14,'triangle',.05,0,.03);noise(.12,.12,4000,'highpass');if(upg==='twin'&&!twin&&strikes.length<5)twinCyc=cyc+1}
 else if(q==='g'){combo=0;burst(ix,iy,14,'#ff9a3a',300*S,.5,5*S,700*S,true);pop('GOOD',ix,iy-60*S,'#ffb35a',.85);tone(520,.08,'square',.05);noise(.1,.1,2500)}
 else{combo=0;burst(ix,iy,8,'#777',180*S,.5,5*S,600*S,true);pop('MISS',ix,iy-60*S,'#ff6a5a',.85);tone(110,.16,'sawtooth',.06,70);noise(.18,.12,600)}
 if(strikes.length>=5)finishSword()}
function finishSword(){const m=strikes.filter(q=>q==='m').length,p=strikes.filter(q=>q==='p').length,sum=strikes.reduce((a,q)=>a+(q==='p'?1:q==='g'?.6:0),0);
 const stars=m>=3?0:cl(Math.round(sum),1,5),pay=[1,3,5,8,12,18][stars]+(p===5?6:0);twinCyc=-9;
 trans=1.25;deliver={t:0,stars,pay,ok:true};const f=queue.find(a=>a.slot===0&&a.st==='q');if(f){f.st='get';f.stars=stars}
 coins+=pay;sold++;if(p===5)flawless++;
 for(let i=0;i<Math.min(14,pay);i++)coinFly.push({x:X(R(-30,30)),y:Y(-90),t:-i*.05-.45,sx:0,sy:0});
 if(stars===0){pop('CRACKED!',VW/2,Y(-150),'#ff6a5a',1.1);noise(.4,.15,900)}else{pop('★'.repeat(stars),VW/2,Y(-150),'#ffe066',1.2);for(let i=0;i<stars;i++)tone(600+i*120,.1,'triangle',.06,0,.25+i*.07)}
 if(p===5){pop('FLAWLESS +6',VW/2,Y(-190),'#8fffb0',.9);shake=18}
 if(T>SAFE&&stars<=1){hearts--;pop('Unhappy customer!',VW/2,Y(-230),'#ff7a6a',.8)}
 burst(X(0),Y(-90),26,'rgba(230,240,255,.8)',140*S,1.1,10*S,-200*S,true);noise(.6,.08,2500,'highpass')}
function endRun(title){state='end';stT=0;endTitle=title;if(coins>best){best=coins;try{localStorage.setItem('forgeShopBest',best)}catch(e){}}tone(392,.15,'triangle',.07);tone(330,.15,'triangle',.07,0,.15);tone(262,.3,'triangle',.07,0,.3)}

function update(dt){time+=dt;stT+=dt;updFx(dt);
 for(const a of queue){a.t+=dt;if(a.st==='q'){const tx=qx(a.slot);a.mv=Math.abs(a.x-tx)>1;a.x+=cl(tx-a.x,-110*dt,110*dt)}else if(a.st==='leave'){a.mv=true;a.x+=120*dt}else a.mv=false}
 queue=queue.filter(a=>!(a.st==='leave'&&X(a.x)>VW+80*S));
 for(const c of coinFly){c.t+=dt}coinFly=coinFly.filter(c=>{if(c.t>=.6){tone(1400,.03,'square',.025);return false}return true});
 if(state==='ready'){phase+=dt/1.3;return}
 if(state!=='play')return;
 T+=dt;
 if(trans>0){deliver.t+=dt;trans-=dt;if(trans<=0){const f=queue.find(a=>a.st==='get');if(f){f.st='leave';f.face=1}queue.forEach(a=>{if(a.st==='q')a.slot--});queue.push(newAdv(3,true));newBlade();
   if(hearts<=0){endRun('Shop closed!');return}
   if(!offered&&((sold>=3&&coins>=36)||T>=32)){offered=true;state='choice';stT=0;tone(660,.1,'triangle',.07);tone(990,.16,'triangle',.07,0,.1);return}}}
 else{const near=Math.abs(frac()-.5)<.22,sp=(upg==='quench'&&near)?.42:1;phase+=dt/cycP*sp;const c=Math.floor(phase);if(c!==cyc){cyc=c;cycP=basePeriod()*(T>40?R(.86,1.14):1);if(cyc>lastHit+1&&lastHit>=0&&strikes.length){combo=0}}
   if(twinCyc===cyc&&frac()>=.5){twinCyc=-9;strike('p',true)}}
 hamT=Math.max(0,hamT-dt);twinT=Math.max(0,twinT-dt);
 if(T>=ROUND&&trans<=0)endRun('Closing time!')}
