(()=>{
'use strict';

function resize(){DPR=Math.min(window.devicePixelRatio||1,3);VW=Math.max(1,innerWidth);VH=Math.max(1,innerHeight);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';layout()}
addEventListener('resize',resize);
let ac=null,muted=/[?&]mute=1/.test(location.search),nbuf=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type,v,f2,dl){if(muted||!ac)return;try{const t=ac.currentTime+(dl||0),o=ac.createOscillator(),k=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);k.gain.setValueAtTime(v||.06,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}

function muteRect(){const s=Math.max(34,Math.min(VW,VH)*.065);return{x:VW-s-10,y:10,w:s,h:s}}

function drawMute(){const m=muteRect(),u=m.w/10,cx=m.x+m.w*.4,cy=m.y+m.h/2;g.save();g.globalAlpha=.8;g.fillStyle='rgba(0,0,0,.35)';rr(m.x,m.y,m.w,m.h,m.w*.25);g.fill();g.strokeStyle=g.fillStyle='#fff';g.lineWidth=Math.max(2,m.w*.07);g.lineCap='round';g.beginPath();g.moveTo(cx-3*u,cy-1.5*u);g.lineTo(cx-1.3*u,cy-1.5*u);g.lineTo(cx+.6*u,cy-3.2*u);g.lineTo(cx+.6*u,cy+3.2*u);g.lineTo(cx-1.3*u,cy+1.5*u);g.lineTo(cx-3*u,cy+1.5*u);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(cx+2.2*u,cy-2*u);g.lineTo(cx+4.6*u,cy+2*u);g.moveTo(cx+4.6*u,cy-2*u);g.lineTo(cx+2.2*u,cy+2*u)}else{g.arc(cx+1*u,cy,2.3*u,-.9,.9);g.moveTo(cx+1*u+3.9*u*Math.cos(-.9),cy+3.9*u*Math.sin(-.9));g.arc(cx+1*u,cy,3.9*u,-.9,.9)}g.stroke();g.restore()}
let held=false;

let parts=[],pops=[],shake=0;
function burst(x,y,n,col,sp,life,sz,grav,up){for(let i=0;i<n;i++){const a=up?R(-Math.PI*.95,-Math.PI*.05):R(0,TAU),v=R(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*R(.6,1),m:life,s:sz*R(.6,1.25),c:col,gr:grav||0})}}

function updFx(dt){for(const p of parts){p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of pops){p.l-=dt*.85;p.y-=dt*36*TS}pops=pops.filter(p=>p.l>0);shake=Math.max(0,shake-dt*40)}

// two-card choice: a marker alternates, the single tap takes the marked card

opts.forEach((o,i)=>{const [x,y]=P[i],on=i===sel,k=on?1+.03*Math.sin(t*12):.96;g.save();g.translate(x,y);g.scale(k,k);if(on){g.shadowColor='#ffe066';g.shadowBlur=30}g.fillStyle=on?'#1f4f7a':'#173550';rr(-cw/2,-ch/2,cw,ch,16);g.fill();g.shadowBlur=0;g.lineWidth=on?4:2;g.strokeStyle=on?'#ffe066':'#4a7090';g.stroke();g.globalAlpha=on?1:.6;
if(port){o.icon(-cw/2+ch*.42,0,ch*.3);txt(o.name,ch*.42,-ch*.24,22*TS,'#fff3a0');wrapT(o.desc,ch*.42,ch*.14,cw-ch*.95,14.5*TS,'#eef6ff')}
else{o.icon(0,-ch*.2,ch*.17);txt(o.name,0,ch*.08,23*TS,'#fff3a0');wrapT(o.desc,0,ch*.3,cw*.86,15*TS,'#eef6ff')}

function drawEnd(title,lines,locked,t,col){g.fillStyle='rgba(10,30,50,.84)';g.fillRect(0,0,VW,VH);const port=VW<VH*1.05;
txt(title,VW/2,VH*.14,36*TS,col,'center','#000');lines.forEach((l,i)=>txt(l,VW/2,VH*.25+i*30*TS,i?18*TS:24*TS,i?'#e6f2ff':'#fff','center','#000',i?FB:FONT));

const w=Math.min((VW-40)/3-10,190*TS),h=Math.min(w*1.05,VH*.24);locked.forEach((n,i)=>{const x=VW/2+(i-1)*(w+12);g.fillStyle='#143048';rr(x-w/2,ry-h/2,w,h,12);g.fill();g.strokeStyle='#4a7090';g.lineWidth=2;g.setLineDash([6,5]);g.stroke();g.setLineDash([]);drawLock(x,ry-h*.15,Math.min(w,h)*.32);g.font='700 '+Math.round(13.5*TS)+'px '+FB;g.fillStyle='#d5e6f5';g.textAlign='center';g.fillText(n,x,ry+h*.24);g.font='600 '+Math.round(10.5*TS)+'px '+FB;g.fillStyle='#8aa6c0';g.fillText('LOCKED',x,ry+h*.39)});
if(t>.9){g.globalAlpha=.55+.45*Math.sin(t*5);txt('Tap to play again',VW/2,VH*.88,24*TS,'#fff3a0','center','#000');g.globalAlpha=1}}

// ================= Kite Post =================
const ROUND=80,SAFE=20,MAXC=6;
let KS=1,sc=1,gy=0,KX=0,visW=1,skyC=null;
const SX=x=>(x-cam)*sc,SY=a=>gy-a*sc;
let best=0;try{best=+localStorage.getItem('kitePostBest')||0}catch(e){}
let state='ready',stT=0,T=0,time=0,cam=0,coins=0,lives=3,deliv=0,upg=null,offered=false,ky=330,vy=0,inv=0,carry=[],items=[],drops=[],nextX=0,lastMail=0,houseN=0,mult=1,birdT=4,endTitle='',spin=0;
const HC=['#e8b07a','#d98b7a','#9fc0d8','#c9d6a0','#e3cf8f','#c7a6d6'],RC=['#8a3a32','#4a5a7a','#6a4a3a','#3a6a5a'];
function ceil(){return upg==='long'?985:760}
function layout(){sc=Math.min(VH/1120,VW/600);S=sc;TS=cl(Math.min(VW,VH)/480,.9,1.7);gy=VH*.93;KS=cl(.55/sc,1,1.7);visW=VW/sc;KX=visW*.3;skyC=document.createElement('canvas');skyC.width=cv.width;skyC.height=cv.height;const b=skyC.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);const gr=b.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#5fa8e0');gr.addColorStop(.6,'#bfe3f2');gr.addColorStop(1,'#fdf1d0');b.fillStyle=gr;b.fillRect(0,0,VW,VH);const sg=b.createRadialGradient(VW*.82,VH*.18,5,VW*.82,VH*.18,VH*.25);sg.addColorStop(0,'rgba(255,250,210,.95)');sg.addColorStop(.25,'rgba(255,240,180,.5)');sg.addColorStop(1,'rgba(255,240,180,0)');b.fillStyle=sg;b.fillRect(0,0,VW,VH)}
function reset(){T=0;cam=0;coins=0;lives=3;deliv=0;upg=null;offered=false;ky=330;vy=0;inv=0;carry=[];items=[];drops=[];parts=[];pops=[];houseN=0;lastMail=0;mult=1;birdT=4;nextX=KX+260;while(nextX<visW+400)gen()}
function gen(){const x=nextX;houseN++;const mail=houseN===2||(houseN>2&&(Math.random()<.42||houseN-lastMail>=3));if(mail)lastMail=houseN;const w=R(110,150),h=R(120,200);
 items.push({k:'house',x,w,h,mail,done:false,c:HC[(Math.random()*HC.length)|0],r:RC[(Math.random()*RC.length)|0]});
 if(!mail&&(houseN<3||Math.random()<.75))items.push({k:'let',x:x+w/2,a:h+30,v:1});
 if(Math.random()<.65)items.push({k:'let',x:x+R(0,w+140),a:R(480,550),v:1});
 if(Math.random()<.55)items.push({k:'let',x:x+R(0,220),a:R(880,935),v:2,gold:true});
 if(houseN>3&&Math.random()<.35)items.push({k:'let',x:x+R(40,260),a:R(300,700),v:1});
 let gap=R(150,250);
 if(houseN>2&&Math.random()<.55){const tx=x+w+gap*.5+40,th=R(250,350),br=[],nb=houseN>6?2:1;for(let i=0;i<nb;i++)br.push({s:Math.random()<.5?-1:1,a:th-R(50,120),l:R(60,95)});items.push({k:'tree',x:tx,h:th,br});gap+=90}
 nextX=x+w+gap}
const OPTS=[{id:'long',name:'Long String',desc:'Fly much higher and ride the golden fast wind. Gold letters pay double.',icon:(x,y,r)=>{g.strokeStyle='#fff';g.lineWidth=r*.08;g.beginPath();g.moveTo(x-r*.8,y+r*.9);g.quadraticCurveTo(x-r*.6,y-r*.2,x+r*.3,y-r*.6);g.stroke();kiteShape(x+r*.35,y-r*.65,r/90,0,'#ff6a5a','#ffd65a');g.strokeStyle='#ffd65a';g.lineWidth=r*.07;for(let i=0;i<3;i++){g.beginPath();g.moveTo(x-r*.9+i*r*.25,y-r*.95+i*r*.18);g.lineTo(x-r*.2+i*r*.25,y-r*.95+i*r*.18);g.stroke()}}},
{id:'ribbon',name:'Ribbon Tail',desc:'Letters drop by themselves at any mailbox you pass, and loose letters fly to you.',icon:(x,y,r)=>{const cs=['#ff5a5a','#ffb03a','#ffe14a','#5ad07a','#5aa8ff','#a77aff'];for(let i=0;i<6;i++){g.fillStyle=cs[i];g.fillRect(x-r*.1+i*r*.2-r*.5,y+Math.sin(i*1.2)*r*.25,r*.2,r*.16)}kiteShape(x-r*.6,y-r*.2,r/90,0,'#5aa8ff','#fff');envelope(x+r*.6,y-r*.55,r*.5,false)}}];
function kiteShape(x,y,s,a,c1,c2){g.save();g.translate(x,y);g.rotate(a);g.scale(s,s);const P=[[0,-38],[26,-6],[0,40],[-26,-6]];const C=[c1,c2,c1,c2];for(let i=0;i<4;i++){g.fillStyle=C[i];g.beginPath();g.moveTo(0,0);g.lineTo(P[i][0],P[i][1]);g.lineTo(P[(i+1)%4][0],P[(i+1)%4][1]);g.closePath();g.fill()}g.strokeStyle='rgba(60,30,20,.7)';g.lineWidth=2;g.beginPath();g.moveTo(0,-38);g.lineTo(0,40);g.moveTo(-26,-6);g.lineTo(26,-6);g.stroke();g.restore()}
function envelope(x,y,w,gold){const h=w*.66;g.fillStyle=gold?'#ffd65a':'#fffaf0';g.fillRect(x-w/2,y-h/2,w,h);g.strokeStyle=gold?'#b07a10':'#9a8a70';g.lineWidth=Math.max(1,w*.07);g.strokeRect(x-w/2,y-h/2,w,h);g.beginPath();g.moveTo(x-w/2,y-h/2);g.lineTo(x,y+h*.1);g.lineTo(x+w/2,y-h/2);g.stroke();g.fillStyle='#d23a3a';g.beginPath();g.arc(x,y+h*.08,w*.09,0,TAU);g.fill()}
function onDown(){
 if(state==='ready'){reset();state='play';stT=0;tone(392,.12,'triangle',.06);return}
 if(state==='choice'){if(stT>.6){const o=OPTS[Math.floor(stT/.9)%2];upg=o.id;state='play';stT=0;pop(o.name+'!',VW/2,VH*.3,'#fff3a0',1.1);tone(523,.1,'triangle',.08);tone(784,.18,'triangle',.08,0,.1);held=false}return}

function deliver(h){const n=carry.reduce((a,v)=>a+v,0),low=ky-h.h<130,many=carry.length>=3,pay=n*5+(many?5:0),kx=cam+KX;coins+=pay;deliv+=carry.length;h.done=true;
 carry.forEach((v,i)=>drops.push({x0:kx,a0:ky-40,x1:h.x+h.w+20,a1:50,t:-i*.08,gold:v>1}));carry=[];
 const px=SX(h.x+h.w+20),py=SY(110);if(low||many){pop('PERFECT DROP',px,py-40*TS,'#ffe066',1.05);shake=11;burst(px,py,26,'#ffe066',360*sc*2,.8,7*sc*2,600*sc,true);tone(784,.1,'square',.05);tone(1046,.12,'square',.05,0,.08);tone(1318,.2,'triangle',.05,0,.16)}else{tone(660,.1,'triangle',.06);tone(880,.14,'triangle',.06,0,.08)}

function hit(){inv=1.4;vy=-280;shake=9;noise(.25,.14,900);tone(180,.2,'sawtooth',.05,90);const kx=cam+KX;burst(SX(kx),SY(ky),18,'#fff',300*sc*2,.6,6*sc*2,400*sc);
 carry.forEach(v=>items.push({k:'let',x:kx+R(-20,80),a:ky+R(-30,20),v,gold:v>1,loose:true}));const had=carry.length;carry=[];
 if(T>SAFE){lives--;pop(lives>0?'Ouch!':'Snap!',SX(kx),SY(ky)-50*TS,'#ff6a5a',1)}else pop(had?'Letters dropped!':'Bump!',SX(kx),SY(ky)-50*TS,'#ffb35a',.85);
 if(lives<=0)endRun('String snapped!')}
function endRun(t){state='end';stT=0;endTitle=t;if(coins>best){best=coins;try{localStorage.setItem('kitePostBest',best)}catch(e){}}tone(523,.15,'triangle',.07);tone(440,.15,'triangle',.07,0,.15);tone(349,.3,'triangle',.07,0,.3)}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=cl(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t)}
function update(dt){time+=dt;stT+=dt;updFx(dt);spin+=dt;
 if(state==='ready'){ky=330+Math.sin(time*1.6)*25;cam+=40*dt;while(nextX<cam+visW+300)gen();return}
 for(const d of drops)d.t+=dt*1.6;drops=drops.filter(d=>d.t<1);
 if(state!=='play')return;
 T+=dt;const c=ceil();vy+=(held?1300:-950)*dt;vy=cl(vy,-340,430);ky+=vy*dt;if(ky>c){ky=c;if(vy>0)vy=0}if(ky<70){ky=70;if(vy<0)vy=0}
 const tgt=(ky>860&&ky<955)?2.1:(ky>470&&ky<560)?1.5:1;mult=lerp(mult,tgt,cl(dt*3,0,1));cam+=(210+T*1.6)*mult*dt;spin+=dt*mult;
 while(nextX<cam+visW+300)gen();
 birdT-=dt;if(T>6&&birdT<=0){birdT=lerp(3.2,1.1,cl(T/70,0,1))*R(.7,1.3);items.push({k:'bird',x:cam+visW+80,a:R(280,740),b:R(0,6)})}
 const kx=cam+KX,rib=upg==='ribbon';inv-=dt;
 for(const it of items){
  if(it.k==='bird'){it.x-=95*dt;it.b+=dt;it.ay=it.a+Math.sin(it.b*2.2)*30;if(inv<=0&&Math.hypot(kx-it.x,ky-it.ay)<42){hit();if(state!=='play')return}}
  else if(it.k==='let'){if(it.loose){it.a-=45*dt;if(it.a<18)it.gone=true}const d=Math.hypot(kx-it.x,ky-it.a);if(rib&&inv<.8&&d<190&&carry.length<MAXC){const k=Math.min(1,520*dt/d);it.x+=(kx-it.x)*k;it.a+=(ky-it.a)*k}
