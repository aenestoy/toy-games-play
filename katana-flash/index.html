<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#120814" />
    <title>Katana Flash</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120814; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Phaser centres the canvas itself (Scale.CENTER_BOTH); a flex parent would centre it a second time. */
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      [hidden] { display: none !important; }

      /* Portals, phone held upright: the arena is landscape, so ask for a turn (the game keeps running underneath). */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        body:not(.gated) #rotate { display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(18, 8, 20, 0.92); color: #fff; font: 900 26px Impact, "Arial Black", sans-serif; letter-spacing: 0.04em; text-align: center; pointer-events: none; }
      }
      .phone { width: 46px; height: 76px; border: 5px solid #fff; border-radius: 11px; animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); border-color: #ff2a3a; } }

      /* Our own pages on a phone: start gate. PLAY goes fullscreen and sideways (src/fullscreen.ts). */
      #gate {
        position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: min(5vh, 28px);
        padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
        background: radial-gradient(circle at 50% 42%, rgba(255, 240, 170, 0.55), rgba(255, 150, 90, 0.25) 28%, transparent 55%), linear-gradient(#ffbf6a, #e8506a 45%, #35143f);
        color: #fff; font-family: Impact, "Arial Black", sans-serif; text-align: center; touch-action: manipulation;
      }
      #gate h1 { margin: 0; line-height: 0.86; font-weight: 900; transform: rotate(-4deg); }
      #gate h1 span { display: block; font-size: min(22vw, 17vh, 150px); -webkit-text-stroke: 5px #0b0710; paint-order: stroke fill; text-shadow: 4px 4px 0 #0b0710; }
      #gate h1 span + span { color: #ff2a3a; font-size: min(19vw, 15vh, 130px); }
      #gate .slash { width: min(70vw, 420px); height: 6px; background: linear-gradient(90deg, transparent, #fff 20%, #ff2a3a 80%, transparent); transform: rotate(-8deg); box-shadow: 0 0 18px #ff2a3a; }
      #gate-play {
        font: inherit; font-size: min(10vw, 44px); letter-spacing: 0.06em; color: #fff; background: #d3202f; border: 5px solid #0b0710; border-radius: 18px;
        padding: 0.35em 1.4em; box-shadow: 0 8px 0 #0b0710; cursor: pointer; animation: pulse 1.2s ease-in-out infinite;
      }
      #gate-play:active { transform: translateY(5px); box-shadow: 0 3px 0 #0b0710; }
      @keyframes pulse { 50% { transform: scale(1.06); } }
      #gate p { margin: 0; font: 700 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.85); max-width: 30em; }
      #gate .turn { display: none; flex-direction: column; align-items: center; gap: 14px; font-size: 24px; letter-spacing: 0.04em; }
      #gate.asked #gate-play, #gate.asked .hint { display: none; }
      #gate.asked .turn { display: flex; }
      @media (prefers-reduced-motion: reduce) { #gate-play, .phone { animation: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-CbYDeZ-O.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><i class="phone"></i>TURN YOUR PHONE</div>
    <div id="gate" hidden>
      <h1><span>KATANA</span><span>FLASH</span></h1>
      <div class="slash"></div>
      <button id="gate-play" type="button">PLAY</button>
      <p class="hint">Plays full screen, sideways.</p>
      <div class="turn">
        <i class="phone"></i>TURN YOUR PHONE
        <p>For full screen: Share → Add to Home Screen, then open it from there.</p>
      </div>
    </div>
  </body>
</html>
