    <title>Katana Flash</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120814; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Phaser centres the canvas itself (Scale.CENTER_BOTH); a flex parent would centre it a second time. */
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      /* Phones held upright: the arena is landscape, so ask for a turn (the game keeps running underneath). */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(18, 8, 20, 0.92); color: #fff; font: 900 26px Impact, "Arial Black", sans-serif; letter-spacing: 0.04em; text-align: center; pointer-events: none; }
        #rotate i { width: 56px; height: 92px; border: 5px solid #fff; border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
        @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); border-color: #ff2a3a; } }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Cz0Km1cp.js"></script>
  </head>

    <div id="rotate"><i></i>TURN YOUR PHONE</div>
