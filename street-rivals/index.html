<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d1020" />
    <title>Street Rivals (prototype)</title>
    
    <script type="module" crossorigin src="./assets/street-C7QMLbFu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/street-DnNViMi2.css">

  <body>
    <div id="game"></div>
    <div id="touch" class="st-touch" hidden>
      <div class="st-pads l"><div class="stb" data-zone="left">◀</div><div class="stb" data-zone="right">▶</div></div>

    <div id="labels"></div>
    <div id="hud" hidden></div>
    <div id="screen"></div>
    <div id="toasts"></div>
    <div id="modal" hidden></div>
    <div id="boot"><div class="boot-logo">STREET <b>RIVALS</b></div><div class="boot-bar"><i></i></div></div>
